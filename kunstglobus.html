e die Sonne scheint. Salzkristalle bedrohten den Putz, sodass das Getty Conservation Institute das Grab 1986 bis 1992 aufwendig restaurierte. Das Grab zeigt die Rolle königlicher Frauen und die hohe Kunst der Wandmalerei im Neuen Reich."},{"k":"a081","b":0,"t":"Büste der Nofretete","a":"Werkstatt des Thutmosis","j":"ca. 1340 v. Chr.","y":-1340,"e":1,"r":"Afrika","o":["Amarna, Ägypten",27.646,30.903],"x":"Die bemalte Kalksteinbüste der Königin Nofretete, Frau des Pharao Echnaton, ist eines der bekanntesten Kunstwerke der Welt und ein Inbegriff von Schönheit. Sie trägt eine hohe blaue Krone mit goldenem Band, ein farbiger Halskragen schmückt ihre Schultern. Das Gesicht ist vollkommen symmetrisch und lebensnah zugleich, nur das linke Auge wurde nie eingesetzt. Die Büste war ein Modell in der Werkstatt des Bildhauers Thutmosis, an dem andere Bildnisse ausgerichtet wurden. Sie entstand in der Amarnazeit, als Echnaton den Sonnengott Aton zum einzigen Gott erhob und die Kunst naturnäher wurde. Computertomografien zeigten unter der Oberfläche einen Kern mit Falten, die später geglättet wurden. Die Büste ist eine Ikone Berlins und zugleich das bekannteste Beispiel einer Rückgabeforderung zwischen Ägypten und Deutschland.","s":["Neues Museum, Berlin",52.521,13.397]},{"k":"a082","b":0,"t":"Goldmaske des Tutanchamun","a":"Neues Reich","j":"ca. 1323 v. Chr.","y":-1323,"e":1,"r":"Afrika","o":["Theben, Ägypten",25.74,32.601],"x":"Die Totenmaske des jungen Pharao Tutanchamun ist das berühmteste Objekt des Alten Ägypten. Sie besteht aus elf Kilogramm Gold, eingelegt mit Lapislazuli, Karneol, Quarz und farbigem Glas. Der König trägt das gestreifte Nemes-Kopftuch, den Götterbart, Geier und Kobra auf der Stirn als Zeichen für Ober- und Unterägypten. Die Maske lag direkt auf dem Gesicht der Mumie und sollte dem Toten im Jenseits göttliche Gestalt verleihen. Tutanchamun war ein eher unbedeutender König, der mit etwa 19 Jahren starb. Berühmt wurde er, weil sein Grab 1922 fast unberührt gefunden wurde, mit über 5000 Objekten. Die Entdeckung löste eine weltweite Ägyptomanie aus, die Mode, Architektur und Film prägte, und machte die Maske zum Symbol für Ägypten schlechthin.","s":["Ägyptisches Museum, Kairo / Gizeh",30.048,31.234]},{"k":"a083","b":0,"t":"Nok-Terrakotta","a":"Nok-Kultur","j":"ca. 500 v. Chr.","y":-500,"e":1,"r":"Afrika","o":["Nok, Nigeria",9.7,8.4],"x":"Die Terrakotten der Nok-Kultur sind die ältesten bekannten großen figürlichen Skulpturen Afrikas südlich der Sahara. Sie zeigen Köpfe und Figuren mit dreieckigen oder halbrunden Augen, durchbohrten Pupillen und kunstvollen Frisuren. Die Köpfe sind oft lebensgroß und stark stilisiert, mit großen Ohren und geschwungenen Lippen. Die Nok-Kultur kannte auch die Eisenverhüttung und gehört zu den frühesten Eisenzeitkulturen Westafrikas. Wozu die Figuren dienten, ob als Ahnenbilder, Grabbeigaben oder Kultobjekte, ist nicht sicher bekannt. Ein großes Problem sind Raubgrabungen, die Fundzusammenhänge zerstören und Fälschungen in den Kunsthandel bringen. Archäologische Projekte, etwa der Universität Frankfurt, versuchen in Nigeria, das Wissen über diese Kultur systematisch zu sichern.","s":["Honolulu Museum of Art, USA",21.305,-157.845]},{"k":"a084","b":0,"t":"Simbabwe-Vogel","a":"Shona, Great Zimbabwe","j":"ca. 1250","y":1250,"e":2,"r":"Afrika","o":["Great Zimbabwe",-20.267,30.934],"x":"In den Ruinen von Great Zimbabwe, der größten vorkolonialen Steinstadt im südlichen Afrika, wurden acht Vogelfiguren aus Speckstein gefunden. Sie sitzen auf hohen Säulen und verbinden Merkmale von Raubvögeln mit menschlichen Zügen, etwa Zehen statt Krallen. Vermutlich stellen sie Ahnen von Königen dar, die als Boten zwischen Menschen und Göttern galten. Great Zimbabwe war vom 11. bis 15. Jahrhundert ein Zentrum des Goldhandels bis nach China und Arabien. Europäische Kolonisten behaupteten lange, die Stadt könne nicht von Afrikanern gebaut worden sein, eine rassistische Lüge, die erst die Archäologie widerlegte. Heute ist der Vogel das Nationalsymbol Simbabwes und auf Flagge und Wappen zu sehen. Er steht für die Wiederaneignung afrikanischer Geschichte."},{"k":"a085","b":0,"t":"Kopf von Ife","a":"Yoruba, Ife","j":"ca. 1300","y":1300,"e":2,"r":"Afrika","o":["Ife, Nigeria",7.467,4.567],"x":"Die Köpfe aus Ife gehören zu den naturalistischsten Bildnissen der Kunstgeschichte, vergleichbar mit antiker oder Renaissanceskulptur. Gegossen aus Messing oder Kupfer im Wachsausschmelzverfahren, zeigen sie ruhige, ebenmäßige Gesichter mit feinen parallelen Linien, die Narbentatauierung oder Perlenschleier andeuten. Wahrscheinlich stellen sie Onis dar, die heiligen Könige von Ife, das als Ursprungsort der Yoruba gilt. Kleine Löcher am Haaransatz dienten vermutlich zur Befestigung von Kronen oder Haaren. Als der Ethnologe Leo Frobenius 1910 erste Funde machte, hielt er sie für Werke einer verschwundenen Mittelmeerkultur, weil er sie Afrikanern nicht zutraute. Diese Fehleinschätzung zeigt die Vorurteile der Kolonialzeit. Heute gelten die Ife-Köpfe als Meisterwerke afrikanischer Kunst von Weltrang.","s":["British Museum, London",51.519,-0.127]},{"k":"a086","b":0,"t":"Benin-Bronzen","a":"Königreich Benin","j":"16. bis 17. Jh.","y":1550,"e":3,"r":"Afrika","o":["Benin City, Nigeria",6.335,5.604],"x":"Die Benin-Bronzen sind Tausende von Reliefplatten, Köpfen und Figuren aus Messing und Elfenbein, die für den Königspalast von Benin geschaffen wurden. Die Platten schmückten die Pfeiler des Palasts und zeigen den Oba, also den König, mit Kriegern, Würdenträgern, Musikern und portugiesischen Händlern. Sie sind damit ein Geschichtsarchiv in Metall, das Hofzeremoniell und Handelsbeziehungen dokumentiert. Das Messing kam über den Handel mit Europäern ins Land, oft in Form von Armreifen, sogenannten Manillas. Gegossen wurden die Werke von einer erblichen Gießergilde, die bis heute existiert. 1897 plünderten britische Truppen den Palast und verkauften die Beute in alle Welt. Die Benin-Bronzen sind deshalb das zentrale Beispiel der Debatte um koloniale Raubkunst und Rückgaben.","s":["British Museum, London",51.519,-0.127]},{"k":"a087","b":0,"t":"Cueva de las Manos","a":"Jäger und Sammler Patagoniens","j":"ca. 7300 v. Chr.","y":-7300,"e":0,"r":"Amerika","o":["Patagonien, Argentinien",-47.154,-70.661],"x":"An den Wänden einer Felshöhle im argentinischen Patagonien prangen Hunderte Hände in Rot, Weiß, Schwarz und Gelb. Sie entstanden als Negative, indem Pigment über die an den Fels gelegte Hand geblasen wurde, vermutlich durch Röhrchen aus Knochen. Die meisten sind linke Hände, wohl weil die rechte das Blasrohr hielt. Dazwischen finden sich Jagdszenen mit Guanakos, einer wilden Verwandten des Lamas, und geometrische Muster. Die Bilder entstanden über Jahrtausende und gehören zu den ältesten Zeugnissen menschlicher Kultur in Südamerika. Eine Hand an der Wand ist eine der ursprünglichsten Formen, Anwesenheit zu bezeugen, ein Ich war hier. Das gleiche Motiv findet sich in Höhlen in Europa, Indonesien und Australien, es scheint ein universelles Zeichen der Menschheit zu sein."},{"k":"a088","b":0,"t":"Olmekenkopf","a":"Olmeken","j":"ca. 1100 v. Chr.","y":-1100,"e":1,"r":"Amerika","o":["San Lorenzo, Veracruz, Mexiko",17.75,-94.75],"x":"Die Kolossalköpfe der Olmeken sind die frühesten Monumentalskulpturen Mesoamerikas. Die Olmeken gelten als Mutterkultur, auf der Maya, Azteken und andere später aufbauten. Bisher sind 17 Köpfe bekannt, bis zu drei Meter hoch und bis zu 50 Tonnen schwer, aus Basalt, der über viele Kilometer transportiert wurde. Jeder Kopf trägt einen helmartigen Kopfschmuck und hat individuelle Gesichtszüge, vermutlich handelt es sich um Porträts von Herrschern. Die Köpfe wurden ohne Metallwerkzeuge bearbeitet, was die Organisation einer komplexen Gesellschaft voraussetzt. Manche wurden später absichtlich beschädigt oder umgearbeitet, wohl bei Herrscherwechseln. Der Kopf aus San Lorenzo im Museum von Xalapa gilt als einer der eindrucksvollsten und steht für den Beginn der Hochkulturen Amerikas.","s":["Anthropologisches Museum, Xalapa",19.544,-96.91]},{"k":"a089","b":0,"t":"Moche-Porträtgefäß","a":"Moche","j":"ca. 400","y":400,"e":1,"r":"Amerika","o":["Nordperu",-8.112,-79.029],"x":"Die Porträtgefäße der Moche zählen zu den lebensnächsten Bildnissen der alten Welt außerhalb Europas. Die Moche lebten an der Nordküste Perus und hatten keine Schrift, doch ihre Keramik erzählt von Herrschern, Kriegern, Priestern, Kranken und Gottheiten. Die Köpfe zeigen individuelle Züge, Falten, Narben und Mimik, manche Personen lassen sich sogar über mehrere Lebensalter hinweg verfolgen. Kopfschmuck, Gesichtsbemalung und Ohrpflöcke weisen auf Rang und Rolle hin. Die Gefäße haben einen typischen Bügelausguss und wurden in Modeln hergestellt, also in Serien. Sie wurden als Grabbeigaben in Elitegräbern gefunden. Für die Kunstgeschichte zeigen sie, dass Porträtkunst in ganz unterschiedlichen Kulturen unabhängig voneinander entstanden ist.","s":["Musée du quai Branly, Paris",48.861,2.298]},{"k":"a090","b":0,"t":"Kolibri von Nazca","a":"Nazca-Kultur","j":"ca. 500","y":500,"e":1,"r":"Amerika","o":["Nazca, Peru",-14.739,-75.13],"x":"In der Wüste im Süden Perus zogen die Nazca riesige Linien, geometrische Figuren und Tierbilder in den Boden, darunter einen fast hundert Meter langen Kolibri. Sie entfernten dazu die dunklen, oxidierten Steine an der Oberfläche, sodass der hellere Boden sichtbar wurde. Wegen des trockenen, windarmen Klimas sind die Linien seit rund 1500 Jahren erhalten. Ganz erkennen kann man die Figuren nur aus der Luft, was zu wilden Spekulationen über Außerirdische führte. Die Forschung deutet sie heute als Ritualwege, die abgegangen wurden, als Bitten um Wasser in einer extrem trockenen Region oder als Markierungen von Wasserläufen. Die deutsche Mathematikerin Maria Reiche erforschte und schützte die Linien ein halbes Jahrhundert lang. Sie sind ein frühes Beispiel für Land Art, lange bevor es diesen Begriff gab."},{"k":"a091","b":0,"t":"Jademaske des Pakal","a":"Maya","j":"683","y":683,"e":2,"r":"Amerika","o":["Palenque, Mexiko",17.484,-92.046],"x":"Die Totenmaske des Maya-Königs Pakal des Großen ist aus über 300 Jadeplättchen zusammengesetzt, die Augen sind aus Muschel und Obsidian. Pakal herrschte 68 Jahre über Palenque, eine der längsten Regierungszeiten der Weltgeschichte. Die Maske zeigt ihn als Maisgott, der stirbt und wiedergeboren wird, ein Versprechen ewigen Lebens. Jade galt den Maya wertvoller als Gold, weil seine grüne Farbe für Wasser, Mais und Leben stand. Das Grab wurde 1952 tief im Inneren des Tempels der Inschriften entdeckt, hinter einer versteckten Treppe. Der Sarkophagdeckel mit dem Bild des fallenden Königs ist ebenfalls berühmt und wurde von Pseudowissenschaftlern als Astronaut gedeutet. Die Maske ist eines der Hauptwerke der Maya-Kunst und ein nationales Symbol Mexikos.","s":["Anthropologisches Museum, Mexiko-Stadt",19.426,-99.186]},{"k":"a092","b":0,"t":"Wandbilder von Bonampak","a":"Maya","j":"ca. 790","y":790,"e":2,"r":"Amerika","o":["Chiapas, Mexiko",16.705,-91.064],"x":"In drei kleinen Räumen eines Tempels im Regenwald von Chiapas sind die am besten erhaltenen Wandmalereien der Maya zu sehen. Sie erzählen in einer Abfolge von einer Thronfolgezeremonie, einer Schlacht und der Vorführung und Bestrafung von Gefangenen. Musiker mit Trommeln, Rasseln und Trompeten, Tänzer in Kostümen und Würdenträger in prächtiger Kleidung sind lebendig dargestellt. Die Schlachtszene zeigt ein Gewirr von Körpern und Speeren, wie es selten in der vorspanischen Kunst vorkommt. Die Bilder widerlegten die alte Vorstellung von den Maya als friedlichem Volk von Astronomen. Sie wurden 1946 von einem amerikanischen Fotografen bekannt gemacht, nachdem lokale Lakandonen ihn hingeführt hatten. Sie sind die wichtigste Quelle für Kleidung, Musik und Zeremonien der Maya."},{"k":"a093","b":0,"t":"Goldfloß der Muisca","a":"Muisca","j":"ca. 1200 bis 1500","y":1300,"e":2,"r":"Amerika","o":["Kolumbien",4.31,-74.3],"x":"Das kleine goldene Floß zeigt einen Herrscher, umgeben von Begleitern, auf einem Floß aus Binsen. Es bezieht sich auf eine Zeremonie am See Guatavita, bei der ein neuer Herrscher mit Goldstaub bedeckt auf den See fuhr und Gold als Opfergabe ins Wasser warf. Aus Berichten über diese Zeremonie entstand die Legende von El Dorado, dem Vergoldeten. Spanische Eroberer suchten jahrhundertelang vergeblich nach einem Land aus Gold und versuchten sogar, den See trockenzulegen. Das Floß wurde in der Technik des Wachsausschmelzens aus einer Goldlegierung namens Tumbaga gegossen. Es ist das berühmteste Objekt des Goldmuseums in Bogotá, das über 30.000 Goldobjekte besitzt. Es steht für die Kunst der Goldschmiede Südamerikas und für den Mythos, der die Eroberung antrieb.","s":["Goldmuseum, Bogotá",4.602,-74.072]},{"k":"a094","b":0,"t":"Sonnenstein (Aztekischer Kalenderstein)","a":"Azteken","j":"ca. 1500","y":1500,"e":3,"r":"Amerika","o":["Tenochtitlan (Mexiko-Stadt)",19.433,-99.133],"x":"Der 24 Tonnen schwere Sonnenstein ist das bekannteste Kunstwerk der Azteken. In seiner Mitte blickt ein Gesicht mit herausgestreckter Zunge, meist als Sonnengott Tonatiuh oder Erdgott gedeutet. Um ihn herum liegen vier Felder für die vier vergangenen Weltzeitalter, die durch Jaguare, Wind, Feuerregen und Wasser zerstört wurden. Ein Kranz zeigt die zwanzig Tageszeichen des Kalenders, außen umschlingen zwei Feuerschlangen den Stein. Er war wohl kein Kalender im praktischen Sinn, sondern ein kosmologisches Monument, eventuell auch ein Opferstein. Nach der spanischen Eroberung wurde er vergraben und 1790 wiederentdeckt. Heute ist er ein Nationalsymbol Mexikos und erscheint auf Münzen, Souvenirs und in der Popkultur.","s":["Anthropologisches Museum, Mexiko-Stadt",19.426,-99.186]},{"k":"a095","b":0,"t":"Der Golfstrom","a":"Winslow Homer","j":"1899","y":1899,"e":4,"r":"Amerika","o":["Bahamas",25.034,-77.396],"x":"Ein schwarzer Seemann liegt auf einem entmasteten Boot im aufgewühlten Meer, um ihn kreisen Haie, am Horizont nähert sich eine Wasserhose. In der Ferne ist ein Segelschiff zu sehen, das ihn vielleicht nicht bemerkt. Homer malte das Bild nach Reisen in die Karibik, es gilt als Hauptwerk der amerikanischen Malerei des 19. Jahrhunderts. Die Wahl eines schwarzen Mannes als Held eines großen Gemäldes war damals ungewöhnlich und wird heute im Zusammenhang mit der Geschichte der Sklaverei und des Atlantikhandels gelesen. Homer weigerte sich, Fragen nach dem Ausgang zu beantworten, und spottete über Leute, die wissen wollten, ob der Mann gerettet wird. Das Bild zeigt den Menschen ausgeliefert an eine gleichgültige Natur. Der Künstler Kerry James Marshall hat es 2003 in einer Neuinterpretation aufgegriffen.","s":["Metropolitan Museum, New York",40.779,-73.963]},{"k":"a096","b":0,"t":"Felskunst von Ubirr","a":"Aborigines","j":"seit ca. 2000 v. Chr. bis heute","y":-2000,"e":1,"r":"Ozeanien","o":["Kakadu, Australien",-12.417,132.967],"x":"Die Felsbilder von Ubirr im Kakadu-Nationalpark gehören zu der ältesten fortlaufenden Kunsttradition der Welt. Die Aborigines malen in dieser Region seit vermutlich über 20.000 Jahren, manche Bilder wurden immer wieder übermalt. Berühmt ist der Röntgenstil, bei dem Fische, Schildkröten und Kängurus mit Skelett und inneren Organen gezeigt werden. Damit wird nicht nur das Aussehen, sondern auch das Wissen über das Tier, etwa über essbare Teile, dargestellt. Andere Bilder zeigen Ahnenwesen der Traumzeit wie die Regenbogenschlange und erste Begegnungen mit Europäern. Die Felskunst ist kein abgeschlossenes Erbe, sondern Teil lebendiger Kultur und Rechtsordnung der traditionellen Eigentümer. Sie zeigt, dass Bild, Landschaft und Erzählung eine untrennbare Einheit bilden können."},{"k":"a097","b":0,"t":"Hoa Hakananai'a (Moai)","a":"Rapa Nui","j":"ca. 1000 bis 1200","y":1100,"e":2,"r":"Ozeanien","o":["Rapa Nui (Osterinsel)",-27.113,-109.35],"x":"Die Moai der Osterinsel sind riesige Steinfiguren, die Ahnen darstellen und mit dem Rücken zum Meer über die Dörfer wachten. Hoa Hakananai'a ist eine der besterhaltenen und wurde aus dunklem Basalt statt aus dem üblichen Tuffstein gearbeitet. Auf ihrem Rücken sind Reliefs eingeritzt, die den Vogelmann-Kult zeigen, einen späteren Wettkampfritus um das erste Ei der Rußseeschwalbe. Damit erzählt die Figur die Religionsgeschichte der Insel in einem einzigen Werk. Der Name bedeutet etwa verlorener oder gestohlener Freund. Die Moai wurden lange für das Rätsel einer untergegangenen Kultur gehalten, heute weiß man mehr über ihren Transport und ihre Bedeutung. Die Statue ist ein Kernstück der Debatte um Rückgaben aus Ozeanien.","s":["British Museum, London",51.519,-0.127]},{"k":"a098","b":0,"t":"Te Hau-ki-Tūranga","a":"Raharuhi Rukupō und Rongowhakaata","j":"1842","y":1842,"e":4,"r":"Ozeanien","o":["Poverty Bay, Neuseeland",-38.65,177.917],"x":"Te Hau-ki-Tūranga ist das älteste erhaltene Versammlungshaus der Māori und ein Hauptwerk ihrer Schnitzkunst. Ein Wharenui ist zugleich Gebäude und Körper eines Ahnen, der First ist sein Rückgrat, die Dachsparren sind seine Rippen. Die geschnitzten Pfosten zeigen Ahnen mit Paua-Muschelaugen, Spiralen und Gesichtstätowierungen, die Herkunft und Rang erzählen. Der Schnitzer Raharuhi Rukupō gestaltete das Haus mit seiner Gemeinschaft als Erinnerung an seinen Bruder. Schnitzerei, Webmuster und Malerei verbinden sich zu einem Gesamtkunstwerk, das Genealogie und Geschichte bewahrt. Die Wegnahme durch die Regierung 1867 und die Präsentation im Museum werfen Fragen nach dem Umgang mit indigenem Erbe auf. Das Haus zeigt, dass Kunstwerke Lebensräume und Träger von Identität sein können.","s":["Te Papa, Wellington",-41.291,174.782]},{"k":"a099","b":0,"t":"Shearing the Rams","a":"Tom Roberts","j":"1888 bis 1890","y":1890,"e":4,"r":"Ozeanien","o":["Brocklesby, Australien",-35.75,146.683],"x":"In einem Scherschuppen arbeiten Männer an Schafen, Licht fällt durch die Holzwände und lässt Staub und Wolle aufleuchten. Ein Junge trägt Wolle, ein Mädchen lächelt den Betrachter an. Tom Roberts malte vor Ort über mehrere Saisons, um die Arbeit genau festzuhalten. Das Bild gehört zur Heidelberg School, die einen eigenen australischen Impressionismus entwickelte und das Leben im Busch zum nationalen Thema machte. Die Wollindustrie war damals das wirtschaftliche Rückgrat des Landes, und das Bild feiert harte Arbeit als Teil der australischen Identität. Heute wird kritisch gesehen, wer fehlt, etwa die Aborigines, deren Land für die Schafzucht genommen wurde und die oft auf den Farmen arbeiteten. Es ist eines der bekanntesten Bilder Australiens.","s":["National Gallery of Victoria, Melbourne",-37.823,144.969]},{"k":"a100","b":0,"t":"Woher kommen wir? Was sind wir? Wohin gehen wir?","a":"Paul Gauguin","j":"1897","y":1897,"e":4,"r":"Ozeanien","o":["Tahiti, Französisch-Polynesien",-17.6,-149.6],"x":"Gauguin malte das fast vier Meter breite Bild auf Tahiti in einer Lebenskrise und nannte es sein Testament. Es liest sich von rechts nach links, von einem Neugeborenen über eine Gestalt, die eine Frucht pflückt, bis zu einer alten Frau, die den Tod erwartet. Im Hintergrund steht ein blaues Götterbild, das Gauguin erfand, eine Mischung verschiedener Kulturen. Die flächigen, leuchtenden Farben und die vereinfachten Formen lösen sich vom Naturvorbild und machten Gauguin zum Wegbereiter der Moderne. Er suchte in der Südsee ein ursprüngliches Paradies, fand aber eine von Kolonialismus und Mission geprägte Gesellschaft. Heute wird sein Werk auch kritisch gesehen, weil es ein exotisches Bild Polynesiens schuf und weil er Beziehungen zu sehr jungen Mädchen hatte. Das Bild bleibt eine große Frage nach dem Sinn des Lebens.","s":["Museum of Fine Arts, Boston",42.339,-71.094]},{"k":"b01","b":1,"t":"Göbekli Tepe","a":"Jäger und Sammler der Jungsteinzeit","j":"ca. 9500 v. Chr.","y":-9500,"e":0,"r":"Asien","o":["Şanlıurfa, Türkei",37.223,38.923],"x":"Göbekli Tepe ist die älteste bekannte monumentale Kultanlage der Menschheit, rund 7000 Jahre älter als Stonehenge. Kreisförmige Anlagen aus bis zu fünf Meter hohen, T-förmigen Steinpfeilern sind mit Reliefs von Füchsen, Schlangen, Wildschweinen, Geiern und Skorpionen verziert. Manche Pfeiler tragen Arme und Hände und stellen offenbar menschenähnliche Wesen dar. Erbaut wurde die Anlage von Jägern und Sammlern, noch bevor es Ackerbau, Keramik oder Schrift gab. Das stellte die alte Lehrmeinung auf den Kopf, wonach erst sesshafte Bauern große Gemeinschaftsbauten errichten konnten. Der Archäologe Klaus Schmidt vermutete sogar, dass der Bau solcher Heiligtümer die Menschen zur Sesshaftigkeit brachte. Göbekli Tepe ist damit ein Schlüsselort für die Frage, wie Religion, Gemeinschaft und Architektur zusammen entstanden."},{"k":"b02","b":1,"t":"Pyramiden von Gizeh","a":"Altes Reich, Pharaonen Cheops, Chephren und Mykerinos","j":"ca. 2560 v. Chr.","y":-2560,"e":1,"r":"Afrika","o":["Gizeh, Ägypten",29.979,31.134],"x":"Die Pyramiden von Gizeh sind das einzige der Sieben Weltwunder der Antike, das bis heute steht. Die Cheops-Pyramide war mit ursprünglich 146 Metern fast 4000 Jahre lang das höchste Bauwerk der Welt. Sie besteht aus über zwei Millionen Steinblöcken und war einst mit glatt polierten weißen Kalksteinplatten verkleidet, die in der Sonne strahlten. Die Pyramiden waren Grabmäler für Pharaonen, ihre Form wird als versteinerter Sonnenstrahl oder Urhügel der Schöpfung gedeutet. Entgegen alter Legenden bauten keine Sklaven, sondern bezahlte und versorgte Arbeiter in organisierten Mannschaften, wie Arbeitersiedlungen und Papyri belegen. Die exakte Ausrichtung nach den Himmelsrichtungen zeugt von erstaunlichem astronomischem Wissen. Die Pyramiden sind bis heute Symbol für Ewigkeit, Macht und menschliche Organisationskraft."},{"k":"b03","b":1,"t":"Stonehenge","a":"Jungsteinzeit und Bronzezeit","j":"ca. 3000 bis 1500 v. Chr.","y":-2500,"e":1,"r":"Europa","o":["Wiltshire, England",51.179,-1.826],"x":"Stonehenge ist der berühmteste Steinkreis der Welt und ein Meisterwerk prähistorischer Planung. Die großen Sarsensteine wiegen bis zu 25 Tonnen, die kleineren Blausteine wurden über 200 Kilometer aus Wales herangeschafft. Die Steine tragen Querbalken, die mit Zapfen und Holzverbindungen befestigt sind, eine Technik aus dem Holzbau. Die Anlage ist so ausgerichtet, dass die Sonne zur Sommersonnenwende über dem Fersenstein aufgeht und zur Wintersonnenwende gegenüber untergeht. Sie diente wohl als Kult- und Versammlungsort, als Begräbnisstätte und als Kalender für Feste im Jahreslauf. Über Jahrhunderte wurde sie mehrfach umgebaut. Stonehenge zeigt, wie Gemeinschaften ohne Schrift Landschaft, Himmel und Zeit in Architektur fassten."},{"k":"b04","b":1,"t":"Zikkurat von Ur","a":"Sumerer, König Ur-Nammu","j":"ca. 2100 v. Chr.","y":-2100,"e":1,"r":"Asien","o":["Ur, Irak",30.963,46.103],"x":"Die Zikkurat von Ur ist der am besten erhaltene Stufentempel Mesopotamiens, dem Land zwischen Euphrat und Tigris, in dem die ersten Städte und die Schrift entstanden. Der sumerische König Ur-Nammu ließ sie für den Mondgott Nanna errichten. Der massive Kern besteht aus Lehmziegeln, die äußere Hülle aus gebrannten Ziegeln mit Bitumen als Mörtel. Drei monumentale Treppen führten hinauf zu einem Heiligtum auf der Spitze, das den Göttern als Wohnung diente. Die Wände sind leicht geneigt und gewölbt, was die Wirkung von Höhe verstärkt. Zikkurate gelten als mögliches Vorbild für die biblische Erzählung vom Turmbau zu Babel. Die Anlage zeigt, wie früh Architektur genutzt wurde, um Herrschaft und Religion monumental zu verbinden."},{"k":"b05","b":1,"t":"Karnak-Tempel","a":"Pharaonen des Mittleren und Neuen Reiches","j":"ab ca. 2000 v. Chr.","y":-1500,"e":1,"r":"Afrika","o":["Luxor, Ägypten",25.719,32.657],"x":"Karnak ist die größte Tempelanlage der Antike und wurde über fast 2000 Jahre von rund 30 Pharaonen erweitert. Herzstück ist der Tempel des Reichsgottes Amun-Re im antiken Theben. Der berühmte Säulensaal enthält 134 gewaltige Säulen, die zentralen sind 21 Meter hoch und stellen Papyruspflanzen dar, ein steinerner Sumpf der Schöpfung. Wände und Säulen sind mit Reliefs und Hieroglyphen bedeckt, die Kriegszüge, Opfer und Götter zeigen. Obelisken, Sphingenalleen und heilige Seen gehören zur Anlage. Für das Opetfest wurde das Götterbild von Karnak über eine kilometerlange Sphingenallee zum Luxor-Tempel getragen. Karnak zeigt, wie Architektur ein ganzes Weltbild in Stein fassen konnte und wie Herrscher sich durch Bauen verewigten."},{"k":"b06","b":1,"t":"Tempel von Abu Simbel","a":"Ramses II.","j":"ca. 1264 v. Chr.","y":-1264,"e":1,"r":"Afrika","o":["Abu Simbel, Ägypten",22.337,31.626],"x":"Ramses II. ließ die beiden Felsentempel von Abu Simbel an der Südgrenze Ägyptens in den Fels schlagen, als Machtdemonstration gegenüber Nubien. Vier 20 Meter hohe Sitzstatuen des Pharaos bewachen den Eingang des großen Tempels, zu ihren Füßen stehen kleine Figuren seiner Familie. Der kleinere Tempel ist seiner Frau Nefertari und der Göttin Hathor geweiht, was die besondere Stellung der Königin zeigt. Der Haupttempel ist so ausgerichtet, dass zweimal im Jahr die Sonne bis ins Allerheiligste fällt und drei der vier Götterstatuen beleuchtet. In den 1960er Jahren drohte der Nassersee durch den Assuan-Staudamm die Tempel zu überfluten. In einer internationalen UNESCO-Rettungsaktion wurden sie in über tausend Blöcke zersägt und 65 Meter höher wieder aufgebaut. Diese Aktion begründete die Idee des Welterbes der Menschheit."},{"k":"b07","b":1,"t":"Persepolis","a":"Achämenidisches Reich, Dareios I.","j":"ab ca. 515 v. Chr.","y":-515,"e":1,"r":"Asien","o":["Persepolis, Iran",29.936,52.892],"x":"Persepolis war die Prunkresidenz der persischen Großkönige, die das größte Reich der damaligen Welt beherrschten. Auf einer gewaltigen Terrasse standen Paläste, Säulenhallen und Schatzhäuser, deren Säulen bis zu 20 Meter hoch waren und mit Stierköpfen bekrönt sind. Berühmt sind die Reliefs an den Treppen der Apadana, auf denen Gesandtschaften aus 23 Völkern des Reiches Gaben bringen, Löwen, Stoffe, Gold und Pferde. Sie zeigen ein Selbstbild des Reiches als friedliche Ordnung vieler Völker unter einem König. Die Architektur verband Elemente aus Ägypten, Mesopotamien, Griechenland und Persien zu einem eigenen Stil. 330 v. Chr. ließ Alexander der Große Persepolis plündern und niederbrennen. Die Ruinen sind ein Symbol der iranischen Geschichte und Identität."},{"k":"b08","b":1,"t":"Parthenon","a":"Iktinos, Kallikrates, Phidias","j":"447 bis 432 v. Chr.","y":-438,"e":1,"r":"Europa","o":["Athen, Akropolis",37.972,23.727],"x":"Der Parthenon auf der Akropolis ist der Inbegriff griechischer Architektur und Symbol der Demokratie und der europäischen Kultur. Der dorische Tempel wurde unter Perikles für die Stadtgöttin Athena erbaut, im Inneren stand eine zwölf Meter hohe Statue aus Gold und Elfenbein. Er wirkt vollkommen gerade, doch fast keine Linie ist es, Säulen neigen sich leicht nach innen, der Boden wölbt sich, die Ecksäulen sind dicker. Diese feinen Kurven gleichen optische Täuschungen aus und geben dem Bau Lebendigkeit. Giebel, Metopen und Fries waren mit Skulpturen unter Phidias geschmückt. Der Parthenon diente später als Kirche, Moschee und Pulvermagazin, bis 1687 eine venezianische Kanonenkugel ihn sprengte. Er prägte Regierungsgebäude, Museen und Banken in aller Welt."},{"k":"b09","b":1,"t":"Stupa von Sanchi","a":"Maurya, Kaiser Ashoka","j":"3. Jh. v. Chr. bis 1. Jh.","y":-250,"e":1,"r":"Asien","o":["Sanchi, Indien",23.479,77.74],"x":"Der Große Stupa von Sanchi ist eines der ältesten Steinbauwerke Indiens und ein Grundtyp buddhistischer Architektur. Ein Stupa ist ein halbkugelförmiger Hügel über Reliquien, den Gläubige im Uhrzeigersinn umschreiten. Kaiser Ashoka ließ den ersten Bau aus Ziegeln errichten, später wurde er mit Stein ummantelt und von einem Zaun umgeben. Die vier Tore, Toranas genannt, sind dicht mit Reliefs aus dem Leben des Buddha und seinen früheren Leben bedeckt. Der Buddha selbst erscheint nicht als Figur, sondern nur in Symbolen wie Rad, Baum, Fußabdruck oder leerem Thron. Daneben bevölkern Elefanten, Baumgöttinnen und Stadtszenen die Tore. Die Form des Stupa verbreitete sich in ganz Asien und wurde zur Pagode in China und Japan."},{"k":"b10","b":1,"t":"Große Mauer","a":"Chinesische Dynastien, heutige Form Ming-Zeit","j":"7. Jh. v. Chr. bis 17. Jh.","y":1500,"e":3,"r":"Asien","o":["Badaling bei Peking, China",40.359,116.02],"x":"Die Große Mauer ist das größte Bauwerk der Menschheit, alle Abschnitte zusammen sind über 20.000 Kilometer lang. Sie ist kein einzelner Wall, sondern ein System von Mauern, Wachtürmen, Festungen und Signalfeuern, das über mehr als 2000 Jahre gebaut wurde. Der erste Kaiser Qin Shihuangdi verband ältere Mauern, die heute bekannten Abschnitte aus Stein und Ziegeln stammen überwiegend aus der Ming-Dynastie. Die Mauer sollte Angriffe von Nomadenvölkern aus dem Norden abwehren und den Handel kontrollieren. Ihr Bau kostete unzählige Arbeiter das Leben. Dass man sie vom Mond aus sehen könne, ist ein Mythos. Sie ist Symbol der chinesischen Nation und zeigt, wie Architektur eine ganze Landschaft verändert."},{"k":"b11","b":1,"t":"Al-Khazneh, Petra","a":"Nabatäer","j":"1. Jh.","y":50,"e":1,"r":"Asien","o":["Petra, Jordanien",30.322,35.451],"x":"Petra war die Hauptstadt der Nabatäer, eines Volkes, das durch den Handel mit Weihrauch, Myrrhe und Gewürzen reich wurde. Die Stadt liegt in einem Felstal, das man nur durch eine enge, über einen Kilometer lange Schlucht erreicht. Am Ende öffnet sich plötzlich der Blick auf Al-Khazneh, das Schatzhaus, eine rund 40 Meter hohe Fassade, die direkt aus dem rosa Sandstein gemeißelt ist. Säulen, Giebel und ein Rundtempel verbinden hellenistische Formen mit lokaler Tradition, die Fassade ist reine Schauwand. Vermutlich war es ein königliches Grabmal. Die Nabatäer beherrschten auch ein raffiniertes System von Zisternen und Kanälen, das eine Stadt in der Wüste ermöglichte. Petra ist eines der neuen Sieben Weltwunder und durch den Film Indiana Jones weltberühmt."},{"k":"b12","b":1,"t":"Pont du Gard","a":"Römisch","j":"ca. 50","y":50,"e":1,"r":"Europa","o":["Pont du Gard, Frankreich",43.948,4.535],"x":"Der Pont du Gard ist eine fast 50 Meter hohe römische Brücke, die Teil einer 50 Kilometer langen Wasserleitung nach Nîmes war. Drei Bogenreihen übereinander überspannen das Tal des Gardon, gebaut aus mächtigen Kalksteinblöcken ohne Mörtel. Das Gefälle der gesamten Leitung betrug nur rund 25 Zentimeter pro Kilometer, eine erstaunliche Präzision der Vermessung. Täglich flossen Zehntausende Kubikmeter Wasser zu Brunnen, Bädern und Häusern der Stadt. Der Bogen als tragendes Element ist eine der wichtigsten Erfindungen der römischen Architektur. Der Pont du Gard zeigt, wie Ingenieurskunst und Schönheit verschmelzen. Er ist das am besten erhaltene Beispiel eines römischen Aquädukts und war lange ein Ziel für Reisende und Künstler."},{"k":"b13","b":1,"t":"Kolosseum","a":"Flavische Kaiser Vespasian und Titus","j":"70 bis 80","y":80,"e":1,"r":"Europa","o":["Rom",41.89,12.492],"x":"Das Kolosseum ist das größte Amphitheater der Antike und das Wahrzeichen Roms. Rund 50.000 Zuschauer sahen hier Gladiatorenkämpfe, Tierhetzen und Hinrichtungen, die das Volk unterhalten und die Macht der Kaiser zeigen sollten. Die Fassade zeigt übereinander die drei griechischen Säulenordnungen, dorisch, ionisch und korinthisch, eine Lösung, die Architekten bis in die Neuzeit nachahmten. Ein ausgeklügeltes System von Treppen und Gängen leerte das Gebäude in Minuten. Unter der Arena lagen Gänge, Käfige und Aufzüge, durch die Tiere und Kulissen auftauchten. Ein riesiges Sonnensegel konnte die Zuschauer beschatten. Im Mittelalter diente das Kolosseum als Steinbruch, Festung und Wohnort. Heute ist es Symbol für die Größe und die Grausamkeit Roms."},{"k":"b14","b":1,"t":"Pantheon","a":"Kaiser Hadrian","j":"ca. 125","y":125,"e":1,"r":"Europa","o":["Rom",41.899,12.477],"x":"Das Pantheon ist der am besten erhaltene Großbau der römischen Antike und hat die größte unbewehrte Betonkuppel der Welt. Der Innenraum ist so geplant, dass eine Kugel von 43 Metern Durchmesser genau hineinpassen würde. In der Mitte der Kuppel öffnet sich ein neun Meter weites rundes Loch, der Oculus, durch das Licht und Regen fallen. Die Kuppel wird nach oben immer dünner und leichter, die Römer mischten dazu leichteren Bimsstein in den Beton. Ursprünglich allen Göttern geweiht, wurde das Pantheon im 7. Jahrhundert zur Kirche, was es vor dem Verfall bewahrte. Raffael und italienische Könige sind hier begraben. Brunelleschi, Michelangelo, Palladio und Thomas Jefferson ließen sich vom Pantheon inspirieren."},{"k":"b15","b":1,"t":"Sonnenpyramide von Teotihuacán","a":"Teotihuacán-Kultur","j":"ca. 200","y":200,"e":1,"r":"Amerika","o":["Teotihuacán, Mexiko",19.692,-98.844],"x":"Teotihuacán war mit rund 100.000 Einwohnern eine der größten Städte der Welt um 500 n. Chr. Die Sonnenpyramide ist mit 65 Metern Höhe eine der größten Pyramiden Amerikas und überragt die Straße der Toten, die zentrale Achse der Stadt. Die Stadt war in einem strengen Raster geplant und nach den Bergen und dem Sonnenlauf ausgerichtet. Unter der Pyramide entdeckte man einen Tunnel zu einer Höhle, die als Ort der Schöpfung gegolten haben könnte. Wer die Stadt gebaut hat, ist unklar, ihr Name stammt von den Azteken, die sie Jahrhunderte später in Ruinen fanden und Ort, an dem Götter entstehen nannten. Wandmalereien und Masken zeigen eine reiche Bildkultur. Teotihuacán beeinflusste ganz Mesoamerika bis zu den Maya."},{"k":"b16","b":1,"t":"Hagia Sophia","a":"Anthemios von Tralles und Isidor von Milet","j":"537","y":537,"e":2,"r":"Europa","o":["Istanbul, Türkei",41.009,28.98],"x":"Kaiser Justinian ließ die Hagia Sophia in nur fünf Jahren als Hauptkirche des Byzantinischen Reiches erbauen. Ihre Kuppel mit über 30 Metern Durchmesser scheint über einem Kranz aus 40 Fenstern zu schweben, wie an einer goldenen Kette vom Himmel gehängt, schrieb ein Zeitgenosse. Möglich wurde das durch Pendentifs, Bauelemente, die eine runde Kuppel auf einen quadratischen Grundriss setzen. Goldene Mosaiken, Marmor in vielen Farben und Licht schufen einen Raum, der den Himmel auf Erden darstellen sollte. Fast tausend Jahre war sie die größte Kirche der Christenheit. Nach der Eroberung Konstantinopels 1453 wurde sie Moschee, erhielt Minarette und wurde zum Vorbild osmanischer Moscheen. Ihr Wechsel zwischen Kirche, Moschee, Museum und wieder Moschee macht sie zum Symbol der Begegnung und des Konflikts von Kulturen."},{"k":"b17","b":1,"t":"Felsendom","a":"Umayyaden, Kalif Abd al-Malik","j":"691","y":691,"e":2,"r":"Asien","o":["Jerusalem",31.778,35.235],"x":"Der Felsendom ist das älteste erhaltene große Bauwerk des Islam und ein Wahrzeichen Jerusalems. Er steht auf dem Tempelberg über einem Felsen, der für Juden, Christen und Muslime heilig ist, hier soll Abraham seinen Sohn opfern wollen, und von hier soll Mohammed in den Himmel aufgestiegen sein. Der achteckige Bau mit seiner vergoldeten Kuppel greift Formen byzantinischer Kirchen auf. Innen und außen ist er mit Mosaiken, Marmor und Kacheln bedeckt, die Pflanzen und Inschriften zeigen, aber keine Menschen. Die Koraninschriften gehören zu den ältesten erhaltenen. Der Bau sollte den Anspruch des Islam in einer christlich geprägten Stadt sichtbar machen. Bis heute steht er im Mittelpunkt religiöser und politischer Spannungen."},{"k":"b18","b":1,"t":"Tempel I von Tikal","a":"Maya, für König Jasaw Chan K'awiil","j":"ca. 732","y":732,"e":2,"r":"Amerika","o":["Tikal, Guatemala",17.222,-89.624],"x":"Tikal war eine der mächtigsten Städte der klassischen Maya und liegt heute mitten im Regenwald Guatemalas. Der 47 Meter hohe Tempel I, auch Tempel des Großen Jaguars, ist ein steiler Stufenbau mit einem kleinen Tempelraum und einem hohen Dachkamm. Er wurde als Grabmal des Königs Jasaw Chan K'awiil errichtet, der Tikal nach einer Krise wieder zu Macht führte. Ihm gegenüber steht Tempel II, wohl für seine Frau, über einen großen Platz hinweg. Geschnitzte Türstürze aus Zapotenholz zeigten den König mit einem Jaguar. Die Pyramiden ragen über das Blätterdach hinaus und dienten als Orte, an denen Herrscher den Göttern nahe waren. Tikal ist ein Schlüsselort für das Verständnis der Maya-Städte und ihres plötzlichen Niedergangs um 900."},{"k":"b19","b":1,"t":"Tōdai-ji","a":"Nara-Zeit, Kaiser Shōmu","j":"752, heutige Halle 1709","y":752,"e":2,"r":"Asien","o":["Nara, Japan",34.689,135.84],"x":"Der Tōdai-ji in Nara ist einer der bedeutendsten buddhistischen Tempel Japans. Kaiser Shōmu ließ ihn als Haupttempel eines landesweiten Netzes von Klöstern bauen, um das Land durch den Buddhismus zu schützen. In der großen Halle sitzt eine 15 Meter hohe Bronzefigur des Buddha Vairocana, für die ein Großteil der damaligen Bronzeproduktion Japans verbraucht wurde. Die Halle des Großen Buddha war über Jahrhunderte das größte Holzgebäude der Welt, obwohl der heutige Bau von 1709 nur zwei Drittel des Originals misst. Das Tor Nandaimon wird von zwei gewaltigen hölzernen Wächterfiguren bewacht. Im Schatzhaus Shōsōin lagern Kostbarkeiten aus der Seidenstraße bis Persien. Im Park um den Tempel leben zahme Hirsche, die als Boten der Götter gelten."},{"k":"b20","b":1,"t":"Kailasa-Tempel","a":"Rashtrakuta-Dynastie","j":"ca. 760","y":760,"e":2,"r":"Asien","o":["Ellora, Indien",20.024,75.179],"x":"Der Kailasa-Tempel in Ellora ist das größte aus einem einzigen Felsen gehauene Bauwerk der Welt. Steinmetze arbeiteten sich von oben in den Basaltberg, entfernten geschätzt 200.000 Tonnen Gestein und ließen einen freistehenden Tempel mit Hallen, Brücken, Säulen und Elefantenfiguren stehen. Fehler konnten nicht korrigiert werden, alles musste vorab genau geplant sein. Der Tempel stellt den Berg Kailasa dar, den Wohnsitz des Gottes Shiva im Himalaya. Reliefs zeigen Szenen aus den Epen Ramayana und Mahabharata, darunter den Dämon Ravana, der den Berg schüttelt. In Ellora stehen buddhistische, hinduistische und jainistische Höhlentempel nebeneinander, ein Zeichen religiöser Vielfalt. Kailasa ist ein Höhepunkt indischer Architektur und Skulptur."},{"k":"b21","b":1,"t":"Mezquita von Córdoba","a":"Umayyaden in al-Andalus","j":"ab 785","y":785,"e":2,"r":"Europa","o":["Córdoba, Spanien",37.879,-4.779],"x":"Die Mezquita war die Hauptmoschee von Córdoba, der damals größten und kultiviertesten Stadt Westeuropas. Ihr Gebetssaal ist ein Wald aus über 800 Säulen, verbunden durch doppelte Hufeisenbögen mit roten und weißen Steinstreifen. Die Säulen stammen zum Teil aus römischen und westgotischen Bauten, ein Zeichen der Wiederverwendung. Mehrfach erweitert, erhielt sie unter Kalif al-Hakam II. eine prachtvolle Gebetsnische mit Goldmosaiken byzantinischer Handwerker. Nach der christlichen Eroberung 1236 wurde sie Kathedrale, im 16. Jahrhundert baute man mitten hinein ein Kirchenschiff der Renaissance. Kaiser Karl V. soll gesagt haben, man habe etwas Einzigartiges zerstört, um etwas Gewöhnliches zu bauen. Die Mezquita steht für das Zusammenleben und die Konflikte von Islam, Christentum und Judentum in al-Andalus."},{"k":"b22","b":1,"t":"Aachener Dom","a":"Karl der Große, Baumeister Odo von Metz","j":"ca. 800","y":800,"e":2,"r":"Europa","o":["Aachen",50.775,6.084],"x":"Die Pfalzkapelle Karls des Großen ist das bedeutendste Bauwerk der karolingischen Renaissance und eines der ersten deutschen UNESCO-Welterbestätten. Der achteckige Zentralbau mit seiner Kuppel orientiert sich an San Vitale in Ravenna und an Bauten Roms und Konstantinopels. Karl wollte damit sein neues Kaisertum als Erbe des Römischen Reiches darstellen. Antike Säulen ließ er eigens aus Italien heranschaffen. Im oberen Umgang steht der Thron Karls, auf dem über 600 Jahre lang 31 deutsche Könige gekrönt wurden. Karl selbst ist hier begraben, sein Schrein und der Marienschrein sind Meisterwerke der Goldschmiedekunst. Später kam die gotische Chorhalle mit riesigen Glasfenstern hinzu, das Glashaus von Aachen. Der Dom ist ein Gründungsort europäischer Geschichte."},{"k":"b23","b":1,"t":"Borobudur","a":"Shailendra-Dynastie","j":"ca. 800","y":800,"e":2,"r":"Asien","o":["Java, Indonesien",-7.608,110.204],"x":"Borobudur auf Java ist das größte buddhistische Bauwerk der Welt, ein Berg aus Stein in Form eines dreidimensionalen Mandalas. Neun Ebenen, sechs quadratische und drei runde, führen Pilger auf einem fünf Kilometer langen Weg spiralförmig nach oben. Unterwegs erzählen rund 2700 Reliefs von der Welt der Begierden, dem Leben des Buddha und dem Weg zur Erleuchtung. Auf den oberen Ebenen sitzen 72 Buddhas in glockenförmigen, durchbrochenen Stupas, die Reliefs hören auf, alles wird leer und offen. Damit ist der Aufstieg selbst eine spirituelle Erfahrung. Borobudur wurde nach Vulkanausbrüchen und dem Niedergang des Buddhismus auf Java vergessen und von Dschungel und Asche bedeckt. Heute ist es wieder ein Pilgerort und das meistbesuchte Monument Indonesiens."},{"k":"b24","b":1,"t":"El Castillo, Chichén Itzá","a":"Maya und Tolteken","j":"ca. 1000","y":1000,"e":2,"r":"Amerika","o":["Chichén Itzá, Mexiko",20.684,-88.568],"x":"Die Pyramide El Castillo, auch Tempel des Kukulkan, ist das Wahrzeichen von Chichén Itzá, der mächtigsten Maya-Stadt der Nachklassik. Sie ist ein steinerner Kalender, ihre vier Treppen mit je 91 Stufen plus der obersten Plattform ergeben 365, die Zahl der Tage des Jahres. An den Tagen der Tagundnachtgleiche wirft die Abendsonne Schatten auf die Treppe, sodass eine Schlange aus Licht den Hang hinabzukriechen scheint und auf einen steinernen Schlangenkopf trifft. Im Inneren steckt eine ältere Pyramide mit einem Jaguarthron. Klatscht man vor der Treppe in die Hände, hallt ein Echo zurück, das an den Ruf des heiligen Quetzalvogels erinnert. In der Stadt mischen sich Maya-Traditionen mit Einflüssen aus Zentralmexiko. Chichén Itzá ist eines der neuen Sieben Weltwunder."},{"k":"b25","b":1,"t":"Markusdom","a":"Republik Venedig","j":"1063 bis 1094","y":1094,"e":2,"r":"Europa","o":["Venedig, Italien",45.435,12.34],"x":"Der Markusdom ist das prächtigste Beispiel byzantinischer Architektur im Westen und das Herz der Republik Venedig. Er wurde für die Gebeine des Evangelisten Markus gebaut, die venezianische Kaufleute 828 aus Alexandria geschmuggelt hatten, angeblich unter Schweinefleisch versteckt. Der Grundriss eines griechischen Kreuzes mit fünf Kuppeln folgt einer Kirche in Konstantinopel. Innen sind über 8000 Quadratmeter Wände und Kuppeln mit goldenen Mosaiken bedeckt, daher der Beiname Chiesa d'Oro, goldene Kirche. Die vier Bronzepferde über dem Portal raubte Venedig 1204 bei der Plünderung Konstantinopels, Napoleon brachte sie später nach Paris. Der Dom ist voller Beutestücke und zeigt Venedigs Rolle als Handelsmacht zwischen Orient und Okzident. Er war Staatskirche des Dogen, nicht Bischofssitz."},{"k":"b26","b":1,"t":"Angkor Wat","a":"Khmer-Reich, König Suryavarman II.","j":"ca. 1150","y":1150,"e":2,"r":"Asien","o":["Siem Reap, Kambodscha",13.413,103.867],"x":"Angkor Wat ist das größte religiöse Bauwerk der Welt und das Meisterwerk der Khmer-Architektur. König Suryavarman II. ließ es als Tempel für Vishnu und als sein Grabmal errichten. Fünf Türme in Lotusform symbolisieren den Berg Meru, das Zentrum des hinduistischen Kosmos, der Wassergraben stellt den Ozean dar. Der Tempel ist nach Westen ausgerichtet, ungewöhnlich und wohl mit dem Tod verbunden. Die Galerien sind mit fast einem Kilometer Reliefs bedeckt, darunter das Quirlen des Milchozeans und Hunderte tanzender Himmelsnymphen. Angkor war einst eine riesige Stadt mit ausgeklügeltem Wassersystem. Angkor Wat wurde später buddhistisch und nie ganz verlassen. Es ziert die Nationalflagge Kambodschas, ein einmaliges Bekenntnis zu einem Bauwerk."},{"k":"b27","b":1,"t":"Notre-Dame de Paris","a":"Gotische Baumeister","j":"1163 bis 1345","y":1250,"e":2,"r":"Europa","o":["Paris",48.853,2.35],"x":"Notre-Dame ist eine der bekanntesten gotischen Kathedralen und ein Symbol Frankreichs. Ihre Westfassade mit zwei Türmen, drei Portalen und der großen Rosette ist ein Musterbild harmonischer Gotik. Sie gehört zu den ersten Bauten, die außen Strebebögen einsetzten, um hohe, dünne Wände mit großen Fenstern zu ermöglichen. Die Fensterrosen verwandeln das Licht in Farbe und Bilderzählung. Über Jahrhunderte war sie Ort von Krönungen, Gottesdiensten und Staatsfeiern, Napoleon krönte sich hier zum Kaiser. Victor Hugos Roman Der Glöckner von Notre-Dame rettete sie im 19. Jahrhundert vor dem Verfall und regte die Restaurierung durch Viollet-le-Duc an. Der verheerende Brand von 2019 und die Wiedereröffnung 2024 zeigten, welche Bedeutung sie für Menschen weltweit hat."},{"k":"b28","b":1,"t":"Kathedrale von Chartres","a":"Gotische Baumeister","j":"1194 bis 1220","y":1220,"e":2,"r":"Europa","o":["Chartres, Frankreich",48.448,1.488],"x":"Chartres gilt als vollkommenste Kathedrale der Hochgotik, weil sie in nur rund 30 Jahren in einem Guss gebaut wurde. Sie besitzt den größten erhaltenen Bestand mittelalterlicher Glasfenster, über 170 Fenster mit einem tiefen Blau, das als Chartres-Blau berühmt ist. Die Fenster erzählen biblische Geschichten und zeigen zugleich Handwerker, die sie gestiftet haben, Bäcker, Weber, Schuster. Die Portale sind mit Hunderten Figuren bevölkert, die schlanken Säulenfiguren des Königsportals gehören zu den frühesten Skulpturen der Gotik. Im Boden liegt ein großes Labyrinth, das Pilger betend abschritten. Chartres bewahrt eine Reliquie, das Gewand Marias, und war ein bedeutender Wallfahrtsort. Die Kathedrale zeigt die Idee der Gotik, Gott als Licht erfahrbar zu machen."},{"k":"b29","b":1,"t":"Felsenkirche Bete Giyorgis","a":"Zagwe-Dynastie, König Lalibela","j":"ca. 1200","y":1200,"e":2,"r":"Afrika","o":["Lalibela, Äthiopien",12.032,39.047],"x":"König Lalibela ließ im Hochland Äthiopiens elf Kirchen aus dem gewachsenen Fels schlagen, als neues Jerusalem, nachdem die heilige Stadt für Pilger unerreichbar geworden war. Die bekannteste ist Bete Giyorgis, die Kirche des heiligen Georg. Sie ist in Form eines griechischen Kreuzes zwölf Meter tief in den Boden gehauen, von oben sieht man das Kreuz auf dem Dach. Steinmetze gruben zunächst einen Graben um einen Felsblock und höhlten ihn dann von innen aus, mit Fenstern, Türen und Gesimsen. Gräben, Tunnel und Gänge verbinden die Kirchen untereinander. Äthiopien ist eines der ältesten christlichen Länder der Welt, und die Kirchen werden bis heute genutzt, vor allem zum Weihnachtsfest pilgern Zehntausende. Lalibela ist ein Meisterwerk afrikanischer Architektur."},{"k":"b30","b":1,"t":"Cliff Palace","a":"Ancestral Puebloans","j":"ca. 1200","y":1200,"e":2,"r":"Amerika","o":["Mesa Verde, USA",37.167,-108.462],"x":"Cliff Palace ist die größte Felsensiedlung Nordamerikas und liegt geschützt unter einem gewaltigen Felsüberhang. Rund 150 Räume und 23 runde Zeremonialräume, sogenannte Kivas, wurden aus Sandsteinblöcken, Lehmmörtel und Holzbalken gebaut. Die Ahnen der heutigen Pueblo-Völker lebten hier im 13. Jahrhundert, bauten Mais auf den Hochflächen an und erreichten die Siedlung über Felsstufen und Leitern. Die Häuser sind mehrstöckig, manche bis zu vier Etagen, und teilweise farbig verputzt. Um 1300 verließen die Bewohner die Siedlung, vermutlich wegen Dürre und Konflikten, und zogen nach Süden. Cliff Palace zeigt eine hochentwickelte indigene Architektur, die perfekt an Klima und Landschaft angepasst ist. Der Ort ist für die Pueblo-Völker bis heute bedeutsam."},{"k":"b31","b":1,"t":"Kölner Dom","a":"Gotische Dombaumeister","j":"1248 bis 1880","y":1248,"e":2,"r":"Europa","o":["Köln",50.941,6.958],"x":"Der Kölner Dom ist eine der größten Kathedralen der Welt und das Wahrzeichen Kölns. Er wurde als Gehäuse für den Dreikönigenschrein gebaut und orientierte sich an den französischen Kathedralen von Amiens und Paris. Die Baustelle ruhte von etwa 1520 an über 300 Jahre, ein alter Baukran blieb als Symbol der Unvollendung auf dem Südturm stehen. Erst nach der Wiederentdeckung mittelalterlicher Pläne wurde der Dom im 19. Jahrhundert als nationales Projekt vollendet. Mit 157 Metern waren seine Türme kurz das höchste Bauwerk der Welt. Die Fenster reichen von mittelalterlichen Bildfenstern bis zum Fenster von Gerhard Richter aus 11.500 Farbquadraten von 2007. Der Dom überstand den Zweiten Weltkrieg schwer beschädigt, aber stehend, inmitten der zerstörten Stadt."},{"k":"b32","b":1,"t":"Alhambra","a":"Nasriden-Dynastie","j":"13. bis 14. Jh.","y":1350,"e":2,"r":"Europa","o":["Granada, Spanien",37.176,-3.588],"x":"Die Alhambra in Granada ist die Burg- und Palastanlage der Nasriden, der letzten muslimischen Herrscher in Spanien. Von außen eine rote Festung, öffnet sie sich innen zu Höfen, Gärten und Sälen von märchenhafter Schönheit. Wände sind mit Stuck, Kacheln und Inschriften bedeckt, Gewölbe mit Mocárabes, wabenartigen Stalaktiten, die wie gefrorenes Licht wirken. Im Löwenhof tragen zwölf Löwen einen Brunnen, von dem Kanäle in vier Richtungen fließen, ein Abbild des Paradieses. Wasser, Licht und Schatten sind als Gestaltungsmittel ebenso wichtig wie Stein. Die geometrischen Muster der Kacheln faszinierten später den Grafiker M. C. Escher und Mathematiker. 1492 übergab der letzte Sultan die Stadt an die Katholischen Könige, die Alhambra blieb als Zeugnis von al-Andalus erhalten."},{"k":"b33","b":1,"t":"Verbotene Stadt","a":"Ming-Dynastie, Kaiser Yongle","j":"1406 bis 1420","y":1420,"e":3,"r":"Asien","o":["Peking, China",39.916,116.397],"x":"Die Verbotene Stadt war fast 500 Jahre lang der Kaiserpalast Chinas, Wohnsitz von 24 Kaisern der Ming- und Qing-Dynastien. Mit fast tausend Gebäuden auf über 70 Hektar ist sie der größte erhaltene Holzpalast der Welt. Die Anlage ist streng symmetrisch entlang einer Nord-Süd-Achse geplant, die Hallen werden zur Mitte hin immer größer und bedeutender. Gelbe Dachziegel waren dem Kaiser vorbehalten, Figuren auf den Dachfirsten zeigen den Rang eines Gebäudes. Die Halle der Höchsten Harmonie diente für Krönungen und Staatszeremonien. Gewöhnliche Menschen durften die Stadt nicht betreten, daher ihr Name. Seit 1925 ist sie das Palastmuseum, eines der meistbesuchten Museen der Welt. Sie ist ein Modell dafür, wie Architektur eine kosmische und politische Ordnung abbildet."},{"k":"b34","b":1,"t":"Domkuppel von Florenz","a":"Filippo Brunelleschi","j":"1420 bis 1436","y":1436,"e":3,"r":"Europa","o":["Florenz, Italien",43.773,11.256],"x":"Die Kuppel des Doms Santa Maria del Fiore gilt als Beginn der Renaissance-Architektur und als technische Meisterleistung. Das Loch über dem Altar war über 40 Meter weit und blieb jahrzehntelang offen, weil niemand wusste, wie man es ohne Gerüst überwölben sollte. Filippo Brunelleschi gewann 1418 den Wettbewerb mit einer kühnen Idee, einer doppelschaligen Kuppel aus Ziegeln im Fischgrätverband, die sich beim Bau selbst trägt. Er erfand dafür eigene Hebemaschinen. Bis heute ist es die größte gemauerte Kuppel der Welt. Brunelleschi entdeckte zudem die Zentralperspektive, die die Malerei revolutionierte. Die Kuppel wurde zum Vorbild für den Petersdom, das Kapitol in Washington und unzählige weitere Kuppeln. Sie steht für den Mut der Renaissance, Neues zu wagen."},{"k":"b35","b":1,"t":"Machu Picchu","a":"Inka, Pachacútec","j":"ca. 1450","y":1450,"e":3,"r":"Amerika","o":["Machu Picchu, Peru",-13.163,-72.545],"x":"Machu Picchu liegt auf 2430 Metern auf einem Bergsattel in den Anden, umgeben von steilen Gipfeln und Wolken. Die Stadt wurde unter dem Inka-Herrscher Pachacútec als königlicher Landsitz und religiöses Zentrum erbaut. Die Mauern bestehen aus perfekt zugeschnittenen Granitblöcken, die ohne Mörtel so genau zusammenpassen, dass keine Messerklinge dazwischen passt. Diese Bauweise macht sie erdbebensicher. Terrassen sichern die Hänge und dienten dem Ackerbau, ein Kanalsystem versorgte die Stadt mit Wasser. Der Sonnentempel und der Intihuatana-Stein zeigen die Bedeutung von Sonne und Kalender. Nach der spanischen Eroberung wurde die Stadt verlassen und von den Spaniern nie gefunden. Heute ist sie eines der neuen Sieben Weltwunder und Symbol der Inka-Kultur."},{"k":"b36","b":1,"t":"Basilius-Kathedrale","a":"Postnik Jakowlew und Barma","j":"1555 bis 1561","y":1561,"e":3,"r":"Europa","o":["Moskau, Russland",55.753,37.623],"x":"Die Basilius-Kathedrale am Roten Platz ist das bekannteste Bauwerk Russlands. Zar Iwan der Schreckliche ließ sie zur Erinnerung an die Eroberung von Kasan bauen. Neun Kirchen gruppieren sich um eine zentrale Kirche, jede mit eigener Kuppel in Zwiebelform und eigenem Muster, gedreht, gerippt, gezackt. Die heute leuchtenden Farben kamen erst im 17. Jahrhundert hinzu. Die Anlage soll das himmlische Jerusalem darstellen. Eine Legende erzählt, der Zar habe die Baumeister blenden lassen, damit sie nie wieder etwas so Schönes bauen könnten, was historisch nicht belegt ist. Die Kathedrale entging nach der Revolution nur knapp dem Abriss. Sie wurde zum Inbegriff russischer Architektur und zum Bildsymbol für Moskau."},{"k":"b37","b":1,"t":"Villa Rotonda","a":"Andrea Palladio","j":"ab ca. 1567","y":1570,"e":3,"r":"Europa","o":["Vicenza, Italien",45.531,11.56],"x":"Die Villa Rotonda bei Vicenza ist das berühmteste Landhaus der Architekturgeschichte. Andrea Palladio entwarf sie als vollkommen symmetrischen Bau mit quadratischem Grundriss, einer zentralen Kuppel und vier gleichen Tempelfassaden mit Säulen, je eine in jede Himmelsrichtung. Von jeder Seite bietet sich ein anderer Blick auf die Landschaft. Palladio übertrug den antiken Tempel auf ein Wohnhaus und verband Klarheit, Proportion und Natur. Seine Vier Bücher zur Architektur machten seine Entwürfe in ganz Europa bekannt. Der Palladianismus prägte englische Landhäuser, Schlösser und Kirchen und kam bis nach Amerika, das Weiße Haus und Jeffersons Monticello sind von ihm beeinflusst. Kaum ein Architekt hat so viele Nachahmer gefunden."},{"k":"b38","b":1,"t":"Burg Himeji","a":"Ikeda Terumasa","j":"1601 bis 1609","y":1609,"e":3,"r":"Asien","o":["Himeji, Japan",34.839,134.694],"x":"Die Burg Himeji ist die schönste und am besten erhaltene Burg aus Japans Feudalzeit. Wegen ihrer weißen Mauern und geschwungenen Dächer wird sie Weißer Reiher genannt. Der Hauptturm erhebt sich über einem steinernen Sockel auf sechs Stockwerken, umgeben von kleineren Türmen, Toren und Mauern. Die Anlage ist ein Labyrinth aus Wegen, die Angreifer verwirren und in Fallen führen sollten. Die weiße Putzschicht schützte das Holz vor Feuer. Bemerkenswert ist, dass die Burg nie belagert wurde und auch die Bombardierungen des Zweiten Weltkriegs fast unbeschadet überstand. Sie zeigt, wie Verteidigung und Ästhetik in der japanischen Architektur zusammengedacht wurden, und gilt als Symbol der Samurai-Zeit."},{"k":"b39","b":1,"t":"Blaue Moschee","a":"Sedefkâr Mehmed Ağa","j":"1609 bis 1616","y":1616,"e":3,"r":"Europa","o":["Istanbul, Türkei",41.005,28.977],"x":"Die Sultan-Ahmed-Moschee, wegen ihrer Fliesen Blaue Moschee genannt, ist eines der Wahrzeichen Istanbuls. Sultan Ahmed I. ließ sie gegenüber der Hagia Sophia bauen, um mit ihr zu wetteifern. Eine große Kuppel wird von Halbkuppeln und kleineren Kuppeln umgeben, die wie eine Kaskade ansteigen. Innen leuchten über 20.000 handgefertigte Fliesen aus Iznik mit Tulpen, Rosen, Nelken und Zypressen in Blau, Türkis und Grün. Über 200 Fenster lassen Licht in den Raum. Mit sechs Minaretten war sie ungewöhnlich, denn bis dahin hatte nur die Moschee in Mekka so viele, weshalb dort ein siebtes ergänzt wurde. Die Moschee ist ein Höhepunkt der klassischen osmanischen Architektur nach dem Vorbild des Baumeisters Sinan und wird bis heute zum Gebet genutzt."},{"k":"b40","b":1,"t":"Petersdom","a":"Bramante, Michelangelo, Maderno, Bernini","j":"1506 bis 1626","y":1626,"e":3,"r":"Europa","o":["Rom (Vatikan)",41.902,12.454],"x":"Der Petersdom ist die größte Kirche des Christentums und das Zentrum der katholischen Kirche. Er steht über dem vermuteten Grab des Apostels Petrus, an der Stelle einer Basilika aus der Zeit Konstantins. An dem Neubau arbeiteten über 120 Jahre die größten Künstler der Renaissance und des Barock, Bramante plante den Grundriss, Michelangelo entwarf die Kuppel, Maderno verlängerte das Schiff, Bernini gestaltete den Baldachin und den Petersplatz mit seinen Kolonnaden, die wie Arme die Gläubigen umfangen. Die Kuppel ist rund 136 Meter hoch. Finanziert wurde der Bau unter anderem durch den Verkauf von Ablässen, was Martin Luther anprangerte und damit die Reformation auslöste. Der Dom ist daher auch ein Schlüssel zur Geschichte der Kirchenspaltung."},{"k":"b41","b":1,"t":"Potala-Palast","a":"5. Dalai Lama","j":"ab 1645","y":1645,"e":3,"r":"Asien","o":["Lhasa, Tibet",29.658,91.117],"x":"Der Potala-Palast thront auf 3700 Metern Höhe über Lhasa und ist eines der höchstgelegenen Großbauwerke der Welt. Der 5. Dalai Lama ließ ihn als Winterresidenz und Sitz der tibetischen Regierung errichten. Der Weiße Palast diente der Verwaltung und als Wohnung, der Rote Palast in der Mitte dem Gebet und als Grabstätte früherer Dalai Lamas, deren goldene Stupas hier stehen. Über 1000 Räume, Tausende Wandmalereien und Statuen verbinden Religion und Herrschaft. Die schrägen Mauern sind an der Basis bis zu fünf Meter dick und wachsen scheinbar aus dem Berg. Seit der 14. Dalai Lama 1959 ins indische Exil floh, ist der Palast ein Museum. Er ist ein Symbol der tibetischen Kultur und des politischen Konflikts um Tibet."},{"k":"b42","b":1,"t":"Taj Mahal","a":"Mogulkaiser Shah Jahan","j":"1632 bis 1653","y":1653,"e":3,"r":"Asien","o":["Agra, Indien",27.175,78.042],"x":"Das Taj Mahal ist das berühmteste Bauwerk Indiens und gilt als Inbegriff der Liebe. Mogulkaiser Shah Jahan ließ es als Grabmal für seine Frau Mumtaz Mahal errichten, die bei der Geburt ihres 14. Kindes starb. Rund 20.000 Arbeiter bauten über 20 Jahre an dem Mausoleum aus weißem Marmor. Die Architektur verbindet persische, islamische und indische Elemente in vollkommener Symmetrie, gespiegelt in einem langen Wasserbecken. Der Marmor ist mit Halbedelsteinen eingelegt, Blumen und Koranverse schmücken die Wände, die Schrift wird nach oben größer, damit sie gleich groß erscheint. Je nach Tageszeit wechselt der Marmor die Farbe von Rosa über Weiß bis Gold. Shah Jahan wurde später von seinem Sohn abgesetzt und konnte das Taj Mahal nur noch aus seinem Gefängnis sehen. Er wurde neben seiner Frau begraben."},{"k":"b43","b":1,"t":"Schloss Versailles","a":"Louis Le Vau, Jules Hardouin-Mansart, André Le Nôtre","j":"ab 1661","y":1682,"e":3,"r":"Europa","o":["Versailles, Frankreich",48.805,2.12],"x":"Versailles ist das Musterbild des absolutistischen Schlosses und Symbol der Macht Ludwigs XIV., des Sonnenkönigs. Aus einem Jagdschloss machte er einen gigantischen Palast, in den er 1682 den ganzen Hof und die Regierung verlegte. Der Spiegelsaal mit 357 Spiegeln und Kronleuchtern sollte Reichtum und Licht zur Schau stellen. Die von André Le Nôtre gestalteten Gärten ordnen die Natur in geometrische Achsen, Wasserbecken und Hecken bis zum Horizont, der Mensch als Herrscher über die Natur. Das Leben am Hof war eine streng choreografierte Bühne, auf der Adlige um die Nähe des Königs konkurrierten. Fürsten in ganz Europa, von Potsdam bis Sankt Petersburg, kopierten Versailles. 1789 marschierten Pariser Frauen nach Versailles und holten den König nach Paris, das Ende einer Epoche."},{"k":"b44","b":1,"t":"Palace of Westminster","a":"Charles Barry und A. W. N. Pugin","j":"1840 bis 1870","y":1860,"e":4,"r":"Europa","o":["London",51.5,-0.125],"x":"Der Palace of Westminster ist Sitz des britischen Parlaments und eines der Hauptwerke der Neugotik. Nach einem Brand 1834 gewann Charles Barry den Wettbewerb, Augustus Pugin entwarf die Fassaden und die gesamte Ausstattung bis zu Tintenfässern und Tapeten. Der neugotische Stil wurde bewusst gewählt, um an die mittelalterlichen Ursprünge der englischen Freiheiten zu erinnern. Der Uhrturm mit der Glocke Big Ben, seit 2012 Elizabeth Tower genannt, wurde zum Symbol Londons. Der Palast hat über 1100 Räume und mehr als drei Kilometer Gänge. Die Westminster Hall aus dem 11. Jahrhundert mit ihrem Holzdach blieb vom Brand verschont. Das Gebäude ist ein Beispiel dafür, wie Architektur Geschichte und politische Identität erzählt."},{"k":"b45","b":1,"t":"Schloss Neuschwanstein","a":"König Ludwig II., Architekt Eduard Riedel","j":"ab 1869","y":1886,"e":4,"r":"Europa","o":["Schwangau, Deutschland",47.558,10.75],"x":"Neuschwanstein ist das berühmteste Schloss Deutschlands und eine Burg aus Träumen statt aus Notwendigkeit. König Ludwig II. von Bayern ließ es als idealisierte Ritterburg in einer dramatischen Alpenlandschaft bauen, inspiriert von den Opern Richard Wagners. Die Innenräume zeigen Szenen aus Sagen wie Lohengrin und Tannhäuser, ein Thronsaal ohne Thron erinnert an eine byzantinische Kirche. Hinter den mittelalterlichen Fassaden steckte modernste Technik, Zentralheizung, fließendes Wasser und Telefon. Der Bühnenmaler Christian Jank entwarf die ersten Pläne, was den theatralischen Charakter erklärt. Ludwig wohnte nur wenige Monate im unvollendeten Schloss, bevor er 1886 entmündigt wurde und unter ungeklärten Umständen starb. Neuschwanstein diente als Vorbild für das Disney-Schloss und ist ein Inbegriff des Historismus."},{"k":"b46","b":1,"t":"Sagrada Família","a":"Antoni Gaudí","j":"ab 1882","y":1882,"e":4,"r":"Europa","o":["Barcelona, Spanien",41.404,2.174],"x":"Die Sagrada Família ist die berühmteste unvollendete Kirche der Welt und das Lebenswerk Antoni Gaudís. Er übernahm 1883 das Projekt und arbeitete über 40 Jahre daran, bis er 1926 von einer Straßenbahn erfasst wurde. Gaudí entwickelte eine Architektur nach dem Vorbild der Natur, Säulen verzweigen sich wie Bäume, Gewölbe öffnen sich wie Blätter, Licht fällt in allen Farben durch die Fenster. Er berechnete Formen mit hängenden Kettenmodellen, deren Spannungslinien er umkehrte. Drei Fassaden erzählen Geburt, Passion und Herrlichkeit Christi, 18 Türme sollen die Apostel, Evangelisten, Maria und Jesus darstellen. Der Bau wird nur durch Spenden und Eintrittsgelder finanziert und soll in den 2020er Jahren weitgehend vollendet werden. Er ist ein Hauptwerk des katalanischen Modernisme."},{"k":"b47","b":1,"t":"Brooklyn Bridge","a":"John A. Roebling und Washington Roebling","j":"1869 bis 1883","y":1883,"e":4,"r":"Amerika","o":["New York, USA",40.706,-73.997],"x":"Die Brooklyn Bridge war bei ihrer Eröffnung die längste Hängebrücke der Welt und die erste mit Drahtseilen aus Stahl. Sie verbindet Manhattan mit Brooklyn über den East River. Der deutschstämmige Ingenieur John A. Roebling entwarf sie, starb aber kurz nach Baubeginn an einem Unfall. Sein Sohn Washington übernahm, erkrankte an der Taucherkrankheit und leitete den Bau vom Bett aus, seine Frau Emily Warren Roebling setzte die Arbeit vor Ort durch und wurde zur ersten Person, die die Brücke überquerte. Die neugotischen Bögen der Pfeiler verbinden Ingenieurskunst mit Architektur. Die Brücke wurde zum Symbol der Moderne und des amerikanischen Fortschritts. Künstler wie Joseph Stella und Dichter wie Hart Crane feierten sie."},{"k":"b48","b":1,"t":"Eiffelturm","a":"Gustave Eiffel, Maurice Koechlin, Stephen Sauvestre","j":"1887 bis 1889","y":1889,"e":4,"r":"Europa","o":["Paris",48.858,2.295],"x":"Der Eiffelturm wurde für die Weltausstellung 1889 zum hundertsten Jahrestag der Französischen Revolution gebaut. Mit 300 Metern war er bis 1930 das höchste Bauwerk der Welt. Seine 18.000 Eisenteile wurden vorgefertigt und mit 2,5 Millionen Nieten in nur zwei Jahren montiert, ein Triumph der Industrialisierung. Viele Künstler und Intellektuelle protestierten gegen das nutzlose und monströse Eisengerüst, das Paris verschandle. Der Turm sollte nach 20 Jahren abgerissen werden, wurde aber als Funkturm gerettet. Heute ist er das Wahrzeichen Frankreichs und eines der meistbesuchten Bauwerke der Welt. Er steht für den Übergang zu einer Architektur, die Konstruktion offen zeigt statt versteckt, und inspirierte Maler wie Robert Delaunay."},{"k":"b49","b":1,"t":"Secessionsgebäude","a":"Joseph Maria Olbrich","j":"1897 bis 1898","y":1898,"e":4,"r":"Europa","o":["Wien",48.2,16.366],"x":"Das Secessionsgebäude wurde als Ausstellungshaus der Wiener Secession gebaut, einer Künstlergruppe um Gustav Klimt, die sich von der konservativen Akademie lossagte. Über dem Eingang steht ihr Motto, der Zeit ihre Kunst, der Kunst ihre Freiheit. Joseph Maria Olbrich entwarf einen weißen, kubischen Bau mit einer durchbrochenen Kuppel aus 3000 vergoldeten Lorbeerblättern, von den Wienern spöttisch Krauthappel genannt. Innen ist das Gebäude flexibel, die Räume können für jede Ausstellung neu gestaltet werden. Im Keller befindet sich Klimts Beethovenfries von 1902, ein Gesamtkunstwerk aus Malerei, Musik und Architektur. Das Gebäude ist ein Manifest des Jugendstils und ein Wegbereiter der modernen Architektur. Es zeigt, wie Künstler sich eigene Räume für neue Kunst schufen."},{"k":"b50","b":1,"t":"Große Moschee von Djenné","a":"Gemeinschaft von Djenné, Baumeister Ismaila Traoré","j":"1907","y":1907,"e":4,"r":"Afrika","o":["Djenné, Mali",13.906,-4.555],"x":"Die Große Moschee von Djenné ist das größte Lehmgebäude der Welt und das Hauptwerk der sudanesisch-sahelischen Architektur. Ihre Wände bestehen aus sonnengetrockneten Lehmziegeln und Lehmputz, Holzbalken aus Palmholz ragen aus den Mauern. Diese Balken dienen als dauerhaftes Gerüst für die jährliche Erneuerung und als Dekoration. Drei Türme mit Straußeneiern auf den Spitzen erheben sich über der Fassade. Jedes Jahr kommt die ganze Stadt zum Fest der Crépissage zusammen, um die Moschee nach der Regenzeit mit neuem Lehm zu verputzen, ein gemeinsames Werk über Generationen. Die erste Moschee an dieser Stelle stammt vermutlich aus dem 13. Jahrhundert, der heutige Bau von 1907. Die Moschee zeigt, dass Architektur nicht nur Material, sondern auch eine lebendige Praxis der Gemeinschaft ist."}];

function starteEtappeQuiz(et) {

  const arten = shuffle(['werk', 'werk', 'werk', 'werk', 'wer', 'wer', 'wer', 'ort', 'ort', 'ort']).slice(0, list.length);

}
function starteFrei(m) {
  const P = shuffle(spielPool(spielBereich).slice()), list = P.slice(0, Math.min(10, P.length)); if (!list.length) return;
  starteQuiz({ kind: 'frei', m, b: spielBereich, order: list, arten: list.map(() => m === 'mix' ? ['werk', 'wer', 'ort', 'epoche'][Math.floor(Math.random() * 4)] : m) });
}
function endGame() { game = null; guess = null; gArc = null; gShow = null; sel = -1; closeKarte(); }

  const reihe = game.order.map((x, k) => `<i class="${k < game.erg.length ? (game.erg[k].ok ? 'r' : 'f') : k === game.r ? 'j' : ''}"></i>`).join('');
  return `<div class="kopfzeile"><span class="runde">${quizTitel()} · Frage ${game.r + 1} von ${game.n}${game.kind === 'frei' ? ' · ' + zahl(game.score) + ' Punkte' : ''}</span><button class="x" aria-label="Beenden">×</button></div><div class="punktreihe">${reihe}</div>`;
}
const benannt = x => !/kultur|zeit|dynastie|reich|isch\b|ische|ischer|mönche|jäger|aborigines|rapa nui|shona|yoruba|olmeken|moche|nazca|maya|azteken|muisca|inka|nabatäer|sumerer|umayyaden|minoer|khmer|safawiden|ancestral/i.test(x.a);
function optionen(w, feld) {
  const P = WERKE.filter(x => x.bau === w.bau && x[feld] !== w[feld] && !x[feld].includes(w[feld]) && !w[feld].includes(x[feld]));
  const gleich = x => feld !== 'a' || benannt(x) === benannt(w);
  const stufen = [x => x.et === w.et, x => x.e === w.e && x.r === w.r, x => x.e === w.e, x => x.r === w.r, () => true];
  const order = [];
  stufen.forEach(f => shuffle(P.filter(x => f(x) && gleich(x))).forEach(x => order.push(x)));
  shuffle(P.slice()).forEach(x => order.push(x));

  for (const x of order) { if (!seen.has(x[feld])) { seen.add(x[feld]); out.push(x[feld]); } if (out.length === 3) break; }
  return shuffle(out.concat([w[feld]]));
}
function askRound() {

  const art = game.arten[game.r]; game.art = art;

  else if (art === 'wer') html += bildHtml(w) + `<h2>${esc(w.t)}</h2><p class="frage">${benannt(w) ? (w.bau ? 'Wer hat es gebaut?' : 'Wer hat es geschaffen?') : 'Welcher Kultur oder Zeit wird es zugeordnet?'}</p><div class="antworten">${optionen(w, 'a').map(o => `<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  else if (art === 'epoche') html += bildHtml(w) + `<h2>${esc(w.t)}</h2><p class="frage">Aus welcher Epoche stammt es?</p><div class="antworten">${EP.map((e, n) => `<button data-e="${n}">${e.n}<small>${e.s}</small></button>`).join('')}</div>`;
  else html += bildHtml(w) + `<h2>${esc(w.t)}</h2><p class="frage">Wo steht es heute?</p><p class="hinweis">Drehe die Kugel und tippe auf die Stelle. Bis 500 km gilt als richtig.</p><div class="unten"><button class="knopf" id="ok" disabled>Tipp bestätigen</button></div>`;
  setKarte(html, art === 'ort');

  if (art === 'ort') $('ok').onclick = answerOrt;
  karte.querySelectorAll('.antworten button').forEach(b => b.onclick = () => {

    karte.querySelectorAll('.antworten button').forEach(x => { if (x.dataset.o === w[feld]) x.classList.add('richtig'); });
    if (!ok) b.classList.add('falsch');
    klang(ok ? 'gut' : 'schade');

}

  setKarte(rundenKopf() + `<div class="rueckmeldung ${ok ? 'gut' : 'schlecht'}">${ok ? '✓ ' : '✗ '}${esc(titel)}${game.kind === 'frei' ? ' +' + zahl(p) + ' Punkte' : ''}${txt ? `<small>${esc(txt)}</small>` : ''}</div>` + werkHtml(w) +
    `<div class="unten"><button class="knopf" id="weiter">${letzte ? 'Ergebnis ansehen' : 'Nächste Frage ›'}</button></div>`);

}
function answerOrt() {

  gArc = th > 0.004 ? arcPoints(gg, w.gb, 56) : null; gArcStart = performance.now(); gShow = w; sel = -1;

function ergebnisListe() { return `<div class="album" style="margin-top:12px">${game.erg.map(x => kachelHtml(x.w, x.ok)).join('')}</div>`; }
