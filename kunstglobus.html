<script>
const DATA=[{"k":"a001","b":0,"t":"Höhle von Lascaux","a":"Kultur des Magdalénien","j":"ca. 17.000 v. Chr.","y":-17000,"e":0,"r":"Europa","o":["Montignac, Frankreich",45.054,1.167],"x":"Lascaux gilt als die Sixtinische Kapelle der Eiszeit. Rund 600 gemalte Tiere und etwa 1500 Gravuren zeigen Pferde, Auerochsen, Hirsche und Wisente in großer Lebendigkeit. Die Maler nutzten Wölbungen des Felsens, um den Körpern Volumen zu geben, und arbeiteten mit Ocker, Mangan und Holzkohle, teils mit Pinseln, teils aufgeblasen. Der berühmte Stiersaal mit Tieren von über fünf Metern Länge zeigt, dass schon damals große, geplante Kompositionen entstanden. Die Entdeckung 1940 veränderte das Bild der Altsteinzeit grundlegend, denn sie belegte eine hochentwickelte Bildkultur lange vor Schrift und Ackerbau. Bis heute ist offen, ob die Bilder Jagdzauber, Mythen, Initiationsriten oder Himmelsbeobachtungen festhalten. Gerade diese Offenheit macht Lascaux zu einem Grundtext jeder Kunstgeschichte, die nach dem Ursprung des Bildermachens fragt."},{"k":"a002","b":0,"t":"Bisons von Altamira","a":"Kultur des Magdalénien","j":"ca. 15.000 v. Chr.","y":-15000,"e":0,"r":"Europa","o":["Santillana del Mar, Spanien",43.377,-4.12],"x":"Altamira war die erste Höhle, deren Malereien als altsteinzeitlich erkannt wurden, und schrieb damit Wissenschaftsgeschichte. An der niedrigen Decke liegen und stehen Bisons in Rot und Schwarz, deren Körper genau den Buckeln des Felsens folgen. So entsteht eine fast plastische Wirkung, die man im flackernden Licht einer Fackel noch stärker erlebt haben muss. Als Marcelino Sanz de Sautuola und seine Tochter Maria die Bilder 1879 bekannt machten, hielten Fachleute sie für eine Fälschung, weil man den Menschen der Eiszeit solche Kunst nicht zutraute. Erst nach weiteren Funden in Frankreich wurde die Echtheit 1902 anerkannt, ein berühmter Widerruf in der Forschung. Altamira steht daher nicht nur für frühe Meisterschaft, sondern auch für die Vorurteile, mit denen wir auf vermeintlich primitive Kunst schauen. Picasso soll nach einem Besuch gesagt haben, nach Altamira sei alles Dekadenz."},{"k":"a003","b":0,"t":"Chauvet-Höhle","a":"Kultur des Aurignacien","j":"ca. 34.000 v. Chr.","y":-34000,"e":0,"r":"Europa","o":["Vallon-Pont-d'Arc, Frankreich",44.387,4.415],"x":"Die Chauvet-Höhle enthält einige der ältesten bekannten Höhlenbilder überhaupt und hat die Vorstellung einer langsamen Entwicklung der Kunst über den Haufen geworfen. Schon vor über 30.000 Jahren entstanden hier Löwen, Nashörner, Mammuts und Pferde mit Schattierungen, Perspektive und Bewegungsandeutung. Mehrere Pferdeköpfe sind gestaffelt hintereinander gezeichnet, Nashörner mit mehrfachen Hörnern wirken wie Phasen einer Bewegung, fast wie ein früher Film. Viele dargestellte Tiere waren gefährliche Raubtiere, was auf eine andere Bedeutung als reine Jagdbeute schließen lässt. Ein Felssturz versiegelte die Höhle, sodass Bärenknochen, Fußspuren und Fackelreste unberührt erhalten blieben. Der Regisseur Werner Herzog machte sie 2010 im Film Die Höhle der vergessenen Träume einem breiten Publikum bekannt. Für die Kunstgeschichte zeigt Chauvet, dass Bildkompetenz von Anfang an erstaunlich ausgereift war."},{"k":"a004","b":0,"t":"Löwenmensch","a":"Kultur des Aurignacien","j":"ca. 40.000 v. Chr.","y":-40000,"e":0,"r":"Europa","o":["Hohlenstein-Stadel, Deutschland",48.547,10.165],"x":"Der Löwenmensch ist eine der ältesten bekannten figürlichen Skulpturen der Welt und vielleicht das älteste Zeugnis religiöser Vorstellungskraft. Aus einem Mammutstoßzahn schnitzte ein Mensch der Eiszeit ein Wesen mit Löwenkopf und aufrechtem menschlichem Körper. Die Arbeit mit Feuersteinwerkzeugen dürfte Hunderte Stunden gedauert haben, was den hohen Wert der Figur für ihre Gemeinschaft zeigt. Entscheidend ist, dass hier nichts abgebildet wird, was man sehen konnte, sondern ein gedachtes Mischwesen. Damit belegt die Figur die Fähigkeit zu Abstraktion, Fantasie und vielleicht Mythenbildung. Zusammen mit anderen Funden von der Schwäbischen Alb gehört sie zum UNESCO-Welterbe Höhlen und Eiszeitkunst. Für den Kunstunterricht ist sie ein Schlüsselwerk, wenn es um die Frage geht, wann und warum Menschen begannen, Bilder von Ungesehenem zu schaffen.","s":["Museum Ulm",48.398,9.992]},{"k":"a005","b":0,"t":"Venus von Willendorf","a":"Altsteinzeit","j":"ca. 29.500 v. Chr.","y":-29500,"e":0,"r":"Europa","o":["Willendorf, Österreich",48.335,15.4],"x":"Die elf Zentimeter kleine Kalksteinfigur ist eine der bekanntesten Darstellungen des menschlichen Körpers aus der Altsteinzeit. Brüste, Bauch und Hüften sind stark betont, das Gesicht fehlt, die Haare oder eine Kopfbedeckung sind in feinen Reihen ausgearbeitet. Reste roter Farbe zeigen, dass sie ursprünglich mit Ocker bemalt war. Der Stein stammt aus einer weit entfernten Region, die Figur wurde also mitgetragen oder gehandelt. Gedeutet wurde sie als Fruchtbarkeitsidol, Muttergöttin, Amulett oder Selbstdarstellung, doch keine dieser Thesen ist belegbar. Der Name Venus ist eine ironische Zuschreibung des 19. Jahrhunderts und sagt mehr über die Sicht der Entdecker als über die Figur. Sie steht exemplarisch für die Frage, wie wir Körperbilder vergangener Kulturen mit unseren eigenen Schönheitsnormen lesen.","s":["Naturhistorisches Museum, Wien",48.205,16.36]},{"k":"a006","b":0,"t":"Schlangengöttin","a":"Minoische Kultur","j":"ca. 1600 v. Chr.","y":-1600,"e":1,"r":"Europa","o":["Knossos, Kreta",35.298,25.163],"x":"Die Fayence-Figur mit erhobenen Schlangen ist zum Sinnbild der minoischen Kultur geworden, der ersten Hochkultur Europas. Sie trägt einen glockenförmigen Stufenrock, ein enges Mieder mit entblößten Brüsten und auf dem Kopf ein Tier. Die frontale, beschwörende Haltung lässt an eine Gottheit oder Priesterin denken. Der Ausgräber Arthur Evans fand die Stücke 1903 zerbrochen und ließ sie ergänzen, wobei manche Teile, etwa die Katze auf dem Kopf, auf seine Vorstellung zurückgehen. Damit ist die Figur auch ein Lehrstück darüber, wie Rekonstruktion unser Bild der Antike formt. Da die minoische Schrift Linear A nicht entziffert ist, bleibt ihre Bedeutung offen. Für die Kunstgeschichte markiert sie die farbige, naturnahe Bildwelt Kretas, die sich deutlich von der strengen Kunst Ägyptens unterscheidet.","s":["Archäologisches Museum, Heraklion",35.339,25.144]},{"k":"a007","b":0,"t":"Parthenon-Fries (Elgin Marbles)","a":"Werkstatt des Phidias","j":"ca. 440 v. Chr.","y":-440,"e":1,"r":"Europa","o":["Athen",37.972,23.726],"x":"Der Fries des Parthenon gilt als Höhepunkt der griechischen Klassik. Auf rund 160 Metern zog sich ein Festzug um den Tempel der Athena, mit Reitern, Opfertieren, Wasserträgern und thronenden Göttern. Unter der Leitung des Bildhauers Phidias entstand eine Kunst, die Ruhe und Bewegung, Ideal und Natürlichkeit ins Gleichgewicht bringt. Die Pferde bäumen sich in Reihen hintereinander, die Gewänder fallen so, dass man die Körper darunter ahnt. Erstmals zeigte ein Tempelfries vermutlich nicht nur Mythen, sondern auch die Bürger Athens selbst, ein Selbstbild der jungen Demokratie. Seit der Abnahme durch Lord Elgin gehört der Fries zu den meistdiskutierten Fällen der Rückgabedebatte. An ihm lässt sich fragen, ob ein Werk dorthin gehört, wo es geschaffen wurde, oder dorthin, wo es seit 200 Jahren bewahrt wird.","s":["British Museum, London",51.519,-0.127]},{"k":"a008","b":0,"t":"Nike von Samothrake","a":"Unbekannter hellenistischer Bildhauer","j":"ca. 190 v. Chr.","y":-190,"e":1,"r":"Europa","o":["Samothrake, Griechenland",40.483,25.533],"x":"Die Siegesgöttin landet mit ausgebreiteten Flügeln auf dem Bug eines Kriegsschiffs, ihr Gewand wird vom Seewind an den Körper gepresst. Kaum eine Skulptur verbindet so überzeugend Stein und Bewegung. Typisch hellenistisch ist die dramatische Inszenierung, denn die Figur stand ursprünglich über einem Brunnenbecken und wirkte wie ein Schiff, das in den Hafen einfährt. Die Falten sind als Wechsel von tiefem Schatten und hellen Graten gearbeitet, der Körper dreht sich in den Raum. Dass Kopf und Arme fehlen, steigert für viele die Wirkung, weil der Blick sich ganz auf den Schwung richtet. Im Louvre steht sie wirkungsvoll auf der großen Treppe und ist eine der meistfotografierten Skulpturen. Sie beeinflusste Darstellungen von Sieg und Fortschritt bis hin zur Kühlerfigur moderner Autos.","s":["Louvre, Paris",48.861,2.338]},{"k":"a009","b":0,"t":"Venus von Milo","a":"Alexandros von Antiochia (zugeschrieben)","j":"ca. 130 v. Chr.","y":-130,"e":1,"r":"Europa","o":["Melos, Griechenland",36.7,24.433],"x":"Die Venus von Milo wurde zum Inbegriff antiker Schönheit, obwohl sie erst 1820 gefunden wurde. Die Göttin, vermutlich Aphrodite, steht im Kontrapost, ihr Oberkörper ist nackt, das Gewand rutscht über die Hüften und scheint gleich zu fallen. Diese Spannung zwischen Ruhe und drohendem Moment ist typisch für die späte hellenistische Kunst. Frankreich präsentierte sie nach dem Verlust der Medici-Venus an Italien als nationalen Schatz und erhob sie bewusst zum Ideal. Die fehlenden Arme regten unzählige Rekonstruktionsversuche an, ob sie einen Apfel, einen Spiegel oder einen Schild hielt, bleibt offen. In der Moderne wurde sie zur Ikone, von Dalí bis zur Werbung zitiert. Sie zeigt, wie Ruhm eines Werks auch durch Museumspolitik, Fundgeschichte und Medien entsteht.","s":["Louvre, Paris",48.861,2.338]},{"k":"a010","b":0,"t":"Laokoon-Gruppe","a":"Agesander, Athanodoros und Polydoros","j":"ca. 40 v. Chr.","y":-40,"e":1,"r":"Europa","o":["Rhodos, Griechenland",36.434,28.218],"x":"Der trojanische Priester Laokoon und seine Söhne werden von Seeschlangen erwürgt, weil er vor dem hölzernen Pferd gewarnt hatte. Die Gruppe zeigt Schmerz und Todeskampf mit äußerster körperlicher Anspannung, jeder Muskel ist in Bewegung. Ihre Wiederentdeckung 1506 in Rom war eine Sensation, Michelangelo eilte zur Fundstelle und war tief beeindruckt. Die Renaissance sah in ihr den Beweis, dass die Antike nicht nur Ruhe, sondern auch höchstes Pathos darstellen konnte. Im 18. Jahrhundert wurde sie zum Ausgangspunkt einer Grundsatzdebatte, als Winckelmann von edler Einfalt und stiller Größe sprach und Lessing in seinem Laokoon die Grenzen von Malerei und Dichtung bestimmte. Bis heute ist umstritten, ob die Gruppe ein Original oder eine römische Kopie ist. Sie gehört zu den einflussreichsten Skulpturen der europäischen Kunstgeschichte.","s":["Vatikanische Museen, Rom",41.906,12.454]},{"k":"a011","b":0,"t":"Alexandermosaik","a":"Hellenistisch, nach einem Gemälde","j":"ca. 100 v. Chr.","y":-100,"e":1,"r":"Europa","o":["Pompeji, Italien",40.751,14.487],"x":"Das Mosaik zeigt den Moment, in dem Alexander der Große auf den persischen König Dareios III. zustürmt, der auf seinem Wagen zur Flucht gewendet wird. Es besteht aus rund 1,5 Millionen winzigen Steinchen und lag als Fußboden im Haus des Fauns in Pompeji. Vermutlich kopiert es ein berühmtes griechisches Gemälde, das sonst verloren wäre, und ist damit eine der wichtigsten Quellen für die antike Malerei. Verkürzte Pferde, sich überschneidende Lanzen und Schattenwürfe erzeugen Raumtiefe, wie man sie erst in der Renaissance wieder findet. Bemerkenswert ist, dass der Besiegte mit großem Mitgefühl dargestellt ist, Dareios streckt die Hand nach seinen fallenden Kämpfern aus. Der Ausbruch des Vesuvs 79 n. Chr. konservierte das Werk. Es zeigt, wie hoch entwickelt Bilderzählung und Illusion in der Antike waren.","s":["Archäologisches Nationalmuseum, Neapel",40.853,14.25]},{"k":"a012","b":0,"t":"Augustus von Prima Porta","a":"Römisch","j":"ca. 20 n. Chr.","y":20,"e":1,"r":"Europa","o":["Rom",41.903,12.496],"x":"Die Statue ist das Musterbeispiel römischer Herrscherdarstellung und politischer Bildsprache. Augustus steht im Panzer und hebt den Arm wie zu einer Ansprache, die Haltung zitiert den Speerträger des griechischen Bildhauers Polyklet. Sein Gesicht bleibt alterslos, obwohl der Kaiser zu dieser Zeit längst älter war, denn gezeigt wird ein Ideal, kein Porträt. Der Brustpanzer erzählt die diplomatische Rückgabe römischer Feldzeichen durch die Parther, ein Erfolg ohne Krieg, flankiert von Göttern. Die nackten Füße und der kleine Amor am Bein verweisen auf göttliche Abstammung aus dem Geschlecht der Venus. Ursprünglich war die Figur farbig bemalt. Sie zeigt eindrücklich, wie Bilder Macht legitimieren, und ist deshalb ein Schlüsselwerk für Bildanalyse und politische Ikonografie.","s":["Vatikanische Museen, Rom",41.906,12.454]},{"k":"a013","b":0,"t":"Justinian-Mosaik in San Vitale","a":"Byzantinisch","j":"ca. 547","y":547,"e":2,"r":"Europa","o":["Ravenna, Italien",44.42,12.196],"x":"In der Apsis von San Vitale steht Kaiser Justinian mit Bischof, Klerikern und Soldaten vor goldenem Grund, gegenüber seine Frau Theodora mit ihrem Hof. Die Mosaiken sind die berühmtesten Herrscherbilder der Spätantike und zeigen den Übergang von der römischen zur byzantinischen Kunst. Die Figuren stehen frontal, schweben ohne Schatten, ihre Füße überlappen sich, als hätten sie kein Gewicht. Der Goldgrund hebt sie aus Raum und Zeit heraus und macht sie zu Teilnehmern einer ewigen Liturgie. Justinian war nie in Ravenna, das Bild vertritt ihn als Stifter und Herrscher über Kirche und Reich zugleich. Kleine Details wie die Fibeln, Gesichter und Stoffmuster sind dennoch individuell gestaltet. Für die Kunstgeschichte markiert San Vitale den Beginn einer Bildsprache, die Ikonen und mittelalterliche Kunst für Jahrhunderte prägte."},{"k":"a014","b":0,"t":"Book of Kells","a":"Irische Mönche","j":"ca. 800","y":800,"e":2,"r":"Europa","o":["Iona, Schottland",56.331,-6.393],"x":"Das Book of Kells ist die prächtigste Handschrift der insularen Buchmalerei, die in Klöstern Irlands und Britanniens entstand. Es enthält die vier Evangelien auf 340 Pergamentblättern, ausgeschmückt mit Spiralen, Flechtbändern, Tieren und Menschen in unglaublicher Dichte. Die berühmte Chi-Rho-Seite verwandelt das Christusmonogramm in ein Ornament, in dem sich Katzen, Mäuse und Engel verstecken. Die Farben kamen teils von weit her, etwa Blau aus Lapislazuli oder Ersatzstoffen, was den Wert des Buches unterstreicht. Die Verschmelzung keltischer Ornamentik mit christlichem Inhalt macht es zu einem Schlüsselwerk der frühmittelalterlichen Kultur Europas. Es war weniger zum Lesen als zum Zeigen auf dem Altar gedacht, ein heiliges Objekt. Seine Ornamentkunst beeinflusst bis heute Design, Tattookunst und die irische Identität.","s":["Trinity College, Dublin",53.344,-6.255]},{"k":"a015","b":0,"t":"Bayeux-Teppich","a":"Anglonormannisch","j":"ca. 1070","y":1070,"e":2,"r":"Europa","o":["England (Canterbury vermutet)",51.28,1.079],"x":"Der rund 70 Meter lange Stoffstreifen erzählt die Eroberung Englands durch Wilhelm den Eroberer und die Schlacht von Hastings 1066. Eigentlich ist es kein Teppich, sondern eine Wollstickerei auf Leinen. In 58 Szenen folgen Schiffbau, Überfahrt, Festmahl, Schlacht und Tod König Harolds wie in einem Comic aufeinander. In den Randstreifen tauchen Fabeltiere, Alltagsszenen und sogar der Halleysche Komet auf. Der Teppich ist eine einzigartige Bildquelle für Waffen, Kleidung und Schiffe des Hochmittelalters. Er erzählt aus normannischer Sicht, lässt aber Raum für Mitgefühl mit den Besiegten, was Fragen nach Propaganda und Perspektive aufwirft. Als frühes Beispiel sequentieller Bilderzählung ist er für die Geschichte des Comics ebenso wichtig wie für die mittelalterliche Kunst.","s":["Bayeux, Frankreich",49.276,-0.702]},{"k":"a016","b":0,"t":"Dreikönigenschrein","a":"Nikolaus von Verdun und Werkstatt","j":"ca. 1200","y":1200,"e":2,"r":"Europa","o":["Köln",50.941,6.958],"x":"Der Dreikönigenschrein im Kölner Dom ist der größte und künstlerisch bedeutendste Reliquienschrein des Mittelalters. In Form einer dreischiffigen Basilika aus vergoldetem Silber und Kupfer bewahrt er die Gebeine der Heiligen Drei Könige, die 1164 von Mailand nach Köln kamen. Nikolaus von Verdun schuf Propheten und Apostel als Figuren mit lebendigen Gesichtern und bewegten Gewändern, die schon auf die Gotik vorausweisen. Über tausend Edelsteine, Perlen, Emails und antike Gemmen sind eingearbeitet. Mit den Reliquien wurde Köln zu einem der wichtigsten Wallfahrtsorte Europas, der Dom selbst wurde letztlich als gewaltiges Gehäuse für diesen Schrein gebaut. Die Drei Kronen im Kölner Stadtwappen erinnern daran. Der Schrein zeigt, wie Kunst, Glaube, Politik und Stadtgeschichte im Mittelalter untrennbar verbunden waren."},{"k":"a017","b":0,"t":"Scrovegni-Kapelle","a":"Giotto di Bondone","j":"1305","y":1305,"e":2,"r":"Europa","o":["Padua, Italien",45.412,11.879],"x":"Mit den Fresken der Scrovegni-Kapelle beginnt für viele die neuzeitliche Malerei. Giotto erzählt in rund 40 Szenen das Leben Marias und Christi unter einem tiefblauen Sternenhimmel. Anders als in der byzantinischen Tradition stehen seine Figuren mit Gewicht auf dem Boden, werfen Schatten und zeigen echte Gefühle. Berühmt ist der Judaskuss, in dem sich die Profile von Jesus und Judas ganz nah gegenüberstehen, und die Beweinung Christi, in der Engel verzweifelt am Himmel klagen. Giotto setzt Figuren auch mit dem Rücken zum Betrachter ein, was den Bildraum wie eine Bühne öffnet. Der Stifter Enrico Scrovegni wollte vermutlich die Sünde seines Vaters, eines Wucherers, sühnen. Dante und Vasari rühmten Giotto bereits als den Maler, der die Kunst erneuerte."},{"k":"a018","b":0,"t":"Genter Altar","a":"Hubert und Jan van Eyck","j":"1432","y":1432,"e":3,"r":"Europa","o":["Gent, Belgien",51.054,3.725],"x":"Der Genter Altar ist das Schlüsselwerk der altniederländischen Malerei und einer der Ursprünge der europäischen Ölmalerei. Auf zwölf Tafeln entfaltet sich eine Vision der Erlösung, im Zentrum die Anbetung des Lammes durch Heilige, Märtyrer, Richter und Pilger. Die Brüder van Eyck nutzten Öllasuren, um Licht, Edelsteine, Haare, Pflanzen und Stoffe mit nie dagewesener Genauigkeit zu malen. Adam und Eva gehören zu den ersten lebensgroßen Akten der nördlichen Malerei. Kein Kunstwerk wurde so oft geraubt, verkauft, zerlegt und wieder zusammengeführt, von Napoleon über den Ersten Weltkrieg bis zu den Nationalsozialisten. Eine Tafel, die Gerechten Richter, ist seit 1934 verschollen. Die jüngste Restaurierung legte das ursprüngliche, überraschend menschliche Gesicht des Lammes frei und löste weltweit Diskussionen aus."},{"k":"a019","b":0,"t":"Arnolfini-Hochzeit","a":"Jan van Eyck","j":"1434","y":1434,"e":3,"r":"Europa","o":["Brügge, Belgien",51.209,3.225],"x":"Das Doppelbildnis des Kaufmanns Giovanni Arnolfini und seiner Frau ist eines der rätselhaftesten Bilder der Kunstgeschichte. Van Eyck malt ein Zimmer voller kostbarer Dinge, Orangen, einen Kronleuchter, einen Hund, einen Teppich, alles in feinster Öltechnik. Im konvexen Spiegel an der Rückwand sieht man das Paar von hinten und zwei weitere Personen in der Tür. Darüber steht die Inschrift Johannes de eyck fuit hic, Jan van Eyck war hier, wie eine Zeugenaussage. Ob es sich um eine Eheschließung, ein Verlöbnis oder ein Gedenkbild handelt, ist bis heute umstritten. Das Bild ist ein frühes Beispiel für ein bürgerliches Porträt in einem realen Innenraum. Es spielt mit Blick, Spiegelung und Anwesenheit des Malers und wurde damit ein Vorläufer von Velázquez' Las Meninas.","s":["National Gallery, London",51.509,-0.128]},{"k":"a020","b":0,"t":"Geburt der Venus","a":"Sandro Botticelli","j":"ca. 1485","y":1485,"e":3,"r":"Europa","o":["Florenz, Italien",43.768,11.255],"x":"Botticellis Venus ist eine der ersten großformatigen Darstellungen eines nackten weiblichen Körpers seit der Antike und zugleich ein Bild aus der Mythologie, nicht aus der Bibel. Die Göttin wird vom Wind auf einer Muschel an Land getrieben, eine Hore reicht ihr einen Mantel. Botticelli arbeitet mit eleganter Linie, fast ohne Schatten, und verlängert Hals und Schulter, sodass die Figur schwerelos wirkt. Im Umfeld der Medici verband man die Liebesgöttin mit der neuplatonischen Idee, dass irdische Schönheit zur göttlichen führt. Das Bild ist auf Leinwand gemalt, was damals für ein so großes Werk ungewöhnlich war. Es wurde zu einem Symbol der Renaissance und der Stadt Florenz. Werbung, Mode und Popkultur zitieren die Pose bis heute, etwa Lady Gaga oder Andy Warhol."},{"k":"a021","b":0,"t":"Das letzte Abendmahl","a":"Leonardo da Vinci","j":"1495 bis 1498","y":1497,"e":3,"r":"Europa","o":["Mailand, Italien",45.466,9.171],"x":"Leonardo zeigt den Augenblick, in dem Jesus sagt, einer von euch wird mich verraten. Die zwölf Apostel reagieren in vier Dreiergruppen mit Erschrecken, Fragen und Abwehr, eine Bewegung läuft wie eine Welle durch das Bild. Die Zentralperspektive führt alle Linien zum Kopf Jesu, das Fenster hinter ihm wirkt wie ein Heiligenschein ohne Gold. Judas ist erstmals nicht abgesondert, sondern sitzt mitten unter den anderen, erkennbar an Schatten und Geldbeutel. Leonardo malte experimentell mit Tempera auf trockenen Putz statt als Fresko, sodass die Farbe schon zu seinen Lebzeiten abblätterte. Das Bild überstand Napoleons Soldaten und 1943 eine Bombe, die den Saal traf. Es ist eines der meistzitierten Bilder der Welt und ein Lehrstück für Komposition und Bilderzählung."},{"k":"a022","b":0,"t":"Pietà","a":"Michelangelo Buonarroti","j":"1499","y":1499,"e":3,"r":"Europa","o":["Rom",41.902,12.454],"x":"Michelangelo war erst etwa 24 Jahre alt, als er die Pietà für einen französischen Kardinal schuf. Maria hält den toten Christus auf dem Schoß, ihr Gesicht ist jung und gefasst, ihre Trauer still. Die pyramidale Komposition vereint zwei Körper in einem Block, wobei Maria größer gebaut ist, damit sie den erwachsenen Sohn tragen kann, ohne dass es auffällt. Der Marmor ist so fein poliert, dass Haut, Stoff und Adern beinahe weich wirken. Es ist das einzige Werk, das Michelangelo signierte, mit einem Band über Marias Brust, angeblich nachdem er hörte, wie Besucher es einem anderen zuschrieben. 1972 wurde die Figur von einem Mann mit einem Hammer beschädigt und restauriert, seitdem steht sie hinter Panzerglas. Sie gilt als Inbegriff der Hochrenaissance-Skulptur."},{"k":"a023","b":0,"t":"Selbstbildnis im Pelzrock","a":"Albrecht Dürer","j":"1500","y":1500,"e":3,"r":"Europa","o":["Nürnberg",49.452,11.077],"x":"Dürer malt sich mit 28 Jahren streng frontal, mit langem Haar und erhobener Hand, eine Haltung, die bis dahin Christusbildern vorbehalten war. Das Bild ist ein Manifest des neuen Künstlerselbstverständnisses in der Renaissance. Der Maler sieht sich nicht mehr als Handwerker, sondern als schöpferischen Geist, dessen Gabe von Gott kommt. Die Inschrift nennt Name, Alter und die Farben, mit denen er sich selbst in unvergänglichen Farben gemalt habe. Jedes Haar und jede Pelzfaser ist mit äußerster Präzision gemalt, die Hand zeigt auf den Pelz als Zeichen von Wohlstand und auf das Werkzeug des Malers. Die Jahreszahl 1500 markiert eine Zeitenwende, und Dürer stellt sich bewusst an diese Schwelle. Das Bild gilt als eines der ersten autonomen Selbstbildnisse der Kunstgeschichte.","s":["Alte Pinakothek, München",48.148,11.57]},{"k":"a024","b":0,"t":"Garten der Lüste","a":"Hieronymus Bosch","j":"ca. 1500","y":1500,"e":3,"r":"Europa","o":["'s-Hertogenbosch, Niederlande",51.698,5.304],"x":"Das Triptychon gehört zu den rätselhaftesten Werken der Kunstgeschichte. Links zeigt es das Paradies, in der Mitte einen Garten voller nackter Menschen, Riesenfrüchte, Vögel und seltsamer Bauten, rechts eine albtraumhafte Hölle mit Musikinstrumenten als Folterwerkzeugen. Bosch erfindet Mischwesen und Bilder, die keiner bekannten Tradition folgen. Ob das Mittelbild eine Warnung vor sinnlicher Lust oder eine unschuldige Utopie zeigt, ist bis heute umstritten. Die Detailfülle lädt zu endlosem Suchen ein, auf dem Hintern eines Höllenbewohners sind sogar Noten zu lesen, die inzwischen gesungen wurden. Geschlossen zeigen die Flügel die Erde am dritten Schöpfungstag in Grautönen. Die Surrealisten des 20. Jahrhunderts sahen in Bosch einen Vorläufer, sein Werk prägt bis heute Fantasy, Film und Popkultur.","s":["Prado, Madrid",40.414,-3.692]},{"k":"a025","b":0,"t":"Feldhase","a":"Albrecht Dürer","j":"1502","y":1502,"e":3,"r":"Europa","o":["Nürnberg",49.452,11.077],"x":"Dürers Feldhase ist eine der berühmtesten Naturstudien der Kunstgeschichte. Mit Aquarell und Deckfarben malt er das Tier so genau, dass man jedes Haar, die Spannung der Ohren und den Glanz im Auge wahrnimmt. Im Auge spiegelt sich ein Fensterkreuz, ein Zeichen, dass das Blatt im Atelier entstand. Der Hase ist nicht Symbol oder Beiwerk, sondern Hauptgegenstand, was um 1500 außergewöhnlich war. Dürer verbindet hier Kunst und Naturforschung, wie es auch Leonardo in Italien tat. Das Monogramm und die Jahreszahl zeigen, dass er das Blatt als vollwertiges Werk betrachtete. Durch unzählige Reproduktionen wurde der Hase zu einem der meistkopierten Motive überhaupt, vom Schulbuch bis zum Souvenir, und ist damit auch ein Beispiel für die Popularisierung von Kunst.","s":["Albertina, Wien",48.205,16.369]},{"k":"a026","b":0,"t":"Mona Lisa","a":"Leonardo da Vinci","j":"ca. 1503 bis 1519","y":1503,"e":3,"r":"Europa","o":["Florenz, Italien",43.769,11.256],"x":"Die Mona Lisa ist das berühmteste Gemälde der Welt und ein Meilenstein der Porträtmalerei. Leonardo zeigt die Florentinerin Lisa Gherardini in Dreiviertelansicht vor einer weiten, unwirklichen Landschaft, eine damals neue Bildform. Durch das Sfumato, ein rauchiges Verwischen der Umrisse, bleiben Mundwinkel und Augen unbestimmt, sodass ihr Ausdruck mit dem Blick des Betrachters zu wechseln scheint. Die Landschaft hat links und rechts unterschiedliche Horizonthöhen, was die Figur lebendig wirken lässt. Leonardo arbeitete jahrelang daran und gab das Bild nie aus der Hand. Weltberühmt wurde es aber erst durch den Diebstahl von 1911 und die anschließende Medienkampagne. Seitdem wurde es parodiert, von Duchamp mit Schnurrbart versehen und von Warhol vervielfältigt, es ist ein Musterbeispiel dafür, wie ein Kunstwerk zur Ikone wird.","s":["Louvre, Paris",48.861,2.338]},{"k":"a027","b":0,"t":"David","a":"Michelangelo Buonarroti","j":"1504","y":1504,"e":3,"r":"Europa","o":["Florenz, Italien",43.768,11.259],"x":"Der über fünf Meter hohe Marmor-David ist das Sinnbild der Renaissance und der Republik Florenz. Michelangelo schlug ihn aus einem Block, den andere Bildhauer verworfen hatten. Anders als frühere Darstellungen zeigt er David nicht als Sieger mit dem Kopf Goliaths, sondern im angespannten Moment vor dem Kampf. Der Blick ist konzentriert, die Stirn gerunzelt, die rechte Hand mit hervortretenden Adern hält den Stein. Der Körper folgt dem antiken Kontrapost, wirkt aber kraftvoller und lebendiger als jedes antike Vorbild. Kopf und Hände sind bewusst vergrößert, weil die Figur ursprünglich hoch am Dom stehen sollte. Als politisches Symbol des kleinen Florenz gegen übermächtige Gegner wurde David vor dem Rathaus aufgestellt. Er gilt bis heute als Inbegriff des idealen männlichen Körpers."},{"k":"a028","b":0,"t":"Die Schule von Athen","a":"Raffael","j":"1511","y":1511,"e":3,"r":"Europa","o":["Rom (Vatikan)",41.906,12.456],"x":"Raffaels Fresko in den Stanzen des Vatikans versammelt die großen Denker der Antike in einer gewaltigen, von Bramante inspirierten Architektur. In der Mitte schreiten Platon, der zum Himmel zeigt, und Aristoteles, der die Hand über die Erde hält, zwei Wege der Philosophie in einer Geste. Um sie herum diskutieren, schreiben und rechnen Sokrates, Pythagoras, Euklid, Diogenes und viele andere. Raffael gab manchen Philosophen die Gesichter seiner Zeitgenossen, Platon trägt wohl die Züge Leonardos, Heraklit die Michelangelos, und am rechten Rand blickt Raffael selbst aus dem Bild. Die perfekte Zentralperspektive, die Harmonie der Gruppen und die Ruhe der Komposition machen das Werk zum Musterbild der Hochrenaissance. Es feiert die Vereinbarkeit von antiker Weisheit und christlichem Glauben. Bis heute ist es ein Lehrbeispiel für Perspektive und Komposition."},{"k":"a029","b":0,"t":"Sixtinische Decke","a":"Michelangelo Buonarroti","j":"1508 bis 1512","y":1512,"e":3,"r":"Europa","o":["Rom (Vatikan)",41.903,12.455],"x":"Auf über 500 Quadratmetern malte Michelangelo, der sich selbst eigentlich als Bildhauer sah, die Decke der Sixtinischen Kapelle fast allein in vier Jahren. Neun Szenen aus der Genesis reichen von der Trennung von Licht und Finsternis bis zur Trunkenheit Noahs, umgeben von Propheten, Sibyllen und kraftvollen Aktfiguren. Die Erschaffung Adams, in der sich die Finger Gottes und Adams beinahe berühren, wurde zu einem der bekanntesten Bilder der Menschheit. Michelangelo malte die Figuren wie Skulpturen, plastisch, muskulös und in kühnen Verkürzungen. Die Arbeit über Kopf auf dem Gerüst war körperlich zermürbend, wie er selbst in einem Spottgedicht beschrieb. Die Restaurierung 1980 bis 1994 brachte überraschend leuchtende Farben zum Vorschein und löste heftige Debatten aus. Die Kapelle ist bis heute der Ort, an dem Päpste gewählt werden."},{"k":"a030","b":0,"t":"Sixtinische Madonna","a":"Raffael","j":"1512","y":1512,"e":3,"r":"Europa","o":["Piacenza, Italien",45.052,9.693],"x":"Maria schreitet mit dem Kind auf Wolken zwischen geöffneten Vorhängen hervor, als würde sie auf einer Bühne erscheinen. Links kniet der heilige Papst Sixtus, rechts die heilige Barbara, unten lehnen zwei nachdenkliche Engel an einer Brüstung. Raffael verbindet himmlische Erscheinung und menschliche Nähe, Mutter und Kind blicken ernst, fast besorgt in die Zukunft. Der Hintergrund besteht bei genauem Hinsehen aus unzähligen Engelsköpfen in den Wolken. Für die deutsche Romantik und das Bildungsbürgertum wurde das Bild zum Inbegriff von Kunst überhaupt, Goethe, Schopenhauer und Dostojewski verehrten es. Seine Verschleppung nach Moskau 1945 und die Rückgabe 1955 machten es auch zu einem Symbol deutscher Nachkriegsgeschichte. Die beiden Engel sind heute weltweit eines der meist reproduzierten Kunstmotive.","s":["Gemäldegalerie Alte Meister, Dresden",51.053,13.734]},{"k":"a031","b":0,"t":"Isenheimer Altar","a":"Matthias Grünewald","j":"ca. 1512 bis 1516","y":1515,"e":3,"r":"Europa","o":["Isenheim, Elsass",47.903,7.303],"x":"Der Isenheimer Altar ist das erschütterndste Kreuzigungsbild der deutschen Kunst. Grünewald malte ihn für das Spital der Antoniter, die Menschen mit dem Antoniusfeuer pflegten, einer Vergiftung durch Mutterkorn mit schrecklichen Hautschäden. Christus hängt mit verkrampften Händen am Kreuz, sein Körper ist von Wunden übersät, sodass die Kranken sich in ihm wiederfinden konnten. Der Altar ist eine Wandelbühne, je nach Kirchenjahr öffnen sich die Flügel und zeigen Verkündigung, Engelskonzert, eine strahlend leuchtende Auferstehung und Szenen aus dem Leben des Antonius. Kaum ein Werk verbindet so radikal Schmerz und Hoffnung. Im 20. Jahrhundert wurde Grünewald von Expressionisten neu entdeckt, Paul Hindemith schrieb die Oper Mathis der Maler. Der Altar zeigt, wie Kunst für ganz konkrete Menschen in Not geschaffen werden kann.","s":["Musée Unterlinden, Colmar",48.079,7.359]},{"k":"a032","b":0,"t":"Die Gesandten","a":"Hans Holbein der Jüngere","j":"1533","y":1533,"e":3,"r":"Europa","o":["London",51.509,-0.128],"x":"Zwei französische Gesandte am Hof Heinrichs VIII. stehen lebensgroß neben einem Regal voller Globen, Messinstrumente, Bücher und einer Laute. Die Gegenstände stehen für die Wissenschaften und Künste ihrer Zeit, doch eine gerissene Lautensaite und ein Gesangbuch verweisen auf die Spaltung der Kirche. Im Vordergrund schwebt eine merkwürdig verzerrte Form, die sich erst von schräg seitlich betrachtet als Totenschädel zu erkennen gibt. Diese Anamorphose ist das berühmteste Beispiel optischer Täuschung in der Malerei und ein Memento mori, das allen Reichtum relativiert. Halb verdeckt hängt oben links ein kleines Kruzifix hinter dem Vorhang. Holbein malt Stoffe, Teppich und Instrumente mit einer Präzision, die bis heute staunen lässt. Das Bild ist ein Lehrstück über Bildsymbolik, Perspektive und die Frage, wie man ein Gemälde anschaut."},{"k":"a033","b":0,"t":"Venus von Urbino","a":"Tizian","j":"1538","y":1538,"e":3,"r":"Europa","o":["Venedig, Italien",45.441,12.316],"x":"Tizian zeigt eine nackte junge Frau, die auf einem Bett liegt und den Betrachter direkt ansieht. Anders als Giorgiones schlafende Venus ist sie wach, selbstbewusst und in einem zeitgenössischen Schlafzimmer, im Hintergrund suchen Dienerinnen Kleider aus einer Truhe. Der kleine Hund am Fußende gilt als Zeichen der Treue, die Rosen in ihrer Hand als Zeichen der Liebe. Das Bild war vermutlich ein Hochzeitsbild für den Herzog von Urbino und spielt zwischen Göttin und irdischer Frau. Tizians warme Farben und die weiche Malweise der venezianischen Schule machten Haut und Stoffe sinnlich greifbar. Das Motiv des liegenden Akts mit direktem Blick wurde zum Vorbild für Jahrhunderte, Manet zitierte es 1863 provokant in seiner Olympia. Mark Twain nannte es das unanständigste Bild der Welt, was zeigt, wie stark es Blickgewohnheiten herausforderte.","s":["Uffizien, Florenz",43.768,11.255]},{"k":"a034","b":0,"t":"Jäger im Schnee","a":"Pieter Bruegel der Ältere","j":"1565","y":1565,"e":3,"r":"Europa","o":["Brüssel, Belgien",50.85,4.352],"x":"Drei müde Jäger stapfen mit ihren Hunden durch den Schnee nach Hause, unter ihnen breitet sich ein Tal mit zugefrorenen Teichen aus, auf denen Menschen Schlittschuh laufen. Das Bild gehört zu einem Zyklus über die Jahreszeiten und ist eine der ersten Landschaften, in der der Winter selbst das Thema ist. Bruegel führt den Blick diagonal von den dunklen Bäumen vorn in die weite, kalte Ferne. Graugrüner Himmel, schwarze Krähen und kleine Alltagsszenen erzeugen eine Stimmung, die man fast körperlich spürt. Statt Heiligen oder Herrschern zeigt Bruegel einfache Menschen, ein Grundstein für die Genremalerei. Das Bild entstand während der sogenannten Kleinen Eiszeit und gilt auch als Klimadokument. Filmemacher wie Andrei Tarkowski und Lars von Trier haben es zitiert.","s":["Kunsthistorisches Museum, Wien",48.204,16.361]},{"k":"a035","b":0,"t":"Tod Mariens","a":"Caravaggio","j":"ca. 1606","y":1606,"e":3,"r":"Europa","o":["Rom",41.903,12.496],"x":"Caravaggio malt den Tod der Muttergottes ohne himmlische Verklärung. Maria liegt mit geschwollenem Bauch und nackten Füßen auf einem einfachen Lager, die Apostel trauern als gewöhnliche Männer, Maria Magdalena weint vorn zusammengesunken. Ein großer roter Vorhang hängt wie auf einer Theaterbühne über der Szene. Das harte Licht, das aus der Dunkelheit Gesichter und Hände hervorhebt, ist typisch für Caravaggios Hell-Dunkel-Malerei. Die Mönche, die das Bild bestellt hatten, lehnten es als unwürdig ab, angeblich weil eine Ertrunkene oder eine Prostituierte Modell gestanden habe. Gerade diese radikale Wirklichkeitsnähe machte Caravaggio zu einem der einflussreichsten Maler des Barock. Rubens, Rembrandt und Velázquez lernten von ihm, wie man Heiliges menschlich zeigt.","s":["Louvre, Paris",48.861,2.338]},{"k":"a036","b":0,"t":"Kreuzaufrichtung","a":"Peter Paul Rubens","j":"1610 bis 1611","y":1610,"e":3,"r":"Europa","o":["Antwerpen, Belgien",51.22,4.402],"x":"Mit diesem Triptychon brachte Rubens nach seiner Rückkehr aus Italien den Barock nach Flandern. Neun muskulöse Männer stemmen das Kreuz mit dem gekreuzigten Christus in einer gewaltigen Diagonale empor. Die Körper spannen sich, die Bewegung scheint im nächsten Moment fortzufahren, der Betrachter erlebt den Augenblick wie ein Zeuge. Rubens verbindet die Kraft Michelangelos mit dem Licht Caravaggios und der Farbigkeit Venedigs. Die Seitenflügel zeigen trauernde Frauen und römische Soldaten und erweitern die Szene über das ganze Altarbild. Das Werk wurde in der Zeit der Gegenreformation gemalt, um Gläubige emotional zu ergreifen. Es begründete Rubens' Ruhm als führender Maler Nordeuropas und beeindruckte noch Jahrhunderte später, in der Erzählung Ein Hund von Flandern ist es das Sehnsuchtsbild des Jungen Nello."},{"k":"a037","b":0,"t":"Die Nachtwache","a":"Rembrandt van Rijn","j":"1642","y":1642,"e":3,"r":"Europa","o":["Amsterdam",52.36,4.885],"x":"Die Nachtwache ist Rembrandts berühmtestes Werk und das Nationalbild der Niederlande. Eigentlich zeigt sie die Bürgerwehr des Hauptmanns Frans Banninck Cocq am helllichten Tag, erst dunkel gewordener Firnis gab ihr den Namen. Statt die Mitglieder ordentlich aufzureihen, wie bei Gruppenporträts üblich, inszeniert Rembrandt den Moment des Aufbruchs mit Trommeln, Lanzen und einem bellenden Hund. Ein leuchtendes Mädchen mit einem Huhn am Gürtel trägt das Emblem der Kompanie. Licht und Schatten strukturieren das Durcheinander und lenken den Blick auf den Hauptmann und seinen Leutnant. Das Bild wurde 1715 beschnitten und mehrfach angegriffen. Seit 2019 wird es im Rijksmuseum vor Publikum mit modernster Technik untersucht und restauriert, ein Projekt, das Kunst und Wissenschaft verbindet."},{"k":"a038","b":0,"t":"Verzückung der heiligen Teresa","a":"Gian Lorenzo Bernini","j":"1647 bis 1652","y":1652,"e":3,"r":"Europa","o":["Rom",41.905,12.494],"x":"Bernini zeigt die spanische Mystikerin Teresa von Ávila im Moment einer göttlichen Vision, ein lächelnder Engel richtet einen goldenen Pfeil auf ihr Herz. Teresa sinkt mit geschlossenen Augen und geöffnetem Mund zurück, ihr Gewand scheint in Wellen zu zerfließen. Die Szene ist in eine Kapelle eingebaut, die wie ein Theater funktioniert, verborgene Fenster lassen Licht über goldene Strahlen fallen. Seitlich sitzen Mitglieder der Stifterfamilie Cornaro in Logen und schauen dem Geschehen zu. Bernini verbindet Architektur, Skulptur, Malerei und Licht zu einem Gesamtkunstwerk, dem Kernideal des Barock. Die körperliche Ekstase der Heiligen wurde seit jeher kontrovers gedeutet, zwischen religiöser Erfahrung und Sinnlichkeit. Das Werk gilt als Höhepunkt barocker Skulptur und als Paradebeispiel der Gegenreformation."},{"k":"a039","b":0,"t":"Las Meninas","a":"Diego Velázquez","j":"1656","y":1656,"e":3,"r":"Europa","o":["Madrid, Spanien",40.414,-3.692],"x":"Las Meninas gilt vielen als das bedeutendste Gemälde überhaupt, weil es das Sehen selbst zum Thema macht. Im Mittelpunkt steht die kleine Infantin Margarita mit ihren Hofdamen, einem Hund und zwei Zwergen. Links malt Velázquez sich selbst vor einer riesigen Leinwand, im Spiegel im Hintergrund erscheinen der König und die Königin. Damit stehen die Majestäten genau dort, wo wir als Betrachter stehen, und die Frage, wer hier wen anschaut, bleibt offen. In der Tür im Hintergrund hält ein Mann inne, als wolle er gleich gehen oder kommen. Michel Foucault widmete dem Bild ein berühmtes Kapitel über Repräsentation, Picasso malte 58 Variationen. Velázquez' lockere, aus der Nähe fast abstrakte Pinselführung nahm den Impressionismus vorweg. Das rote Kreuz auf seiner Brust wurde nachträglich hinzugefügt, als er in einen Ritterorden aufgenommen wurde."},{"k":"a040","b":0,"t":"Das Mädchen mit dem Perlenohrring","a":"Johannes Vermeer","j":"ca. 1665","y":1665,"e":3,"r":"Europa","o":["Delft, Niederlande",52.012,4.357],"x":"Ein Mädchen dreht sich über die Schulter zum Betrachter, den Mund leicht geöffnet, als wolle es etwas sagen. Es ist kein Porträt einer bestimmten Person, sondern ein sogenanntes Tronie, eine Charakterstudie mit fantasievollem Turban. Vor dunklem Grund leuchten Ultramarinblau, Gelb und das Weiß der großen Perle, die nur aus zwei Pinselstrichen besteht. Vermeer arbeitete mit feinsten Lichtreflexen auf Lippen, Auge und Perle, die das Gesicht lebendig machen. Untersuchungen 2018 zeigten, dass der Hintergrund ursprünglich ein grüner Vorhang war und dass winzige Wimpern gemalt sind. Vermeer war nach seinem Tod fast vergessen und wurde erst im 19. Jahrhundert wiederentdeckt. Roman und Film haben das Mädchen zur Mona Lisa des Nordens gemacht.","s":["Mauritshuis, Den Haag",52.081,4.314]},{"k":"a041","b":0,"t":"Die Schaukel","a":"Jean-Honoré Fragonard","j":"ca. 1767","y":1767,"e":3,"r":"Europa","o":["Paris",48.857,2.352],"x":"Eine junge Frau in einem rosa Seidenkleid fliegt auf einer Schaukel durch einen üppigen Park, ihr Schuh segelt durch die Luft. Unten im Gebüsch liegt ihr Liebhaber und blickt ihr unter den Rock, hinten zieht ein ahnungsloser älterer Mann die Schaukel. Eine Amorstatue legt den Finger auf die Lippen und mahnt zur Verschwiegenheit. Das Bild ist das Paradebeispiel des Rokoko, verspielt, erotisch, pastellfarben und voller Andeutungen. Es wurde von einem Adligen bestellt, der sich selbst als Liebhaber im Bild wünschte. Wenige Jahrzehnte später galt diese Kunst als Inbegriff aristokratischer Dekadenz, die Französische Revolution machte ihr ein Ende. Gerade deshalb ist das Bild ein Schlüssel zum Verständnis einer Epoche und ihres Untergangs.","s":["Wallace Collection, London",51.517,-0.154]},{"k":"a042","b":0,"t":"Der Tod des Marat","a":"Jacques-Louis David","j":"1793","y":1793,"e":3,"r":"Europa","o":["Paris",48.857,2.352],"x":"Der Revolutionär Jean-Paul Marat liegt ermordet in seiner Badewanne, in der Hand noch den Brief der Mörderin Charlotte Corday. David war Marats Freund und selbst Revolutionär, er malte das Bild wenige Monate nach der Tat. Die Komposition ist schlicht und streng, die obere Hälfte des Bildes bleibt leer, das Licht fällt sanft auf den Körper. Der herabhängende Arm erinnert an Darstellungen des toten Christus, Marat wird zum Märtyrer der Revolution stilisiert. Damit ist das Bild ein Meisterwerk des Klassizismus und zugleich ein frühes Beispiel politischer Propaganda in der Kunst. Die Wunde ist klein, das Blut kaum sichtbar, der Tod wirkt würdevoll statt grausam. Das Bild wirft bis heute die Frage auf, wie Kunst politische Ereignisse deutet und Helden erschafft.","s":["Königliche Museen der Schönen Künste, Brüssel",50.842,4.358]},{"k":"a043","b":0,"t":"Der 3. Mai 1808","a":"Francisco de Goya","j":"1814","y":1814,"e":4,"r":"Europa","o":["Madrid, Spanien",40.414,-3.692],"x":"Goya zeigt die Erschießung spanischer Zivilisten durch französische Soldaten nach dem Aufstand gegen Napoleons Besatzung. Im Zentrum breitet ein Mann im weißen Hemd die Arme aus, beleuchtet von einer großen Laterne, wie ein Gekreuzigter. Die Soldaten stehen in einer gesichtslosen Reihe mit angelegten Gewehren, eine Tötungsmaschine. Vor ihnen liegen bereits Tote in Blutlachen, hinter ihnen warten die nächsten Opfer. Anders als frühere Schlachtenbilder verherrlicht das Bild nichts, es zeigt Krieg aus der Perspektive der Opfer. Damit gilt es als eines der ersten modernen Antikriegsbilder. Manet, Picasso mit Guernica und viele andere haben sich darauf bezogen. Goya selbst schuf in den Desastres de la Guerra eine ganze Folge erschütternder Radierungen über die Gräuel des Krieges."},{"k":"a044","b":0,"t":"Der Wanderer über dem Nebelmeer","a":"Caspar David Friedrich","j":"ca. 1818","y":1818,"e":4,"r":"Europa","o":["Dresden",51.05,13.737],"x":"Ein Mann in dunklem Gehrock steht auf einem Felsgipfel und blickt über ein Meer aus Nebel, aus dem Bergspitzen ragen. Wir sehen ihn nur von hinten und schauen mit ihm in die Weite, eine Rückenfigur, die zum Markenzeichen Friedrichs wurde. Das Bild ist zum Sinnbild der deutschen Romantik geworden, mit ihrem Gefühl für das Erhabene, die Einsamkeit und die Sehnsucht nach dem Unendlichen. Die Landschaft ist aus Skizzen verschiedener Orte im Elbsandsteingebirge zusammengesetzt, also komponiert, nicht abgemalt. Ob der Wanderer Triumph, Andacht oder Verlorenheit empfindet, bleibt offen. Das Motiv wurde unzählige Male zitiert, auf Buchcovern, in Werbung und in Memes. Zum 250. Geburtstag Friedrichs 2024 stand das Bild im Mittelpunkt großer Ausstellungen in Hamburg, Berlin und Dresden.","s":["Hamburger Kunsthalle",53.558,9.999]},{"k":"a045","b":0,"t":"Das Floß der Medusa","a":"Théodore Géricault","j":"1819","y":1819,"e":4,"r":"Europa","o":["Paris",48.857,2.352],"x":"Géricault malte ein aktuelles Skandalereignis in riesigem Format, das sonst Historien und Heiligen vorbehalten war. 1816 lief die französische Fregatte Méduse vor Westafrika auf Grund, der unfähige Kapitän ließ 150 Menschen auf einem Floß zurück, nur 15 überlebten nach Tagen voller Hunger, Mord und Kannibalismus. Das Bild zeigt den Moment, als die Überlebenden am Horizont ein Schiff entdecken. Die Körper bilden eine pyramidale Komposition von den Toten unten bis zu einem schwarzen Mann, der oben verzweifelt ein Tuch schwenkt. Géricault studierte Leichen und befragte Überlebende, um die Szene glaubwürdig zu machen. Das Bild war eine Anklage gegen die Regierung und ein Gründungswerk der Romantik. Dass ein Schwarzer die Hoffnung verkörpert, wird auch als Stellungnahme gegen die Sklaverei gelesen.","s":["Louvre, Paris",48.861,2.338]},{"k":"a046","b":0,"t":"Die Freiheit führt das Volk","a":"Eugène Delacroix","j":"1830","y":1830,"e":4,"r":"Europa","o":["Paris",48.857,2.352],"x":"Delacroix malte das Bild zur Julirevolution von 1830, in der die Pariser den König stürzten. Eine Frau mit nackter Brust, phrygischer Mütze und Trikolore führt Bürger, Arbeiter und einen Jungen mit Pistolen über eine Barrikade aus Leichen. Sie ist zugleich Allegorie und Mensch aus dem Volk, schmutzig, entschlossen und kraftvoll. Im Hintergrund sind die Türme von Notre-Dame zu erkennen. Der Mann mit Zylinder wird oft als Selbstporträt des Malers gedeutet. Das Bild wurde zur Ikone der Freiheit und der Französischen Republik, die Figur der Marianne trägt bis heute diese Züge. Es inspirierte vermutlich auch die Freiheitsstatue in New York und erscheint auf Briefmarken, Banknoten und Plattencovern, etwa bei Coldplay.","s":["Louvre, Paris",48.861,2.338]},{"k":"a047","b":0,"t":"The Fighting Temeraire","a":"J. M. W. Turner","j":"1839","y":1839,"e":4,"r":"Europa","o":["London",51.509,-0.128],"x":"Ein kleiner schwarzer Dampfschlepper zieht das blasse, geisterhafte Segelkriegsschiff Temeraire zum Abwracken die Themse hinauf. Das Schiff hatte 1805 in der Schlacht von Trafalgar ruhmreich gekämpft, nun ist seine Zeit vorbei. Dahinter versinkt die Sonne in einem Feuer aus Gelb, Orange und Rot. Turner macht aus einem Alltagsereignis ein Gleichnis vom Ende einer Epoche und dem Beginn der industriellen Moderne. Seine freie, fast auflösende Behandlung von Licht und Farbe wies den Impressionisten und der abstrakten Malerei den Weg. Das Bild war Turners Lieblingswerk, er nannte es sein Darling und verkaufte es nie. 2005 wählten die Briten es zu ihrem Lieblingsgemälde, seit 2020 ist es auf der 20-Pfund-Note abgebildet."},{"k":"a048","b":0,"t":"Die Ährenleserinnen","a":"Jean-François Millet","j":"1857","y":1857,"e":4,"r":"Europa","o":["Barbizon, Frankreich",48.445,2.602],"x":"Drei Bäuerinnen bücken sich auf einem abgeernteten Feld, um die liegengebliebenen Ähren aufzulesen, das Recht der Ärmsten. Im Hintergrund türmen sich die reichen Garben, ein Gutsverwalter überwacht die Arbeit zu Pferd. Millet gibt den Frauen monumentale Würde, ihre Körper sind schwer und fest wie antike Skulpturen. Zugleich zeigt er die soziale Kluft zwischen Besitzenden und Besitzlosen. Das Pariser Bürgertum empfand das Bild als bedrohlich und warf Millet sozialistische Agitation vor. Es gehört zum Realismus, der einfache Menschen und harte Arbeit bildwürdig machte. Van Gogh verehrte Millet und kopierte seine Motive viele Male, und das Bild beeinflusste Generationen von Künstlern, die soziale Wirklichkeit zeigen wollten.","s":["Musée d'Orsay, Paris",48.86,2.327]},{"k":"a049","b":0,"t":"Olympia","a":"Édouard Manet","j":"1863","y":1863,"e":4,"r":"Europa","o":["Paris",48.857,2.352],"x":"Manet griff die Pose von Tizians Venus von Urbino auf, machte aber aus der Göttin eine Pariser Prostituierte, die den Betrachter kühl und selbstbewusst ansieht. Statt eines treuen Hundes steht eine schwarze Katze mit aufgestelltem Schwanz am Bettende, eine Dienerin bringt Blumen eines Freiers. Die harte Beleuchtung, die flachen Farbflächen und der fehlende weiche Übergang provozierten zusätzlich. Bei der Ausstellung im Salon 1865 musste das Bild vor wütenden Besuchern geschützt werden. Olympia gilt als Gründungswerk der Moderne, weil sie die Tradition zitiert und zugleich bricht. Heute wird auch die Figur der schwarzen Dienerin, gemalt nach dem Modell Laure, in Ausstellungen neu befragt. Das Bild ist ein Schlüssel zur Diskussion über Blick, Geschlecht und Macht in der Kunst.","s":["Musée d'Orsay, Paris",48.86,2.327]},{"k":"a050","b":0,"t":"Impression, Sonnenaufgang","a":"Claude Monet","j":"1872","y":1872,"e":4,"r":"Europa","o":["Le Havre, Frankreich",49.494,0.108],"x":"Mit wenigen schnellen Pinselstrichen malt Monet den Hafen von Le Havre im Morgendunst, eine orangefarbene Sonne spiegelt sich im blaugrauen Wasser. Boote und Kräne sind nur angedeutet, es geht um den Eindruck eines Augenblicks, nicht um Details. Ein Kritiker spottete 1874 über die Ausstellung, hier gebe es nur Impressionen, und gab so einer ganzen Bewegung ihren Namen. Der Impressionismus malte im Freien, mit reinen Farben und sichtbaren Strichen, und brach mit den Regeln der Akademie. Interessant ist, dass die Sonne in Graustufen fast die gleiche Helligkeit wie der Himmel hat, sie leuchtet nur durch den Farbkontrast. Eine Analyse von Wetter und Sonnenstand datierte das Bild auf den 13. November 1872 morgens. Es ist das Gründungsbild der modernen Malerei des Lichts.","s":["Musée Marmottan, Paris",48.859,2.267]},{"k":"a051","b":0,"t":"Die Tanzklasse","a":"Edgar Degas","j":"1874","y":1874,"e":4,"r":"Europa","o":["Paris",48.871,2.332],"x":"Degas zeigt junge Balletttänzerinnen der Pariser Oper in einem Probensaal, während ihr Lehrer Jules Perrot mit einem Stock den Takt angibt. Statt einer glanzvollen Aufführung interessiert ihn der Alltag hinter den Kulissen, Müdigkeit, Warten, Kratzen am Rücken, Zurechtzupfen der Kleider. Der Bildausschnitt wirkt zufällig wie bei einem Schnappschuss, Figuren werden angeschnitten, der Boden zieht sich diagonal in die Tiefe. Diese Bildsprache lernte Degas von japanischen Holzschnitten und der neuen Fotografie. Er schuf über 1500 Werke zum Thema Tanz und wurde zum Maler der Ballerinen. Die Mädchen stammten oft aus armen Familien und waren abhängig von reichen Gönnern, ein Hintergrund, der die Bilder heute vielschichtiger macht. Das Werk zeigt, wie der Impressionismus den modernen Großstadtalltag zum Thema machte.","s":["Musée d'Orsay, Paris",48.86,2.327]},{"k":"a052","b":0,"t":"Bal du moulin de la Galette","a":"Pierre-Auguste Renoir","j":"1876","y":1876,"e":4,"r":"Europa","o":["Paris (Montmartre)",48.887,2.336],"x":"Renoir malt ein sonntägliches Tanzfest in einem Gartenlokal auf dem Montmartre, wo Arbeiter, Künstler und Näherinnen unter Bäumen feiern. Sonnenlicht fällt in Flecken durch das Laub und tanzt auf Gesichtern, Hüten und Kleidern. Das Bild fängt die Lebensfreude und das Gemeinschaftsgefühl des modernen Paris ein. Renoir malte große Teile vor Ort und ließ Freunde als Modelle posieren. Die Komposition wirkt locker und lebendig, doch ist sie sorgfältig zwischen Vorder- und Hintergrund ausbalanciert. Es ist eines der Hauptwerke des Impressionismus und zeigt seine Begeisterung für Freizeit, Licht und Augenblick. Eine kleinere Fassung wurde 1990 für einen damaligen Rekordpreis versteigert, was auch den späteren Marktwert impressionistischer Kunst zeigt.","s":["Musée d'Orsay, Paris",48.86,2.327]},{"k":"a053","b":0,"t":"Sonntagnachmittag auf der Insel La Grande Jatte","a":"Georges Seurat","j":"1884 bis 1886","y":1886,"e":4,"r":"Europa","o":["Paris",48.893,2.268],"x":"Auf einer Seine-Insel bei Paris verbringen Bürger, Soldaten, Kinder und Hunde einen Sonntagnachmittag. Seurat baute das drei Meter breite Bild aus Tausenden kleinen Farbpunkten auf, die sich erst im Auge des Betrachters zu Farben mischen. Er stützte sich dabei auf wissenschaftliche Farbtheorien und begründete so den Pointillismus oder Neoimpressionismus. Im Gegensatz zum spontanen Impressionismus ist das Bild streng geplant, die Figuren wirken steif wie Puppen. Manche lesen darin eine kühle Kritik an der modernen Gesellschaft, in der Menschen nebeneinander statt miteinander leben. Die Frau mit dem Affen an der Leine galt damals als Anspielung auf eine Prostituierte. Das Bild ist ein Brückenwerk zur modernen, konstruierten Malerei und inspirierte das Musical Sunday in the Park with George.","s":["Art Institute of Chicago",41.88,-87.624]},{"k":"a054","b":0,"t":"Sonnenblumen","a":"Vincent van Gogh","j":"1888","y":1888,"e":4,"r":"Europa","o":["Arles, Frankreich",43.677,4.628],"x":"Van Gogh malte die Sonnenblumen in Arles, um das Gästezimmer für seinen Freund Paul Gauguin zu schmücken. Vierzehn Blüten in allen Stadien, von frisch bis welk, stehen in einer Vase vor gelbem Grund. Das Bild ist fast ganz in Gelbtönen gemalt, was dank neuer, kräftiger Pigmente möglich war, die allerdings mit der Zeit nachdunkeln. Der dicke Farbauftrag gibt den Blüten eine plastische, fast körperliche Präsenz. Für van Gogh stand Gelb für Dankbarkeit, Freundschaft und das Licht des Südens. Er malte mehrere Fassungen, eine wurde 1987 für einen damaligen Rekordpreis versteigert. Die Sonnenblumen wurden zum Markenzeichen des Künstlers und zu einem der beliebtesten Bilder der Welt, sie stehen für die Frage, wie man Leben und Vergänglichkeit in einem Stillleben zeigen kann.","s":["National Gallery, London",51.509,-0.128]},{"k":"a055","b":0,"t":"Sternennacht","a":"Vincent van Gogh","j":"1889","y":1889,"e":4,"r":"Europa","o":["Saint-Rémy-de-Provence, Frankreich",43.789,4.832],"x":"Van Gogh malte die Sternennacht während seines Aufenthalts in der Nervenheilanstalt von Saint-Rémy, nach dem Blick aus seinem Fenster und aus der Erinnerung. Über einem stillen Dorf wirbeln Himmel, Sterne und Mond in gewaltigen Spiralen, eine dunkle Zypresse lodert wie eine Flamme empor. Der Kirchturm erinnert eher an seine niederländische Heimat als an die Provence. Die pastose, rhythmische Pinselführung macht innere Erregung sichtbar und wurde zum Vorbild des Expressionismus. Van Gogh selbst war mit dem Bild nicht zufrieden. Heute gehört es zu den bekanntesten Bildern der Welt, Physiker haben in den Wirbeln sogar Muster echter Turbulenz entdeckt. Es steht für die Verbindung von Kunst, seelischer Krise und einer neuen, subjektiven Sicht auf die Natur.","s":["MoMA, New York",40.761,-73.978]},{"k":"a056","b":0,"t":"Der Schrei","a":"Edvard Munch","j":"1893","y":1893,"e":4,"r":"Europa","o":["Oslo (Kristiania), Norwegen",59.912,10.723],"x":"Eine geisterhafte Figur hält sich auf einer Brücke die Ohren zu, über ihr brennt der Himmel in Rot und Orange, der Fjord wirbelt in blauen Linien. Munch schrieb, er habe bei einem Spaziergang einen unendlichen Schrei durch die Natur gehen hören. Die Figur ist auf eine Schädelform reduziert, Landschaft und Mensch scheinen in einer gemeinsamen Schwingung der Angst verbunden. Das Bild ist ein Schlüsselwerk des Symbolismus und Wegbereiter des Expressionismus, der innere Zustände statt äußerer Wirklichkeit zeigt. Es existieren mehrere Fassungen in Malerei, Pastell und Druck, eine Pastellfassung wurde 2012 für einen Rekordpreis versteigert. Zwei Fassungen wurden gestohlen und wiedergefunden. Der Schrei wurde zum Symbol moderner Existenzangst und ist bis hin zum Emoji eines der meistzitierten Kunstwerke überhaupt."},{"k":"a057","b":0,"t":"Die Kartenspieler","a":"Paul Cézanne","j":"ca. 1894","y":1894,"e":4,"r":"Europa","o":["Aix-en-Provence, Frankreich",43.53,5.447],"x":"Zwei Bauern aus der Gegend von Aix sitzen sich am Tisch gegenüber, konzentriert in ihr Kartenspiel versunken. Cézanne malte das Motiv in mehreren Fassungen, die Version im Musée d'Orsay ist die strengste und ruhigste. Die Figuren wirken wie aus festen geometrischen Formen gebaut, Zylinder, Kegel und Flächen, eine Flasche bildet die Mittelachse. Cézanne wollte den Impressionismus zu etwas Dauerhaftem machen, wie die Kunst der Museen. Seine Art, Formen aus Farbflächen aufzubauen und mehrere Blickwinkel zu verbinden, führte direkt zum Kubismus von Picasso und Braque. Deshalb gilt er als Vater der modernen Kunst. Eine andere Fassung wurde 2011 an Katar verkauft und gehört zu den teuersten Bildern der Welt.","s":["Musée d'Orsay, Paris",48.86,2.327]},{"k":"a058","b":0,"t":"Der Denker","a":"Auguste Rodin","j":"1880 bis 1904","y":1904,"e":4,"r":"Europa","o":["Paris",48.855,2.316],"x":"Ein muskulöser nackter Mann sitzt vorgebeugt, das Kinn auf die Hand gestützt, ganz in Gedanken versunken. Ursprünglich war die Figur als Dante gedacht, der von oben auf sein Werk, die Höllenpforte, blickt. Später löste Rodin sie heraus und vergrößerte sie, so wurde sie zum allgemeinen Symbol des denkenden Menschen. Bemerkenswert ist, dass das Denken als körperliche Anstrengung gezeigt wird, jeder Muskel ist angespannt. Rodins bewegte, aufgeraute Oberflächen, die das Licht einfangen, machten ihn zum Wegbereiter der modernen Skulptur. Weltweit gibt es über zwanzig autorisierte Bronzegüsse, unter anderem in Paris, Philadelphia und Tokio. Der Denker ist eine der meistparodierten Figuren der Kunstgeschichte und steht für Philosophie, Bildung und Zweifel."},{"k":"a059","b":0,"t":"Der Kuss","a":"Gustav Klimt","j":"1908","y":1908,"e":4,"r":"Europa","o":["Wien",48.208,16.374],"x":"Ein Liebespaar umarmt sich am Rand einer Blumenwiese, eingehüllt in goldene Gewänder, die zu einer einzigen schimmernden Form verschmelzen. Klimt verwendete echtes Blattgold, angeregt durch die byzantinischen Mosaiken, die er in Ravenna gesehen hatte. Das Gewand des Mannes ist mit schwarzen und weißen Rechtecken gemustert, das der Frau mit bunten Kreisen und Blumen, männlich und weiblich als Ornament. Ihr Gesicht ist entspannt und hingegeben, seins abgewandt, die Füße der Frau krallen sich an den Rand des Abgrunds. Das Bild ist der Höhepunkt der goldenen Periode Klimts und ein Hauptwerk des Wiener Jugendstils. Es verbindet Malerei und Kunsthandwerk und hebt die Grenze zwischen Fläche und Raum auf. Heute ist es eines der populärsten Kunstwerke der Welt und ein Wahrzeichen Wiens."},{"k":"a060","b":0,"t":"Seerosen","a":"Claude Monet","j":"1914 bis 1926","y":1920,"e":4,"r":"Europa","o":["Giverny, Frankreich",49.076,1.534],"x":"In den letzten drei Jahrzehnten seines Lebens malte Monet fast nur noch seinen Seerosenteich in Giverny, rund 250 Bilder entstanden. Die großen Seerosen-Dekorationen im Musée de l'Orangerie bestehen aus acht riesigen Wandbildern, die zwei ovale Räume ganz umgeben. Es gibt keinen Horizont, keinen Rand und keinen festen Standpunkt mehr, Himmel, Wasser, Spiegelungen und Pflanzen fließen ineinander. Monet schenkte die Bilder nach dem Ersten Weltkrieg dem französischen Staat als Denkmal des Friedens. Trotz eines grauen Stars, der seine Farbwahrnehmung veränderte, arbeitete er bis zu seinem Tod daran. Lange als Alterswerk belächelt, wurden die Seerosen nach 1945 von den amerikanischen abstrakten Expressionisten wie Jackson Pollock als Vorläufer gefeiert. Sie stehen am Übergang vom Impressionismus zur abstrakten Kunst.","s":["Musée de l'Orangerie, Paris",48.864,2.323]},{"k":"a061","b":0,"t":"Bronzemaske von Sanxingdui","a":"Sanxingdui-Kultur","j":"ca. 1200 v. Chr.","y":-1200,"e":1,"r":"Asien","o":["Sichuan, China",30.997,104.204],"x":"Die Bronzemasken von Sanxingdui mit ihren riesigen, hervorquellenden Augen und weit abstehenden Ohren gehören zu den rätselhaftesten Funden der Archäologie. Sie stammen aus einer Bronzezeitkultur im Sichuan-Becken, die keine Schrift hinterließ und in keiner chinesischen Chronik erwähnt wird. Die Funde von 1986 stellten die Vorstellung infrage, dass sich die chinesische Zivilisation allein vom Gelben Fluss aus entwickelte. Neben Masken fanden sich eine 2,6 Meter hohe Bronzefigur, Bronzebäume mit Vögeln und Goldmasken. Die Augen werden als Symbol übermenschlichen Sehens oder als Darstellung eines Ahnen gedeutet. Technisch zeugen die großen Güsse von hochentwickelter Metallurgie. Neue Grabungen seit 2019 haben weitere Opfergruben mit Hunderten Objekten freigelegt, und die Forschung ist in vollem Gange."},{"k":"a062","b":0,"t":"Ischtar-Tor","a":"Babylon unter Nebukadnezar II.","j":"ca. 575 v. Chr.","y":-575,"e":1,"r":"Asien","o":["Babylon, Irak",32.536,44.421],"x":"Das Ischtar-Tor war das prächtigste Stadttor Babylons und Teil einer Prozessionsstraße, über die beim Neujahrsfest die Götterbilder getragen wurden. Seine Wände bestehen aus leuchtend blau glasierten Ziegeln, auf denen Stiere, Löwen und Drachen mit Schlangenkopf und Vogelkrallen schreiten. Die Tiere waren den Göttern Adad, Ischtar und Marduk zugeordnet und sollten Stärke und göttlichen Schutz zeigen. Die Technik der farbig glasierten Reliefziegel war eine Meisterleistung der Keramik. Babylon war damals eine der größten Städte der Welt, das Tor stand im Zusammenhang mit dem Bild vom Turmbau zu Babel und den Hängenden Gärten. Die Rekonstruktion im Pergamonmuseum gibt eine Vorstellung von der Wirkung altorientalischer Architektur. Zugleich steht sie für die Geschichte der Grabungen der Kolonialzeit und die Frage nach dem Verbleib von Kulturerbe.","s":["Pergamonmuseum, Berlin",52.521,13.397]},{"k":"a063","b":0,"t":"Pergamonaltar","a":"Hellenistisch","j":"ca. 170 v. Chr.","y":-170,"e":1,"r":"Asien","o":["Pergamon, Türkei",39.133,27.184],"x":"Der Pergamonaltar ist eines der berühmtesten Bauwerke der hellenistischen Zeit und Namensgeber des Berliner Pergamonmuseums. Sein über hundert Meter langer Fries zeigt die Gigantomachie, den Kampf der olympischen Götter gegen die Giganten. Die Figuren sind in kühnem Hochrelief gearbeitet, sie winden sich, stürzen, beißen und treten fast aus der Wand heraus. Schlangenbeinige Giganten, Löwen und Hunde verstärken das Chaos, eine Dramatik, die man den Pergamenischen Barock nennt. Der Fries feierte zugleich die Siege der Könige von Pergamon über die Galater als Sieg der Ordnung über die Barbarei. Ein kleinerer Fries erzählt die Geschichte des Stadtgründers Telephos, eine der frühesten fortlaufenden Bilderzählungen. Der Altar beeinflusste Künstler von Rubens bis zu modernen Bildhauern.","s":["Pergamonmuseum, Berlin",52.521,13.397]},{"k":"a064","b":0,"t":"Terrakotta-Armee","a":"Qin-Dynastie","j":"ca. 210 v. Chr.","y":-210,"e":1,"r":"Asien","o":["Xi'an, China",34.385,109.279],"x":"Über 8000 lebensgroße Krieger aus gebranntem Ton, dazu Pferde, Wagen und Waffen, bewachen das Grab Qin Shihuangdis, des ersten Kaisers Chinas. Die Armee ist in Schlachtordnung aufgestellt, mit Bogenschützen, Infanterie, Offizieren und Wagenlenkern. Jeder Krieger hat ein eigenes Gesicht, eine eigene Frisur und Haltung, obwohl die Körper aus standardisierten Teilen zusammengesetzt wurden. Diese Mischung aus Massenproduktion und Individualisierung ist einzigartig in der Kunstgeschichte. Ursprünglich waren alle Figuren bunt bemalt, die Farben verblassten bei der Freilegung in wenigen Minuten. Das Grab des Kaisers selbst ist bis heute ungeöffnet, auch weil man es nicht beschädigen will. Die Armee zeigt den Machtanspruch eines Herrschers, der China einte, Schrift, Maße und Münzen vereinheitlichte und sich sogar im Tod umgeben wollte."},{"k":"a065","b":0,"t":"Ermahnungen der Hofdame","a":"Gu Kaizhi (zugeschrieben)","j":"4. Jh., Kopie 6. bis 8. Jh.","y":380,"e":1,"r":"Asien","o":["Nanjing, China",32.06,118.797],"x":"Die Ermahnungen der Hofdame gelten als eines der frühesten erhaltenen Werke der chinesischen Malerei auf Seide. Die Querrolle illustriert einen Text, der Hofdamen zu Tugend, Bescheidenheit und Loyalität mahnt, in Szenen voller Eleganz. Eine Hofdame stellt sich mutig zwischen Kaiser und Bären, eine andere betrachtet sich im Spiegel, ein Paar streitet im Bett. Die Linien sind fein und fließend, die Figuren schweben ohne Hintergrund auf der Seide. Gu Kaizhi gilt als einer der Begründer der chinesischen Figurenmalerei, auch wenn das erhaltene Werk vermutlich eine spätere Kopie ist. Kaiser und Sammler versahen die Rolle über Jahrhunderte mit Siegeln und Kommentaren, sie ist damit auch ein Dokument chinesischer Sammelkultur. Die Rolle wird wegen ihrer Empfindlichkeit nur selten gezeigt.","s":["British Museum, London",51.519,-0.127]},{"k":"a066","b":0,"t":"Wandmalereien von Ajanta","a":"Buddhistische Mönche und Künstler","j":"ca. 460","y":460,"e":1,"r":"Asien","o":["Ajanta, Indien",20.552,75.703],"x":"Die rund 30 in eine Felswand gehauenen Höhlen von Ajanta enthalten die bedeutendsten erhaltenen Wandmalereien des alten Indien. Sie erzählen das Leben des Buddha und die Jatakas, Geschichten seiner früheren Leben, mit Prinzen, Tieren, Palästen und Wäldern. Berühmt ist der Bodhisattva Padmapani mit der Lotusblüte, dessen gesenkter Blick Mitgefühl und innere Ruhe ausdrückt. Die Figuren sind weich modelliert, ihre Haltungen anmutig, die Kompositionen dicht und lebendig. Die Malereien entstanden im Halbdunkel mit Pigmenten auf Lehm- und Kalkputz. Die Höhlen dienten als Klöster und Gebetshallen für buddhistische Mönche. Sie prägten die buddhistische Kunst in ganz Asien, von Sri Lanka bis China und Japan, und gehören zum UNESCO-Welterbe."},{"k":"a067","b":0,"t":"Wolkenmädchen von Sigiriya","a":"Singhalesisch","j":"ca. 477","y":477,"e":1,"r":"Asien","o":["Sigiriya, Sri Lanka",7.957,80.76],"x":"In einer geschützten Nische einer fast 200 Meter hohen Felswand schweben gemalte Frauen in Wolken, mit Blumen, Schmuck und durchscheinenden Gewändern. König Kashyapa ließ auf dem Felsen einen Palast mit Gärten, Wasserbecken und einem Löwentor anlegen. Wer die Frauen darstellen, Himmelsnymphen, Hofdamen oder Göttinnen, ist ungeklärt. Ihre weichen Körper und anmutigen Gesten zeigen Verwandtschaft mit den Malereien von Ajanta. Unterhalb liegt die sogenannte Spiegelwand, auf der Besucher schon ab dem 8. Jahrhundert Verse über die Frauen schrieben, eines der frühesten Zeugnisse von Kunstrezeption. Ursprünglich soll es Hunderte solcher Figuren gegeben haben. Sigiriya ist UNESCO-Welterbe und eines der eindrücklichsten Beispiele für die Verbindung von Landschaft, Architektur und Malerei."},{"k":"a068","b":0,"t":"Großer Buddha von Leshan","a":"Tang-Dynastie","j":"713 bis 803","y":803,"e":2,"r":"Asien","o":["Leshan, China",29.545,103.773],"x":"Mit 71 Metern Höhe ist der Buddha von Leshan die größte aus Stein gehauene Buddhafigur der Welt. Er sitzt am Zusammenfluss dreier Flüsse, gegenüber dem heiligen Berg Emei. Der Mönch Haitong begann das Werk 713 in der Hoffnung, der Buddha möge die gefährlichen Strömungen für die Schiffer beruhigen. Tatsächlich veränderte der abgetragene Schutt die Strömung. Das Werk dauerte 90 Jahre, ein ausgeklügeltes Entwässerungssystem in Haaren, Ohren und Gewand schützt die Figur bis heute vor Erosion. Dargestellt ist Maitreya, der Buddha der Zukunft, in ruhiger Sitzhaltung. Die Figur zeigt die enge Verbindung von Religion, Landschaft und Monumentalität in der chinesischen Kunst. Allein ein Zeh ist breiter als ein Mensch groß ist."},{"k":"a069","b":0,"t":"Diamant-Sutra","a":"Tang-Dynastie","j":"868","y":868,"e":2,"r":"Asien","o":["Dunhuang, China",40.142,94.662],"x":"Das Diamant-Sutra ist das älteste vollständig erhaltene gedruckte Buch der Welt mit Datum, fast 600 Jahre vor Gutenberg. Die über fünf Meter lange Papierrolle wurde mit Holzblöcken gedruckt und enthält einen zentralen Text des Mahayana-Buddhismus. Ihr Titelbild zeigt den Buddha im Gespräch mit seinem Schüler Subhuti, umgeben von Mönchen, Göttern und Löwen. Ein Satz am Ende sagt, dass ein gewisser Wang Jie die Rolle im Jahr 868 zum Gedenken an seine Eltern drucken ließ. Damit belegt sie, dass Druck in China längst entwickelt war und für religiöse Verbreitung genutzt wurde. Sie stammt aus der Bibliothekshöhle der Mogao-Grotten, die um das Jahr 1000 versiegelt wurde. Für die Geschichte von Bild, Schrift und Medien ist sie ein Schlüsselobjekt.","s":["British Library, London",51.53,-0.128]},{"k":"a070","b":0,"t":"Reisende zwischen Bergen und Flüssen","a":"Fan Kuan","j":"ca. 1000","y":1000,"e":2,"r":"Asien","o":["Shaanxi, China",34.9,108.9],"x":"Ein gewaltiger Berg ragt fast über die ganze Bildhöhe empor, ein dünner Wasserfall stürzt an seiner Flanke herab. Erst bei genauem Hinsehen entdeckt man unten rechts eine kleine Karawane mit Maultieren, winzig vor der Natur. Das über zwei Meter hohe Hängebild ist ein Hauptwerk der monumentalen Landschaftsmalerei der Nördlichen Song-Dynastie. Fan Kuan soll lange in den Bergen gelebt haben, um die Natur selbst statt alter Vorbilder zu studieren. Die Felsen sind mit tausenden kurzen Tuschetupfen, den sogenannten Regentropfen-Strichen, gestaltet. Im Laub versteckt sich seine Signatur, die erst 1958 entdeckt wurde. Das Bild steht für eine Weltsicht, in der der Mensch Teil einer übermächtigen Natur ist, und gilt als eines der größten Meisterwerke der chinesischen Malerei.","s":["Nationales Palastmuseum, Taipeh",25.102,121.549]},{"k":"a071","b":0,"t":"Shiva Nataraja","a":"Chola-Dynastie","j":"ca. 1100","y":1100,"e":2,"r":"Asien","o":["Tamil Nadu, Indien",10.787,79.138],"x":"Shiva tanzt als König des Tanzes in einem Flammenkranz, eine der bekanntesten Bildformeln der indischen Kunst. Mit vier Armen hält er die Trommel der Schöpfung und das Feuer der Zerstörung, eine Hand gewährt Schutz, eine weist auf den erhobenen Fuß als Weg der Befreiung. Unter seinem Fuß liegt ein Zwerg, das Symbol der Unwissenheit. Der Tanz stellt den ewigen Kreislauf von Entstehung, Erhaltung und Vergehen des Universums dar. Die Chola-Bronzen aus Südindien wurden im Wachsausschmelzverfahren gegossen und bei Prozessionen umhergetragen. Ihre Verbindung von Bewegung und Gleichgewicht ist technisch und künstlerisch herausragend. Am CERN in Genf steht eine Nataraja-Statue als Sinnbild für den kosmischen Tanz der Teilchen, was die Strahlkraft der Bildidee bis heute zeigt.","s":["Rijksmuseum, Amsterdam",52.36,4.885]},{"k":"a072","b":0,"t":"Qingming-Rolle","a":"Zhang Zeduan","j":"ca. 1100","y":1100,"e":2,"r":"Asien","o":["Kaifeng, China",34.797,114.308],"x":"Die über fünf Meter lange Querrolle zeigt das Leben entlang eines Flusses in der Song-Hauptstadt Kaifeng am Qingming-Fest. Man entrollt sie Stück für Stück und reist von ländlichen Feldern über eine belebte Brücke bis in die Stadt mit Läden, Gasthäusern und Stadttor. Über 800 Menschen, Kamele, Ochsen und Boote sind mit großer Genauigkeit dargestellt. Berühmt ist die Szene an der Regenbogenbrücke, wo ein Schiff knapp an einer Kollision vorbeischrammt und Menschen aufgeregt rufen. Das Bild ist ein einzigartiges Dokument städtischen Lebens, Handels und Handwerks im mittelalterlichen China. Es wurde über Jahrhunderte unzählige Male kopiert und ist in China als Nationalschatz so bekannt wie bei uns die Mona Lisa. 2010 wurde es auf der Expo in Schanghai als riesige animierte Version gezeigt.","s":["Palastmuseum, Peking",39.916,116.397]},{"k":"a073","b":0,"t":"Genji-Rolle","a":"Heian-Zeit","j":"ca. 1130","y":1130,"e":2,"r":"Asien","o":["Kyoto, Japan",35.012,135.768],"x":"Die Genji-Rollen sind die ältesten erhaltenen Illustrationen der Geschichte vom Prinzen Genji, die die Hofdame Murasaki Shikibu um 1000 schrieb, oft als erster Roman der Welt bezeichnet. Die Bilder blicken schräg von oben in Räume ohne Dach, eine Technik namens fukinuki yatai, und gewähren so Einblick in das höfische Leben. Die Gesichter sind stark vereinfacht, mit Strichen als Augen und einem Haken als Nase, Gefühle zeigen sich in Haltung, Farbe und Komposition. Schiebewände, Vorhänge und diagonale Linien trennen Figuren und zeigen ihre Einsamkeit oder Nähe. Kalligrafierte Textpassagen wechseln mit den Bildern ab. Das Werk begründete den Stil der Yamato-e, der eigenständigen japanischen Malerei. Es gilt als Nationalschatz Japans und als Vorläufer der Bilderzählung bis hin zum Manga.","s":["Tokugawa-Museum, Nagoya",35.19,136.933]},{"k":"a074","b":0,"t":"Großer Buddha von Kamakura","a":"Kamakura-Zeit","j":"1252","y":1252,"e":2,"r":"Asien","o":["Kamakura, Japan",35.317,139.536],"x":"Die über 13 Meter hohe Bronzefigur des Buddha Amida sitzt in tiefer Meditation unter freiem Himmel. Sie wurde aus über 30 einzeln gegossenen Teilen zusammengesetzt, eine technische Meisterleistung des 13. Jahrhunderts. Ursprünglich stand sie in einer großen Halle, die durch Stürme und eine Flutwelle im späten 15. Jahrhundert zerstört wurde. Seitdem verwittert die Bronze im Freien und hat ihre grüne Patina bekommen. Die Haltung der Hände, das Mudra der Meditation, und der leicht gesenkte Blick drücken vollkommene Ruhe aus. Amida verspricht Gläubigen die Wiedergeburt im Reinen Land, eine Lehre, die damals breite Schichten erreichte. Die Figur ist innen hohl und kann betreten werden. Sie ist eines der Wahrzeichen Japans."},{"k":"a075","b":0,"t":"Ardabil-Teppich","a":"Safawiden, Meister Maqsud von Kaschan","j":"1539 bis 1540","y":1540,"e":3,"r":"Asien","o":["Ardabil, Iran",38.25,48.293],"x":"Der Ardabil-Teppich ist der berühmteste Teppich der Welt und ein Hauptwerk der persischen Kunst. Er misst über zehn mal fünf Meter und hat rund 26 Millionen Knoten. In der Mitte strahlt ein goldgelbes Medaillon wie eine Sonne, umgeben von Lampen und rankenden Blüten auf tiefblauem Grund. Die Lampen beziehen sich auf einen Vers des Koran über Gott als Licht des Himmels und der Erde. Er wurde für das Heiligtum des Scheichs Safi ad-Din in Ardabil geschaffen, dem Ahnherrn der Safawiden-Dynastie. Eine Inschrift nennt den Meister Maqsud von Kaschan und das Jahr nach islamischer Zeitrechnung. Der Teppich zeigt, dass die Grenze zwischen Kunst und Kunsthandwerk in vielen Kulturen nicht existiert, und beeinflusste Design und Ornament weltweit.","s":["Victoria and Albert Museum, London",51.497,-0.172]},{"k":"a076","b":0,"t":"Die große Welle vor Kanagawa","a":"Katsushika Hokusai","j":"ca. 1831","y":1831,"e":4,"r":"Asien","o":["Edo (Tokio), Japan",35.676,139.65],"x":"Eine riesige Welle mit krallenartigen Schaumkronen türmt sich über drei Booten mit Ruderern auf, in der Ferne erscheint der Fuji winzig klein. Der Farbholzschnitt gehört zur Serie Sechsunddreißig Ansichten des Berges Fuji und ist das bekannteste Werk der japanischen Kunst. Hokusai verwendete das neu eingeführte Berliner Blau, das den Drucken eine besondere Leuchtkraft verlieh. Die Komposition spielt mit dem Gegensatz von bedrohlicher Bewegung und ruhendem Berg, von nah und fern. Da Holzschnitte in hoher Auflage gedruckt wurden, waren sie für breite Schichten erschwinglich, eine frühe Form populärer Bildkultur. Nach der Öffnung Japans löste die Welle in Europa den Japonismus aus und beeinflusste Monet, van Gogh, Debussy und den Jugendstil. Heute ist sie Emoji, Logo und Tattoo-Motiv zugleich.","s":["Metropolitan Museum, New York",40.779,-73.963]},{"k":"a077","b":0,"t":"Felsbilder von Tassili n'Ajjer","a":"Sahara-Kulturen","j":"ca. 6000 v. Chr. und später","y":-6000,"e":0,"r":"Afrika","o":["Tassili n'Ajjer, Algerien",25.5,9.0],"x":"In einem Felsplateau mitten in der algerischen Sahara finden sich über 15.000 Felsbilder aus mehreren Jahrtausenden. Sie zeigen Elefanten, Giraffen, Rinderherden, Jäger, tanzende Menschen und rätselhafte Figuren mit runden Köpfen. Damit dokumentieren sie, dass die Sahara einst eine grüne Savanne mit Seen war, bevor sie vor etwa 5000 Jahren austrocknete. Forscher unterscheiden Epochen nach Motiven, von Wildtierbildern über Rinderhirten bis zu Pferde- und Kamelbildern. Die Malereien sind eine wichtige Quelle für Klimageschichte, Religion und Alltag früher afrikanischer Kulturen. Die Laufende gehörnte Frau gehört zu den berühmtesten Motiven. Tassili n'Ajjer ist UNESCO-Welterbe und eines der größten Freilichtmuseen der Welt."},{"k":"a078","b":0,"t":"Große Sphinx von Gizeh","a":"Altes Reich, vermutlich unter Chephren","j":"ca. 2500 v. Chr.","y":-2500,"e":1,"r":"Afrika","o":["Gizeh, Ägypten",29.975,31.138],"x":"Die Große Sphinx ist die größte Monumentalskulptur des Altertums, 73 Meter lang und 20 Meter hoch. Aus dem anstehenden Kalkstein gehauen, verbindet sie den Körper eines liegenden Löwen mit dem Kopf eines Pharaos mit Königstuch. Sie wird meist dem Pharao Chephren zugeschrieben, dessen Pyramide dahinter liegt, und bewacht die Nekropole von Gizeh. Löwe und König verbinden Stärke und Herrschaft, später wurde sie als Sonnengott verehrt. Zwischen ihren Pfoten steht die Traumstele des Thutmosis IV., der sie vom Sand befreite. Die fehlende Nase wurde nicht von Napoleons Soldaten abgeschossen, sondern bereits im Mittelalter absichtlich zerstört. Die Sphinx wurde zum Symbol Ägyptens und des Rätselhaften überhaupt und erscheint in unzähligen Filmen, Romanen und Bildern."},{"k":"a079","b":0,"t":"Totenbuch des Hunefer","a":"Neues Reich","j":"ca. 1285 v. Chr.","y":-1285,"e":1,"r":"Afrika","o":["Theben, Ägypten",25.719,32.657],"x":"Das Totenbuch des Schreibers Hunefer enthält die berühmteste Darstellung des Totengerichts in der ägyptischen Kunst. Der schakalköpfige Gott Anubis führt Hunefer zur Waage, auf der sein Herz gegen die Feder der Göttin Maat, der Wahrheit, gewogen wird. Der ibisköpfige Thot notiert das Ergebnis, das Ungeheuer Ammit wartet darauf, ein zu schweres Herz zu verschlingen. Da Hunefer besteht, führt ihn Horus zu Osiris, dem Herrscher des Jenseits. Die Bilder folgen den strengen ägyptischen Darstellungsregeln mit Kopf und Beinen im Profil und Oberkörper in Frontalansicht. Totenbücher waren Sammlungen von Sprüchen, die den Verstorbenen sicher ins Jenseits geleiten sollten. Die Szene ist eine Schlüsselquelle für das ägyptische Weltbild und hat Vorstellungen vom Jüngsten Gericht in späteren Religionen beeinflusst.","s":["British Museum, London",51.519,-0.127]},{"k":"a080","b":0,"t":"Grab der Nefertari","a":"Neues Reich","j":"ca. 1255 v. Chr.","y":-1255,"e":1,"r":"Afrika","o":["Theben, Ägypten",25.728,32.592],"x":"Das Grab der Königin Nefertari, der Lieblingsgemahlin Ramses' II., gilt als das schönste Grab Ägyptens, manchmal auch als die Sixtinische Kapelle des Alten Ägypten. Die Wände sind über und über mit leuchtenden Malereien auf Stuck bedeckt, unter einer Decke aus goldenen Sternen auf blauem Grund. Nefertari erscheint in durchsichtigem weißem Gewand vor Göttern, bringt Opfer dar und spielt Senet, ein Brettspiel, das für die Reise ins Jenseits steht. Ihre Haut ist mit Schattierungen modelliert, was in der ägyptischen Malerei selten ist. Inschriften nennen sie die, für di
