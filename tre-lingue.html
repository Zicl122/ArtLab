<!-- Eigenständige Version. Keine externen Anfragen, keine Schriften von Drittanbietern, kein Server. Der Lernfortschritt liegt nur im localStorage des jeweiligen Browsers. -->
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

<style>
/* Layout: eine Spalte wie eine iOS-App. Karten und Sticker sind leicht schräg gestellt, jede Sprache hat ihre eigene Farbe. */
:root{
  --bg:#EDEFF4; --surface:#FFFFFF; --ink:#17181C; --muted:#5F6370; --line:rgba(23,24,28,.12);
  --en:#0069E0; --fr:#D91F47; --it:#0E8F47; --on-c:#FFFFFF;
  --good:#157A43; --bad:#C2410C; --glass:rgba(237,239,244,.8);
  --shadow:0 1px 2px rgba(20,22,30,.06),0 14px 34px -14px rgba(20,22,30,.22);
  --display:"Bricolage Grotesque","SF Pro Display",-apple-system,system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text",Figtree,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0D11; --surface:#1B1C22; --ink:#F4F4F7; --muted:#A0A3B0; --line:rgba(244,244,247,.14);
  --en:#5AB0FF; --fr:#FF7A93; --it:#46D585; --on-c:#0C0D11;
  --good:#5BE08F; --bad:#FFA066; --glass:rgba(12,13,17,.8);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0D11; --surface:#1B1C22; --ink:#F4F4F7; --muted:#A0A3B0; --line:rgba(244,244,247,.14);
  --en:#5AB0FF; --fr:#FF7A93; --it:#46D585; --on-c:#0C0D11;
  --good:#5BE08F; --bad:#FFA066; --glass:rgba(12,13,17,.8);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 56px;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#app{max-width:560px;margin:0 auto}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c,var(--en)) 70%,transparent);outline-offset:2px}

.l-en{--c:var(--en)} .l-fr{--c:var(--fr)} .l-it{--c:var(--it)}

/* Kopf */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 2px 4px}
.hero h1{font:800 clamp(34px,10vw,46px)/.95 var(--display);letter-spacing:-.03em}
.sticker{display:inline-block;background:var(--c,var(--ink));color:var(--on-c);font:700 13px/1 var(--display);letter-spacing:.02em;
  padding:8px 12px;border-radius:12px;transform:rotate(2deg);box-shadow:var(--shadow);white-space:nowrap}
.sub{color:var(--muted);padding:6px 2px 4px}

/* Sprachkarten */
.tile{background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 24%,transparent);
  border-radius:30px;padding:20px;margin:20px 0;box-shadow:var(--shadow);transform:rotate(var(--rot,0deg))}
.tile-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font:800 15px/1 var(--display);letter-spacing:.08em;color:var(--c)}
.tile h2{font:800 30px/1.05 var(--display);letter-spacing:-.02em;margin:10px 0 6px}
.meta{color:var(--muted);font-size:15px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--c) 18%,transparent);margin:14px 0 16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;min-width:6px}
.bar2{position:relative}.bar2 i{position:absolute;left:0;top:0}.bar2 .b1{background:color-mix(in srgb,var(--c) 45%,transparent)}.bar2 .b2{background:var(--c);min-width:0}
.seg{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:84px;border:1.5px solid color-mix(in srgb,var(--c) 35%,transparent);background:transparent;border-radius:16px;padding:8px 10px;cursor:pointer;text-align:center;line-height:1.2}
.seg button b{display:block;font:800 17px var(--display);color:var(--c)}
.seg button span{font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c)}
.seg button[aria-pressed="true"] b,.seg button[aria-pressed="true"] span{color:var(--on-c)}
.adv{background:var(--surface);border-radius:16px;padding:10px 12px;margin:0 0 14px;font-size:15px}
.link{background:none;border:0;padding:0;color:var(--c);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* Buttons */
.btn{appearance:none;border:0;cursor:pointer;border-radius:999px;padding:13px 20px;font-weight:650;font-size:16px;line-height:1.1;
  background:color-mix(in srgb,var(--c,var(--ink)) 13%,transparent);color:var(--c,var(--ink));transition:transform .12s ease}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--c,var(--ink));color:var(--on-c)}
.btn.wide{width:100%;margin-top:18px;padding:16px 20px;font-size:17px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row .grow{flex:1 1 140px}
.chip{display:inline-block;font:700 12px/1 var(--display);letter-spacing:.05em;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);padding:6px 9px;border-radius:99px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.icon{appearance:none;border:0;cursor:pointer;width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--c,var(--ink)) 12%,transparent);color:var(--c,var(--ink))}
.icon.sm{width:34px;height:34px}

/* Italienisch Extras */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0 10px}
.mini{--c:var(--it);text-align:left;cursor:pointer;border:1px solid color-mix(in srgb,var(--c) 24%,transparent);
  background:color-mix(in srgb,var(--c) 8%,var(--surface));border-radius:24px;padding:16px;box-shadow:var(--shadow);min-width:0}
.mini:nth-child(1){transform:rotate(.3deg)} .mini:nth-child(2){transform:rotate(-.3deg)}
.mini h3{font:800 20px/1.1 var(--display);margin:8px 0 4px;letter-spacing:-.01em}
.mini p{color:var(--muted);font-size:14px}

/* Fuß */
.foot{margin-top:34px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.foot .btn{font-size:14px;padding:10px 14px}

/* Sitzung */
.topbar{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);padding:8px 0}
.topbar h2{font:800 20px var(--display);flex:1}
.prog{flex:1;height:8px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--ink)) 16%,transparent);overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s ease}
.cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.note{color:var(--muted);font-size:14px;padding:4px 2px}
.flash{position:relative;background:var(--surface);border-radius:30px;padding:24px 22px 22px;margin:26px 0 8px;box-shadow:var(--shadow);
  transform:rotate(-.3deg);animation:pop .28s ease both}
.flash::before{content:"";position:absolute;inset:0;border-radius:30px;background:color-mix(in srgb,var(--c) 22%,var(--bg));
  transform:rotate(1deg) translateY(5px);z-index:-1}
.flash .sticker{position:absolute;top:-14px;right:14px}
@keyframes pop{from{transform:rotate(-1deg) translateY(10px)}to{transform:rotate(-.3deg)}}
@media (prefers-reduced-motion: reduce){.flash{animation:none}.btn,.prog i{transition:none}}
.wordrow{display:flex;align-items:center;gap:10px;margin-top:14px}
.word{font:800 clamp(30px,9vw,40px)/1.05 var(--display);letter-spacing:-.025em;overflow-wrap:anywhere;margin-top:12px}
.wordrow .word{margin-top:0}
.word.sm{font-size:clamp(22px,6.4vw,28px);line-height:1.15}
.de{font-size:20px;color:var(--c);font-weight:650;margin-top:6px}
.ask{color:var(--muted);font-size:15px;margin-top:6px}
.ex{margin-top:14px;font-size:18px;line-height:1.5}
.ex mark{background:color-mix(in srgb,var(--c) 22%,transparent);color:inherit;border-radius:6px;padding:0 4px;font-weight:650}
.exde{color:var(--muted);margin-top:4px;font-size:15px}
.cloze{font-size:22px;line-height:1.55;margin-top:14px;font-weight:500}
.blank{display:inline-block;border-bottom:3px solid var(--c);margin:0 2px;height:1em;vertical-align:-3px}
.clue{color:var(--c);font-weight:650;margin-top:10px}
.answer{margin-top:20px}
.input{width:100%;font:600 20px var(--body);padding:15px 16px;border-radius:18px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.input:focus{outline:0;border-color:var(--c)}
.hintline{min-height:22px;margin-top:8px;color:var(--muted);font-size:14px}
.fb{margin-top:20px;border-radius:20px;padding:16px 18px;background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.fb.bad{background:color-mix(in srgb,var(--bad) 14%,var(--bg))}
.fb>b{color:var(--good);font:800 15px var(--display);letter-spacing:.02em}
.fb.bad>b{color:var(--bad)}
.fb .ans{font:800 26px/1.15 var(--display);margin-top:6px;overflow-wrap:anywhere}
.fb .given{color:var(--muted);font-size:14px;margin-top:4px}
.fb .ex{font-size:16px;margin-top:10px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{appearance:none;text-align:left;cursor:pointer;border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:14px 16px;font-size:17px;font-weight:550;line-height:1.3;transition:transform .12s}
.opt:active{transform:scale(.98)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg))}
.opt[disabled]{cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stats div{background:var(--bg);border-radius:18px;padding:12px;text-align:center}
.stats b{display:block;font:800 26px var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}

/* Grammatik */
.lesson{--c:var(--it);display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;margin:12px 0;
  border:1px solid color-mix(in srgb,var(--c) 22%,transparent);background:color-mix(in srgb,var(--c) 8%,var(--surface));
  border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.lesson b{flex:1;font:800 18px/1.2 var(--display);min-width:0}
.lesson .sc{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.prose{margin-top:16px;line-height:1.55}
.prose p+p,.prose ul{margin-top:10px}
.prose ul{padding-left:20px}
.prose li{margin-top:4px}
.prose code{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:6px;padding:1px 6px;font-weight:650}
.tw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td:first-child{color:var(--muted)}
.tabs{display:flex;gap:6px;margin:10px 0 4px}
.tabs button{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:14px;padding:9px 6px;font-weight:650;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--on-c)}

/* Vokabelkasten als Bild, fünf Fächer mit eingelegten Karten */
.kasten{display:grid;grid-template-columns:.8fr repeat(5,1fr);gap:6px;margin:16px 0 4px;align-items:end}
.kfach{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:14px 14px 10px 10px;padding:0;height:148px;position:relative;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow)}
.kfach[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.kfach .kl{position:absolute;top:6px;left:0;right:0;text-align:center;font:700 11px var(--body);color:var(--muted);letter-spacing:.02em}
.kfach .kn{position:absolute;top:20px;left:0;right:0;text-align:center;font:800 18px var(--display);font-variant-numeric:tabular-nums}
.kfach .stack{position:relative;height:96px;margin:0 5px 6px}
.kk{position:absolute;left:0;right:0;height:16px;border-radius:5px;background:var(--c);border:1.5px solid color-mix(in srgb,var(--c) 55%,#000);bottom:calc(var(--i)*11px);transform:rotate(var(--r));animation:einlegen .6s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:var(--d)}
.kfach.f0 .kk{background:color-mix(in srgb,var(--c) 22%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.kfach.f4 .kk,.kfach.f5 .kk{background:var(--c)}
.kfach .more{position:absolute;right:2px;top:-14px;font:700 10px var(--body);color:var(--muted)}
.kfach .due{position:absolute;right:4px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--bad)}
@keyframes einlegen{from{opacity:0;transform:translate(-90px,-30px) rotate(-12deg)}to{opacity:1;transform:rotate(var(--r))}}
.kkap{font-size:12px;color:var(--muted);margin:4px 2px 0;display:grid;grid-template-columns:.8fr repeat(5,1fr);gap:6px;text-align:center}
.hop{position:relative;margin:14px 0 4px;padding:12px 12px 10px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.hop .track{position:relative;height:30px;margin:2px 14px 0}
.hop .track::before{content:"";position:absolute;left:0;right:0;top:14px;height:3px;border-radius:2px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.hop .pt{position:absolute;top:8px;width:15px;height:15px;margin-left:-7px;border-radius:50%;background:var(--surface);border:2px solid color-mix(in srgb,var(--c) 45%,transparent)}
.hop .tk{position:absolute;top:2px;width:26px;height:26px;margin-left:-13px;border-radius:8px;background:var(--c);border:2px solid color-mix(in srgb,var(--c) 55%,#000);left:var(--to);animation:hop .8s cubic-bezier(.3,.8,.3,1) both;animation-delay:.12s;transform:rotate(-6deg)}
.hop .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:2px 8px 0}
.hop p{margin:6px 0 0;font-weight:700;font-size:14px}
@keyframes hop{from{left:var(--from)}to{left:var(--to)}}
@media (prefers-reduced-motion: reduce){.kk,.hop .tk{animation:none}}
.fach{display:block;width:100%;text-align:left;cursor:pointer;margin:10px 0 0;border:1.5px solid var(--line);background:var(--surface);border-radius:20px;padding:13px 14px;box-shadow:var(--shadow)}
.fach[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.fach .fh{display:flex;align-items:center;gap:12px}
.fach .no{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font:800 18px var(--display);background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);flex:none}
.fach .tx{flex:1;min-width:0}
.fach .tx b{display:block;font-weight:700}
.fach .tx span{font-size:13px;color:var(--muted)}
.fach .n{font:800 24px var(--display);font-variant-numeric:tabular-nums}
.fach .bar{margin:10px 0 0}
.vh{font:800 20px var(--display);margin:24px 0 2px;letter-spacing:-.01em}
.vlist{margin:6px 0 0;padding:0;list-style:none}
.vlist li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.vlist .v{flex:1;min-width:0}
.vlist .v b{display:block;overflow-wrap:anywhere}
.vlist .v span{color:var(--muted);font-size:14px}
.vlist .w{font-size:13px;color:var(--muted);white-space:nowrap}
.rule{height:1px;background:var(--line);margin:18px 0 4px}
.flash.turn{animation:turn .32s ease both}
@keyframes turn{from{transform:perspective(900px) rotateY(75deg)}to{transform:rotate(-.3deg)}}
@media (prefers-reduced-motion: reduce){.flash.turn{animation:none}}
</style>

<script>

{id:'g1',lvl:'A1',title:'Der bestimmte Artikel',body:
`<p>Der Artikel richtet sich nach Geschlecht, Zahl und Anfangslaut des Wortes.</p>`+
T(['','männlich','weiblich'],[['Singular','<code>il</code> libro<br><code>lo</code> studente<br><code>l\'</code>amico','<code>la</code> casa<br><code>l\'</code>amica'],['Plural','<code>i</code> libri<br><code>gli</code> studenti, amici','<code>le</code> case, amiche']])+
`<ul><li><code>lo</code> und <code>gli</code> stehen vor s + Konsonant, z, gn und ps.</li><li><code>l'</code> steht vor Vokal, männlich und weiblich.</li><li>Sonst gilt <code>il</code> und <code>i</code>.</li><li>Endung -o ist meist männlich, -a meist weiblich. Bei -e musst du das Geschlecht lernen.</li></ul>`,
ex:[{t:'mc',q:'___ libro',o:['il','lo','la'],a:'il'},{t:'mc',q:'___ studente',o:['il','lo',"l'"],a:'lo'},{t:'mc',q:'___ amica',o:['la',"l'",'le'],a:"l'"},{t:'mc',q:'___ ragazze',o:['le','la','i'],a:'le'},{t:'mc',q:'___ zaino (Rucksack)',o:['il','lo',"l'"],a:'lo'}]},
{id:'g2',lvl:'A1',title:'essere und avere',body:
`<p>Die zwei wichtigsten Verben. Beide sind unregelmäßig und kommen in fast jedem Satz vor.</p>`+
T(['','essere (sein)','avere (haben)'],[['io','sono','ho'],['tu','sei','hai'],['lui, lei','è','ha'],['noi','siamo','abbiamo'],['voi','siete','avete'],['loro','sono','hanno']])+
`<p>Italienisch sagt oft <code>avere</code>, wo Deutsch <em>sein</em> sagt: <code>Ho fame</code> (Ich habe Hunger), <code>Ho 30 anni</code> (Ich bin 30 Jahre alt).</p>`,
ex:[{t:'fill',q:'Io ___ di Colonia. (essere)',a:['sono']},{t:'fill',q:'Tu ___ fame? (avere)',a:['hai']},{t:'fill',q:'Noi ___ stanchi. (essere)',a:['siamo']},{t:'fill',q:'Marco ___ due fratelli. (avere)',a:['ha']},{t:'fill',q:'Voi ___ pronti? (essere)',a:['siete']}]},
{id:'g3',lvl:'A1',title:'Verben auf -are im Präsens',body:
`<p>Die meisten italienischen Verben enden auf -are. Du streichst <code>-are</code> und hängst die Endung an.</p>`+
T(['','parlare'],[['io','parlo'],['tu','parli'],['lui, lei','parla'],['noi','parliamo'],['voi','parlate'],['loro','parlano']])+
`<p>Das Personalpronomen darfst du meist weglassen, die Endung zeigt die Person. Bei <code>mangiare</code> heißt es <code>mangi</code> und <code>mangiamo</code>, das i bleibt nicht doppelt.</p>`,
ex:[{t:'fill',q:'Io ___ (abitare) a Colonia.',a:['abito']},{t:'fill',q:'Noi ___ (mangiare) la pizza.',a:['mangiamo']},{t:'fill',q:'Loro ___ (parlare) italiano.',a:['parlano']},{t:'fill',q:'Tu ___ (lavorare) molto.',a:['lavori']},{t:'fill',q:'Lei ___ (comprare) il pane.',a:['compra']}]},
{id:'g4',lvl:'A1',title:'Der Plural',body:
`<p>Der Plural verändert die Endung.</p>`+
T(['Endung','Plural','Beispiel'],[['-o','-i','il libro → i libri'],['-a','-e','la casa → le case'],['-e','-i','il fiore → i fiori'],['-ca, -ga','-che, -ghe','l\'amica → le amiche']])+
`<p>Betonte Endungen und Fremdwörter bleiben gleich: <code>il caffè</code> → <code>i caffè</code>. Merke dir außerdem <code>l'uomo</code> → <code>gli uomini</code>.</p>`,
ex:[{t:'mc',q:'il libro → ___',o:['i libri','i libro','le libri'],a:'i libri'},{t:'mc',q:'la casa → ___',o:['le case','le casi','i case'],a:'le case'},{t:'mc',q:'il fiore → ___',o:['i fiori','le fiore','i fiore'],a:'i fiori'},{t:'mc',q:"l'amico → ___",o:['gli amici','le amici','i amici'],a:'gli amici'},{t:'mc',q:"l'amica → ___",o:['le amice','le amiche','gli amiche'],a:'le amiche'}]},
{id:'g5',lvl:'A1',title:'Verneinung, Fragen, c\'è',body:
`<p><code>non</code> steht direkt vor dem Verb: <code>Non parlo francese.</code></p>
<p>Fragen bildest du mit gleicher Wortstellung und steigender Betonung: <code>Parli italiano?</code></p>
<ul><li><code>che cosa</code> was, <code>dove</code> wo, <code>quando</code> wann</li><li><code>perché</code> warum und weil, <code>come</code> wie, <code>quanto</code> wie viel</li></ul>
<p><code>c'è</code> heißt es gibt (Singular), <code>ci sono</code> es gibt (Plural).</p>`,
ex:[{t:'fill',q:'Io ___ parlo francese. (Ich spreche kein Französisch.)',a:['non']},{t:'fill',q:'___ un bar qui vicino? (Gibt es hier in der Nähe eine Bar?)',a:["c'è"]},{t:'fill',q:'___ due bagni in casa. (Es gibt zwei Bäder im Haus.)',a:['ci sono']},{t:'fill',q:'___ costa? (Was kostet das?)',a:['quanto']},{t:'fill',q:'___ abiti? (Wo wohnst du?)',a:['dove']}]},
{id:'g6',lvl:'A2',title:'mi piace und mi piacciono',body:
`<p><code>piacere</code> funktioniert andersherum als <em>mögen</em>. Das Ding, das gefällt, ist das Subjekt. Du bildest es mit der Person und dem Verb in der Singular- oder Pluralform.</p>`+
T(['Person','Singular','Plural'],[['mir','mi piace il caffè','mi piacciono i gatti'],['dir','ti piace','ti piacciono'],['ihm, ihr','gli, le piace','gli, le piacciono'],['uns','ci piace','ci piacciono']])+
`<p>Bei einem Infinitiv steht immer die Singularform: <code>Mi piace cantare.</code></p>`,
ex:[{t:'fill',q:'Mi ___ la pizza.',a:['piace']},{t:'fill',q:'Mi ___ i gatti.',a:['piacciono']},{t:'fill',q:'Ti ___ il caffè?',a:['piace']},{t:'fill',q:'Ci ___ le vacanze.',a:['piacciono']},{t:'fill',q:'A Marco ___ cantare.',a:['piace']}]},
{id:'g7',lvl:'A2',title:'Passato prossimo',body:
`<p>Die Vergangenheit im Alltag. Du nimmst <code>avere</code> oder <code>essere</code> im Präsens und das Partizip.</p>`+
T(['Infinitiv','Partizip'],[['-are','-ato (mangiare → mangiato)'],['-ere','-uto (vendere → venduto)'],['-ire','-ito (capire → capito)']])+

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
const norm=s=>s.toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?;:"“”()]/g,'').replace(/\s+/g,' ').trim();
const lead=s=>s.replace(/^(il |lo |la |l'|i |gli |le |les |un |une |uno |una |to |se |s')/,'');
function judge(input,targets){
  const a=norm(input);if(!a)return 0;
  const cands=[];targets.forEach(t=>{const n=norm(t);cands.push(n,lead(n))});
  const mine=[a,lead(a)];
  if(mine.some(x=>cands.includes(x)))return 2;
  const sc=cands.map(strip);
  if(mine.some(x=>sc.includes(strip(x))))return 1;
  return 0;
}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5)};

const def=()=>({v:1,ts:0,lvl:{en:'B1',fr:'B1',it:'A1'},cards:{},hist:{en:[],fr:[],it:[],ph:[]},streak:{last:0,n:0},log:{},les:{}});
const merge=r=>{const d=def();const o=Object.assign(d,r,{lvl:Object.assign(d.lvl,r.lvl||{}),hist:Object.assign(d.hist,r.hist||{})});Object.keys(o.cards||{}).forEach(k=>{if(o.cards[k].box>5)o.cards[k].box=5});return o};

let CFG=null;try{CFG=JSON.parse(localStorage.getItem('tl.sync')||'null')}catch(e){}
function mergeStates(a,b){
  const ea=a.epoch||0,eb=b.epoch||0;
  if(ea!==eb){const w=ea>eb?a:b;return merge(JSON.parse(JSON.stringify(w)))}
  const n=(a.ts||0)>=(b.ts||0)?a:b,o=n===a?b:a;
  const m=merge(JSON.parse(JSON.stringify(n)));m.epoch=ea;
  const ids=new Set([...Object.keys(a.cards||{}),...Object.keys(b.cards||{})]);
  m.cards={};
  ids.forEach(k=>{const x=(a.cards||{})[k],y=(b.cards||{})[k];
    if(!x||!y){m.cards[k]=JSON.parse(JSON.stringify(x||y));return}
    const tx=x.t||0,ty=y.t||0;
    const w=tx!==ty?(tx>ty?x:y):((x.r+x.w)>=(y.r+y.w)?x:y);
    m.cards[k]=JSON.parse(JSON.stringify(w))});
  m.les=Object.assign({},o.les||{},n.les||{});
  m.log=Object.assign({},o.log||{});Object.keys(n.log||{}).forEach(k=>{m.log[k]=Math.max(m.log[k]||0,n.log[k])});
  const sa=a.streak||{last:0,n:0},sb=b.streak||{last:0,n:0};m.streak=JSON.parse(JSON.stringify(sa.last>sb.last||(sa.last===sb.last&&sa.n>=sb.n)?sa:sb));
  m.ts=Math.max(a.ts||0,b.ts||0);
  return m;
}
async function cloudSync(){

  const p=await fetch(u,{method:'PUT',body:JSON.stringify({json:JSON.stringify(S),ts:S.ts})});if(!p.ok)throw new Error('put '+p.status);

/* ---------- Lernlogik ---------- */
const rk=l=>RANK[S.lvl[l]];
function stat(l){
  const t=today(),all=ITEMS[l],r=rk(l);let due=0,sec=0;
  all.forEach(i=>{const c=S.cards[i.id];if(c&&c.box>0){if(c.due<=t)due++;if(c.box>=4)sec++}});
  const pool=all.filter(i=>RANK[i.lvl]<=r);
  const fresh=Math.min(NEWN,pool.filter(i=>!(S.cards[i.id]&&S.cards[i.id].box>0)).length);
  return{due:Math.min(due,DUEMAX),fresh,sec,pool:pool.length}
}
function pstat(){
  const t=today(),r=rk('it');let due=0,sec=0;
  PH.forEach(p=>{const c=S.cards[p.id];if(c&&c.box>0){if(c.due<=t)due++;if(c.box>=4)sec++}});
  const pool=PH.filter(p=>RANK[p.lvl]<=r);
  return{due:Math.min(due,DUEMAX),fresh:Math.min(NEWN,pool.filter(p=>!(S.cards[p.id]&&S.cards[p.id].box>0)).length),sec,pool:pool.length}
}
function activity(){
  const t=today();S.log[t]=(S.log[t]||0)+1;
  if(S.streak.last!==t){S.streak.n=S.streak.last===t-1?S.streak.n+1:1;S.streak.last=t}
  Object.keys(S.log).forEach(k=>{if(+k<t-14)delete S.log[k]});
}
function grade(id,ok,hinted,key,isNew){
  const c=S.cards[id]||(S.cards[id]={box:0,due:0,r:0,w:0});
  ok?c.r++:c.w++;c.t=Date.now();
  if(ok&&c.box>0&&c.due>today()){activity();touch();return}
  if(ok&&!hinted)c.box=Math.min(5,c.box+1);else if(ok)c.box=Math.max(1,c.box);else c.box=1;
  c.due=today()+INT[c.box];
  if(!isNew){const h=S.hist[key]||(S.hist[key]=[]);h.push(ok&&!hinted?1:0);if(h.length>30)h.shift()}
  activity();touch();
}
function advice(l){
  const h=S.hist[l]||[];if(h.length<20)return null;
  const a=h.slice(-20).reduce((x,y)=>x+y,0)/20,lv=LANGS[l].levels,ix=lv.indexOf(S.lvl[l]);
  if(a>=.85&&ix<lv.length-1)return{to:lv[ix+1],a,up:true};
  if(a<=.5&&ix>0)return{to:lv[ix-1],a,up:false};
  return null;
}
function buildWords(l){
  const t=today(),r=rk(l),all=ITEMS[l];
  const due=all.filter(i=>{const c=S.cards[i.id];return c&&c.box>0&&c.due<=t}).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due).slice(0,DUEMAX);
  const fresh=all.filter(i=>!(S.cards[i.id]&&S.cards[i.id].box>0)&&RANK[i.lvl]<=r).sort((a,b)=>RANK[b.lvl]-RANK[a.lvl]||a.i-b.i).slice(0,NEWN);
  const q=shuffle(due).map(i=>({id:i.id,k:'rec'}));
  fresh.forEach((i,n)=>q.splice(Math.min(q.length,n*3),0,{id:i.id,k:'intro'}));
  return q;
}
function buildPhrases(){
  const t=today(),r=rk('it');
  const due=PH.filter(p=>{const c=S.cards[p.id];return c&&c.box>0&&c.due<=t}).slice(0,DUEMAX);
  const fresh=PH.filter(p=>!(S.cards[p.id]&&S.cards[p.id].box>0)&&RANK[p.lvl]<=r).sort((a,b)=>RANK[b.lvl]-RANK[a.lvl]||a.i-b.i).slice(0,NEWN);
  const q=shuffle(due).map(p=>({id:p.id,k:'rec'}));
  fresh.forEach((p,n)=>q.splice(Math.min(q.length,n*3),0,{id:p.id,k:'intro'}));
  return q;
}
let lastExtra=[];
function buildExtra(pool){
  const begun=pool.filter(i=>S.cards[i.id]&&S.cards[i.id].box>0);
  let cand=begun.filter(i=>!lastExtra.includes(i.id));
  if(cand.length<8)cand=begun;
  const pick=shuffle(cand.map(i=>({i,k:S.cards[i.id].box+Math.random()*3.5}))).sort((a,b)=>a.k-b.k).slice(0,10).map(x=>x.i);
  lastExtra=pick.map(i=>i.id);
  return shuffle(pick).map(i=>({id:i.id,k:'rec'}));
}

const ui={view:'home',openLvl:null,confirm:false,bx:{tab:'it',fach:null}};
let SESS=null,LES=null,DR=null,lastView='',lastFin=0;

function startWords(l){
  let q=buildWords(l),extra=false;
  if(!q.length){q=buildExtra(ITEMS[l]);extra=true}
  if(!q.length)return;
  SESS={kind:'w',lang:l,q,i:0,phase:'ask',res:null,hint:false,mode:null,opts:null,pre:null,extra,done:false,stats:{total:0,right:0,newN:0}};
  ui.view='session';prep();render();
}
function startPhrases(){
  let q=buildPhrases(),extra=false;
  if(!q.length){q=buildExtra(PH);extra=true}
  if(!q.length)return;
  SESS={kind:'p',lang:'it',q,i:0,phase:'ask',res:null,hint:false,mode:null,opts:null,pre:null,extra,done:false,stats:{total:0,right:0,newN:0}};
  ui.view='session';prep();render();
}
function prep(){
  const s=SESS,t=s.q[s.i];if(!t)return;
  s.phase='ask';s.res=null;s.hint=false;s.pre=null;s.mode=null;s.opts=null;
  if(t.k==='intro'){s.stats.newN++;return}
  if(s.kind==='w'){
    const it=BYID[t.id],c=S.cards[t.id],b=c?c.box:0;
    if(t.retry||!it.cz)s.mode='de2t';
    else s.mode=Math.random()<(b<=1?.35:.6)?'cloze':'de2t';
  }else{
    const it=PBYID[t.id];s.mode=Math.random()<.5?'de2it':'it2de';
    const pool=PH.filter(p=>p.id!==it.id&&RANK[p.lvl]<=Math.max(rk('it'),RANK[it.lvl]));
    const d=shuffle(pool).slice(0,2);
    s.opts=shuffle([it,...d]).map(p=>({id:p.id,label:s.mode==='de2it'?p.it:p.de}));
  }
}
function finish(ok,lvl,given){
  const s=SESS,t=s.q[s.i];if(s.phase!=='ask')return;
  s.res={ok,lvl,given};s.phase='fb';lastFin=Date.now();
  if(!t.retry){
    const key=s.kind==='p'?'ph':s.lang,d=today();
    s.pre={key,day:d,card:S.cards[t.id]?Object.assign({},S.cards[t.id]):null,hist:(S.hist[key]||[]).slice(),log:S.log[d],streak:Object.assign({},S.streak)};
    grade(t.id,ok,s.hint,key,!!t.n);
    s.stats.total++;if(ok)s.stats.right++;
  }
  render();
}
function override(){
  const s=SESS,t=s.q[s.i];if(!s.res||s.res.ok||!s.pre)return;
  const p=s.pre;
  if(p.card)S.cards[t.id]=p.card;else delete S.cards[t.id];
  S.hist[p.key]=p.hist;if(p.log===undefined)delete S.log[p.day];else S.log[p.day]=p.log;S.streak=p.streak;
  grade(t.id,true,s.hint,p.key,!!t.n);
  s.res.ok=true;s.res.forgiven=true;s.stats.right++;render();
}
function next(){
  const s=SESS,t=s.q[s.i];
  if(s.res&&!s.res.ok&&!t.retry)s.q.splice(Math.min(s.q.length,s.i+4),0,{id:t.id,k:'rec',retry:true});
  s.i++;
  if(s.i>=s.q.length){s.done=true}else prep();
  render();
}
function introOk(){
  const s=SESS,t=s.q[s.i];
  s.q.splice(Math.min(s.q.length,s.i+3),0,{id:t.id,k:'rec',n:true});
  s.i++;prep();render();
}
function checkAnswer(v){
  const s=SESS,t=s.q[s.i],it=BYID[t.id];
  const tg=s.mode==='cloze'?[it.cz]:[it.w];
  const lvl=judge(v,tg);
  if(!v.trim())return;
  finish(lvl>0,lvl,v.trim());
}
function chooseOpt(i){
  const s=SESS;if(s.phase!=='ask')return;
  const t=s.q[s.i],o=s.opts[i];
  s.chosen=o.id;

function doHint(){
  const s=SESS,t=s.q[s.i],it=BYID[t.id];if(!it||s.phase!=='ask')return;

/* ---------- Lektionen ---------- */
function lessonOpen(id){LES={id,step:'read',i:0,score:0,res:null,opts:null,chosen:null};ui.view='lesson';render()}
function lessonQ(){
  const g=GR.find(x=>x.id===LES.id),e=g.ex[LES.i];
  LES.step='q';LES.res=null;LES.chosen=null;LES.opts=e.t==='mc'?shuffle(e.o):null;

function lessonAnswer(ok,lvl,given,chosen){
  LES.res={ok,lvl,given};LES.chosen=chosen;LES.step='fb';lastFin=Date.now();if(ok)LES.score++;render();
}
function lessonNext(){
  const g=GR.find(x=>x.id===LES.id);LES.i++;
  if(LES.i>=g.ex.length){
    LES.step='end';const r=S.les[g.id]||{best:0,n:0};r.best=Math.max(r.best,LES.score);r.n++;S.les[g.id]=r;activity();touch();
  }else lessonQ();
  render();
}

/* ---------- Ereignisse ---------- */
function act(a,d){
  switch(a){
    case 'home':ui.view='home';SESS=null;render();break;
    case 'start':startWords(d.lang);break;
    case 'phr':startPhrases();break;
    case 'gram':ui.view='grammar';render();break;
    case 'box':ui.bx={tab:d.tab,fach:null};ui.view='box';render();break;
    case 'boxtab':ui.bx={tab:d.tab,fach:null};render();break;
    case 'fach':ui.bx.fach=+d.n;render();break;
    case 'drill':{const q=fachItems(ui.bx.tab,d.n).map(i=>i.id);if(!q.length)break;DR={tab:ui.bx.tab,n:d.n,q:shuffle(q),total:q.length,i:0,flip:false,dir:ui.drillDir||'de2t',known:0,again:0};ui.view='drill';render();break}
    case 'flip':if(DR){DR.flip=true;render()}break;
    case 'dknow':if(DR){DR.known++;DR.i++;DR.flip=false;render()}break;
    case 'dagain':if(DR){DR.again++;DR.q.push(DR.q[DR.i]);DR.i++;DR.flip=false;render()}break;
    case 'ddir':if(DR){ui.drillDir=d.dir;DR.dir=d.dir;DR.flip=false;render()}break;
    case 'dback':ui.view='box';render();break;
    case 'lesson':lessonOpen(d.id);break;
    case 'lstart':lessonQ();render();break;
    case 'lnext':lessonNext();break;
    case 'lopt':{const g=GR.find(x=>x.id===LES.id),e=g.ex[LES.i],o=LES.opts[+d.i];lessonAnswer(o===e.a,2,'',o);break}
    case 'lvlopen':ui.openLvl=ui.openLvl===d.lang?null:d.lang;render();break;
    case 'setlvl':S.lvl[d.lang]=d.lvl;S.hist[d.lang]=[];ui.openLvl=null;touch();if(d.back){ui.view='home';SESS=null}render();break;
    case 'introOk':introOk();break;
    case 'hint':doHint();break;
    case 'idk':finish(false,0,'');break;
    case 'next':next();break;
    case 'override':override();break;
    case 'opt':chooseOpt(+d.i);break;
    case 'speak':speak(d.t,d.l);break;
    case 'export':exportState();break;
    case 'syncopen':ui.syncOpen=!ui.syncOpen;ui.syncMsg='';render();break;
    case 'synccon':syncConnect();break;
    case 'syncoff':CFG=null;try{localStorage.removeItem('tl.sync')}catch(e){}sync='local';ui.syncMsg='Getrennt. Dein Stand bleibt auf diesem Gerät.';render();break;
    case 'import':document.getElementById('impf').click();break;
    case 'reset1':ui.confirm=true;render();break;
    case 'reset0':ui.confirm=false;render();break;
    case 'reset2':S=def();S.epoch=Date.now();ui.confirm=false;touch();render();break;
  }
}
function randCode(){const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join('')}
function syncPanel(){
  const u=CFG?esc(CFG.url):'',c=esc(CFG?CFG.code:(ui.newCode||(ui.newCode=randCode())));
  return `<div class="note" style="text-align:left;margin:12px 0"><b>Geräte abgleichen</b><p class="meta">Trage auf jedem Gerät dieselbe Adresse und denselben Code ein. Den Code erzeugst du einmal, auf dem zweiten Gerät gibst du ihn genauso ein. Wer den Code kennt, kann deinen Lernstand lesen, behalte ihn also für dich.</p>
<label class="meta">Adresse der Firebase-Datenbank<input id="sdb" type="url" value="${u}" placeholder="https://…firebasedatabase.app" style="width:100%;padding:10px;border-radius:12px;border:1.5px solid var(--line);margin:4px 0 10px;font:inherit"></label>
<label class="meta">Abgleich-Code<input id="scode" type="text" value="${c}" autocapitalize="off" autocomplete="off" style="width:100%;padding:10px;border-radius:12px;border:1.5px solid var(--line);margin:4px 0 10px;font:inherit"></label>
<div class="row" style="margin:0"><button class="btn primary" data-act="synccon">${CFG?'Speichern und abgleichen':'Verbinden'}</button>${CFG?'<button class="btn" data-act="syncoff">Trennen</button>':''}<button class="btn" data-act="syncopen">Schließen</button></div>
${ui.syncMsg?`<p class="meta">${esc(ui.syncMsg)}</p>`:''}</div>`;
}
async function syncConnect(){
  const url=(document.getElementById('sdb').value||'').trim().replace(/\/+$/,''),code=(document.getElementById('scode').value||'').trim();
  if(!/^(https:\/\/|http:\/\/(127\.0\.0\.1|localhost))[^\s]+$/.test(url)||code.length<10){ui.syncMsg='Bitte gib eine https-Adresse und einen Code mit mindestens 10 Zeichen ein.';render();return}
  CFG={url,code};try{localStorage.setItem('tl.sync',JSON.stringify(CFG))}catch(e){}
  ui.syncMsg='Verbinde …';render();
  try{await cloudSync();sync='cloud';ui.syncMsg='Verbunden. Dein Stand wurde zusammengeführt.'}catch(e){sync='local';ui.syncMsg='Das hat nicht geklappt ('+(e.message||'Netzwerk')+'). Prüfe Adresse und Regeln der Datenbank.'}
  render();
}
function exportState(){
  const blob=new Blob([JSON.stringify(S)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download='tre-lingue-fortschritt.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
}
document.addEventListener('change',e=>{
  if(!e.target||e.target.id!=='impf')return;const f=e.target.files&&e.target.files[0];if(!f)return;
  f.text().then(t=>{const r=JSON.parse(t);if(!r||typeof r!=='object'||!r.cards)throw 0;S=merge(r);S.epoch=Date.now();S.ts=Date.now();cacheLocal();ui.view='home';render();clearTimeout(saveT);saveT=setTimeout(flush,500)}).catch(()=>alert('Die Datei konnte nicht gelesen werden.'));
  e.target.value='';
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;act(b.dataset.act,b.dataset)});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target,inp=f.querySelector('#ans'),v=inp?inp.value:'';
  if(f.dataset.form==='ans'){checkAnswer(v)}
  else if(f.dataset.form==='lans'){
    if(!v.trim())return;
    const g=GR.find(x=>x.id===LES.id),en=g.ex[LES.i],lvl=judge(v,en.a);
    lessonAnswer(lvl>0,lvl,v.trim(),null);
  }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.target.closest('button,input,textarea'))return;
  if(Date.now()-lastFin<350)return;
  if(ui.view==='session'&&SESS&&!SESS.done&&SESS.phase==='fb'){e.preventDefault();next()}
  else if(ui.view==='session'&&SESS&&!SESS.done&&SESS.q[SESS.i].k==='intro'){e.preventDefault();introOk()}
  else if(ui.view==='lesson'&&LES&&LES.step==='fb'){e.preventDefault();lessonNext()}
  else if(ui.view==='drill'&&DR&&DR.i<DR.q.length){e.preventDefault();act(DR.flip?'dknow':'flip',{})}
});
initStore();
})();
</script>
